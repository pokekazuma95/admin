<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce認定Platformアドミニストレーター 模擬クイズ（全100問）</title>
<style>
  :root {
    --primary: #0176d3;
    --primary-hover: #014486;
    --bg: #f3f3f3;
    --card-bg: #ffffff;
    --text: #181818;
    --border: #dddbda;
    --correct-bg: #eef4ff;
    --correct-border: #2e844a;
    --wrong-bg: #fef1ee;
    --wrong-border: #ea001e;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    line-height: 1.6;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 24px 32px;
  }
  header {
    border-bottom: 2px solid var(--primary);
    padding-bottom: 12px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0;
    color: var(--primary);
  }
  .progress {
    font-size: 0.9rem;
    font-weight: bold;
    color: #555;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .btn-sm {
    background-color: #eef4ff;
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 5px 12px;
    font-size: 0.84rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-sm:hover {
    background-color: #dceaff;
  }
  .btn-sm.active {
    background-color: var(--primary);
    color: #fff;
  }
  .badge-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    background: #e5f3ff;
    color: var(--primary);
    font-size: 0.8rem;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .question-text {
    font-size: 1.02rem;
    font-weight: bold;
    margin-bottom: 20px;
    white-space: pre-wrap;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .option-item {
    display: flex;
    align-items: flex-start;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .option-item:hover {
    background-color: #f8fbfe;
    border-color: var(--primary);
  }
  .option-item input {
    margin-top: 4px;
    margin-right: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .option-item.correct {
    background-color: var(--correct-bg);
    border-color: var(--correct-border);
    border-width: 2px;
  }
  .option-item.wrong {
    background-color: var(--wrong-bg);
    border-color: var(--wrong-border);
    border-width: 2px;
  }
  .btn {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover {
    background-color: var(--primary-hover);
  }
  .explanation-box {
    margin-top: 20px;
    padding: 16px;
    background-color: #f9f9fa;
    border-left: 4px solid var(--primary);
    border-radius: 4px;
    display: none;
  }
  .result-title {
    font-weight: bold;
    font-size: 1.1rem;
    margin-bottom: 8px;
  }
  .result-title.is-correct { color: var(--correct-border); }
  .result-title.is-wrong { color: var(--wrong-border); }
  .explanation-detail {
    font-size: 0.9rem;
    white-space: pre-wrap;
    color: #333;
  }
  .summary-screen {
    text-align: center;
    padding: 20px 0;
  }
  .score-display {
    font-size: 2.4rem;
    font-weight: bold;
    color: var(--primary);
    margin: 16px 0;
  }
</style>
</head>
<body>

<div class="container" id="app">
  <header>
    <h1>SF Platformアドミニストレーター 模擬クイズ（全100問）</h1>
    <div class="progress" id="progress">1 / 100</div>
  </header>

  <div class="toolbar">
    <button class="btn-sm active" onclick="setMode('all')" id="mode-all">全100問</button>
    <button class="btn-sm" onclick="setMode('wrong')" id="mode-wrong">間違えた問題 (<span id="wrong-count">0</span>)</button>
    <button class="btn-sm" onclick="toggleShuffle()" id="shuffle-btn">順番: 通常</button>
    <button class="btn-sm" onclick="jumpPrompt()">問題番号へ移動</button>
  </div>

  <div id="quiz-screen">
    <div class="badge-row">
      <span id="multi-badge" class="badge" style="display:none;"></span>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options-container"></div>
    <button class="btn" id="submit-btn" onclick="checkAnswer()">回答する</button>
    <button class="btn" id="next-btn" onclick="nextQuestion()" style="display:none;">次の問題へ</button>

    <div class="explanation-box" id="explanation-box">
      <div class="result-title" id="result-title"></div>
      <div class="explanation-detail" id="explanation-detail"></div>
    </div>
  </div>

  <div id="summary-screen" class="summary-screen" style="display:none;">
    <h2>演習完了！</h2>
    <div class="score-display" id="score-display"></div>
    <p id="score-message"></p>
    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px;">
      <button class="btn" onclick="restartQuiz()">もう一度挑戦する</button>
      <button class="btn" id="review-wrong-btn" onclick="setMode('wrong')" style="display:none; background-color:#6b21a8;">間違えた問題だけ復習</button>
    </div>
  </div>
</div>

<script>
const quizData = [
  {
    id: 1,
    question: "管理者は、フローで後で使用するためにレコードタイプのIDを保存する必要があります。管理者はどの種類の変数を使用すべきでしょうか？",
    options: [
      { key: "A", text: "ブール変数" },
      { key: "B", text: "テキスト変数" },
      { key: "C", text: "ID変数" },
      { key: "D", text: "レコード変数" }
    ],
    answer: ["C"],
    explanation: "正解: C\nA. ブール変数 - ブール変数は、true（真）またはfalse（偽）のどちらかの値を保存するために使用されます。レコードタイプのID（英数字の文字列）を保存するには適していません。\nB. テキスト変数 - テキスト変数は、文字列を保存するために使用されます。技術的にはIDを保存できますが、SalesforceのID専用のデータ型があるため、そちらを使用する方がベストプラクティスです。\nC. ID変数 - 正解です。ID変数は、SalesforceのレコードID（この問題の場合はレコードタイプID）を保存するために特別に用意されたデータ型です。フロー内でIDを扱う際にはこの変数を使用するのが最も適切です。\nD. レコード変数 - レコード変数は、特定のオブジェクトのレコード全体のデータ（複数の項目値）をまとめて保存するために使用されます。単一のID値のみを保存する場合には適していません。"
  },
  {
    id: 2,
    question: "Universal Containersでは、取引先をセールスコンソールで表示する場合とサービスコンソールで表示する場合に、それぞれ異なるLightningページを表示する必要があります。管理者はこの要件をどのように満たすべきでしょうか？",
    options: [
      { key: "A", text: "ページレイアウトの割り当てを更新する。" },
      { key: "B", text: "複数のレコードタイプを定義する。" },
      { key: "C", text: "Lightningページをアプリケーションのデフォルトとして割り当てる。" },
      { key: "D", text: "異なるユーザプロファイルを作成する。" }
    ],
    answer: ["C"],
    explanation: "正解: C\nA. ページレイアウトの割り当てを更新する。 - ページレイアウトは、レコード詳細ページの項目やセクションの配置を制御しますが、Lightningページ全体のコンポーネント（タブ、カスタムコンポーネントなど）を制御するものではありません。この要件は、アプリケーションごとにLightningページ自体を変更することです。\nB. 複数のレコードタイプを定義する。 - レコードタイプは、異なるビジネスプロセス、選択リストの値、ページレイアウトの割り当てに使用されます。アプリケーション（コンソール）に基づいてLightningページを切り替えるための直接的な解決策ではありません。\nC. Lightningページをアプリケーションのデフォルトとして割り当てる。 - 正解です。Lightningページの有効化（割り当て）設定では、アプリケーション（この場合はセールスコンソールとサービスコンソール）ごとに異なるLightningページを「アプリケーションのデフォルト」として割り当てることができます。\nD. 異なるユーザプロファイルを作成する。 - プロファイルに基づいてLightningページを割り当てることも可能ですが、要件は「アプリケーションごと」の切り替えです。同じユーザ（同じプロファイル）が両方のコンソールを切り替えて使用する場合、プロファイルによる制御では要件を満たせません。"
  },
  {
    id: 3,
    question: "DreamHouse Realtyには承認プロセスがあります。マネージャーがレコードを承認しようとしましたが、エラーが発生しました。管理者はこのリクエストのトラブルシューティングのために何を確認すべきでしょうか？",
    options: [
      { key: "A", text: "プロセス内の次の承認者のために、代理承認者を追加する。" },
      { key: "B", text: "プロセスで更新される項目について、項目レベルセキュリティを更新して参照できるようにする。" },
      { key: "C", text: "次の承認者のユーザが無効化されているか、または見つからないかを確認する。" },
      { key: "D", text: "プロセスで更新される項目が表示されていることを確認するために、ページレイアウトを確認する。" }
    ],
    answer: ["C"],
    explanation: "正解: C\nA. 代理承認者を追加する。 - 代理承認者は、指定された承認者が不在の場合（休暇など）に対応するための機能です。承認者が無効化されていたり、指定されていなかったりする根本的なエラーを解決するものではありません。\nB. 項目レベルセキュリティを更新して参照できるようにする。 - 項目レベルセキュリティ（FLS）が参照不可の場合、承認者が詳細を確認できない可能性はありますが、承認ステップ自体がエラーになる直接的な原因（特に次の承認者に渡せないエラー）ではありません。\nC. 次の承認者のユーザが無効化されているか、または見つからないかを確認する。 - 正解です。承認プロセスがレコードを次の承認者にルーティングしようとした際、その指定されたユーザがシステムに存在しない（見つからない）、または無効化されている場合、プロセスは続行できずエラーとなります。これは承認エラーの一般的なトラブルシューティングの確認事項です。\nD. ページレイアウトを確認する。 - ページレイアウトは、ユーザインターフェース上で項目がどのように表示されるかを制御します。承認プロセスはバックグラウンドで動作するため、項目がページレイアウト上で非表示になっていても、承認のルーティングエラーの直接的な原因にはなりません。"
  },
  {
    id: 4,
    question: "Ursa Major Solarには、サポートキューにルーティングされるサービスレベルアグリーメント（SLA）があります。24時間のSLA（の期限）に達したケースは、自動的に次の階層のキューに再割り当てされる必要があります。この要件を満たすために使用すべき機能はどれですか？",
    options: [
      { key: "A", text: "アインシュタインケースルーティング" },
      { key: "B", text: "自動レスポンスルール" },
      { key: "C", text: "ケース割り当てルール" },
      { key: "D", text: "ケースエスカレーションルール" }
    ],
    answer: ["D"],
    explanation: "正解: D\nA. アインシュタインケースルーティング - これはAIを使用して、ケースの内容や過去のデータに基づいて、新規ケースを適切なエージェントやキューに自動的にルーティングする機能です。SLA（時間）に基づいた再割り当てには使用されません。\nB. 自動レスポンスルール - これは、Webやメールから新規ケースが作成された際に、顧客へ自動的にメール返信（例：「お問い合わせを受け付けました」）を送信するためのルールです。ケースの再割り当ては行いません。\nC. ケース割り当てルール - これは、新規作成されたケースを、定義された条件（例：ケースの発生源や種別）に基づいて特定のユーザやキューに割り当てるためのルールです。SLAの時間経過には対応しません。\nD. ケースエスカレーションルール - 正解です。これは、ケースが特定の時間（例：ケースの経過時間）内にクローズされない場合に、定義されたアクション（例：別のキューやユーザへの再割り当て、通知）を自動的に実行するルールです。24時間のSLAに基づいて次の階層に再割り当てするという要件に合致します。"
  },
  {
    id: 5,
    question: "Ursa Major Solarは、太陽エネルギー製品の販売を追跡するために商談を使用しています。同社には、異なるエネルギー市場に焦点を当てた2つの独立した営業チームがあります。サービスチームも、設置を追跡するために商談を使用したいと考えています。3つのチームすべてが、異なる項目とフェーズを使用する必要があります。管理者はこの要件をどのように設定すべきでしょうか？",
    options: [
      { key: "A", text: "3つのセールスプロセスを作成する。3つのレコードタイプと1つのページレイアウトを作成する。" },
      { key: "B", text: "1つのセールスプロセスを作成する。3つのレコードタイプと3つのページレイアウトを作成する。" },
      { key: "C", text: "3つのセールスプロセスを作成する。3つのレコードタイプと3つのページレイアウトを作成する。" },
      { key: "D", text: "1つのセールスプロセスを作成する。1つのレコードタイプと3つのページレイアウトを作成する。" }
    ],
    answer: ["C"],
    explanation: "正解: C\nA. 3つのセールスプロセスを作成する。3つのレコードタイプと1つのページレイアウトを作成する。 - 「1つのページレイアウト」では、3つのチームが「異なる項目」を表示するという要件を満たすことができません。\nB. 1つのセールスプロセスを作成する。3つのレコードタイプと3つのページレイアウトを作成する。 - 「1つのセールスプロセス」では、3つのチームが「異なるフェーズ」を使用するという要件を満たすことができません。セールスプロセスは、商談で使用できるフェーズの選択リスト値を定義します。\nC. 3つのセールスプロセスを作成する。3つのレコードタイプと3つのページレイアウトを作成する。 - 正解です。3つのチームが「異なるフェーズ」（3つのセールスプロセスが必要）と「異なる項目」（3つのページレイアウトが必要）を必要とするため、これらをユーザに割り当てるために3つのレコードタイプが必要です。\nD. 1つのセールスプロセスを作成する。1つのレコードタイプと3つのページレイアウトを作成する。 - 「1つのセールスプロセス」と「1つのレコードタイプ」では、3つのチームの異なるニーズ（異なるフェーズと異なる項目の組み合わせ）に対応することができません。"
  },
  {
    id: 6,
    question: "Salesforceユーザのグローバルチームをサポートしている管理者が、組織（会社）設定を行うよう依頼されました。2つのオプションを選択してください",
    options: [
      { key: "A", text: "通貨ロケール" },
      { key: "B", text: "デフォルトの言語" },
      { key: "C", text: "パスワードポリシー" },
      { key: "D", text: "ログイン時間" }
    ],
    answer: ["A", "B"],
    explanation: "正解: A, B\nA. 通貨ロケール - 正解です。これは「組織情報」ページで設定される主要な組織（会社）設定の一つです。組織全体のデフォルトの通貨形式（例：$、￥など）を定義し、グローバルな運用に不可欠です。\nB. デフォルトの言語 - 正解です。これも「組織情報」ページで設定される主要な組織（会社）設定です。ユーザが個人設定で言語を指定していない場合に使用される、組織の標準言語を定義します。\nC. パスワードポリシー - これは組織全体のセキュリティ設定（パスワードの長さ、有効期限など）を管理しますが、「組織情報」ページで設定される主要な「組織（会社）設定」とは区別されます（通常は「パスワードポリシー」で設定します）。\nD. ログイン時間 - これは組織（会社）設定ではなく、プロファイルごとに設定されます。特定のプロファイルのユーザがシステムにログインできる時間帯を制限する機能です。"
  },
  {
    id: 7,
    question: "営業マネージャーは、商談のフェーズに基づいて重要な値を表示するために、何を実装できるかを知りたがっています。管理者はこの要件を満たすためにどのツールを使用すべきでしょうか？",
    options: [
      { key: "A", text: "動的フォーム" },
      { key: "B", text: "パスの主要項目" },
      { key: "C", text: "商談プロセス" },
      { key: "D", text: "ワークフロールール" }
    ],
    answer: ["B"],
    explanation: "正解: B\nA. 動的フォーム - 動的フォームは、Lightningページのコンポーネントや項目を、特定の条件（フェーズなど）に基づいて動的に表示または非表示にする機能です。要件を満たす可能性はありますが、フェーズの進捗に合わせて特定の項目を「強調表示」する機能としては、パスがより適しています。\nB. パスの主要項目 - 正解です。パス（Sales Path）コンポーネントは、商談のフェーズ（または他のオブジェクトの選択リスト）を視覚的に表示する機能です。この機能には、各フェーズで特に重要な項目（最大5つ）を「主要項目」として設定し、ユーザに強調表示する機能が含まれています。\nC. 商談プロセス - 商談プロセス（セールスプロセス）は、特定のレコードタイプに対して、商談の「フェーズ」選択リストで使用できる値（フェーズ）を定義するものです。項目値を表示または強調表示する機能ではありません。\nD. ワークフロールール - ワークフロールールは、特定の条件が満たされたときに項目更新やメール送信などのアクションを自動化する（古い）機能です。UI上でユーザに項目を強調表示する機能ではありません。"
  },
  {
    id: 8,
    question: "Northern Trail Outfittersでは、ケースオブジェクトが非公開に設定されています。サポートマネージャーは、担当者が予想よりも広範なデータのビューを持っており、グループのダッシュボードですべてのケースを見ることができるという懸念を提起しました。担当者がダッシュボード上のデータに不適切にアクセスできる原因となっている可能性のあるものは何ですか？",
    options: [
      { key: "A", text: "ダッシュボードの検索条件" },
      { key: "B", text: "ダッシュボードの登録" },
      { key: "C", text: "動的ダッシュボード" },
      { key: "D", text: "公開ダッシュボード" }
    ],
    answer: ["C"],
