<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce認定Platformアドミニストレーター 模擬クイズ（全110問）</title>
<style>
  :root {
    --primary: #0176d3;
    --primary-hover: #014486;
    --bg: #f3f3f3;
    --card-bg: #ffffff;
    --text: #181818;
    --border: #dddbda;
    --correct-bg: #eef4ff;
    --correct-border: #2e844a;
    --wrong-bg: #fef1ee;
    --wrong-border: #ea001e;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    line-height: 1.6;
  }
  .container {
    max-width: 780px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    padding: 24px 32px;
  }
  header {
    border-bottom: 2px solid var(--primary);
    padding-bottom: 12px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0;
    color: var(--primary);
  }
  .progress {
    font-size: 0.9rem;
    font-weight: bold;
    color: #555;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .btn-sm {
    background-color: #eef4ff;
    color: var(--primary);
    border: 1px solid var(--primary);
    padding: 5px 12px;
    font-size: 0.84rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-sm:hover {
    background-color: #dceaff;
  }
  .btn-sm.active {
    background-color: var(--primary);
    color: #fff;
  }
  .badge-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    background: #e5f3ff;
    color: var(--primary);
    font-size: 0.8rem;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .badge-ai {
    background: #f3e8ff;
    color: #6b21a8;
  }
  .question-text {
    font-size: 1.02rem;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .option-item {
    display: flex;
    align-items: flex-start;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .option-item:hover {
    background-color: #f8fbfe;
    border-color: var(--primary);
  }
  .option-item input {
    margin-top: 4px;
    margin-right: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .option-item.correct {
    background-color: var(--correct-bg);
    border-color: var(--correct-border);
    border-width: 2px;
  }
  .option-item.wrong {
    background-color: var(--wrong-bg);
    border-color: var(--wrong-border);
    border-width: 2px;
  }
  .btn {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover {
    background-color: var(--primary-hover);
  }
  .explanation-box {
    margin-top: 20px;
    padding: 16px;
    background-color: #f9f9fa;
    border-left: 4px solid var(--primary);
    border-radius: 4px;
    display: none;
  }
  .result-title {
    font-weight: bold;
    font-size: 1.1rem;
    margin-bottom: 8px;
  }
  .result-title.is-correct { color: var(--correct-border); }
  .result-title.is-wrong { color: var(--wrong-border); }
  .explanation-detail {
    font-size: 0.9rem;
    white-space: pre-wrap;
    color: #333;
  }
  .summary-screen {
    text-align: center;
    padding: 20px 0;
  }
  .score-display {
    font-size: 2.4rem;
    font-weight: bold;
    color: var(--primary);
    margin: 16px 0;
  }
</style>
</head>
<body>

<div class="container" id="app">
  <header>
    <h1>SF Platformアドミニストレーター 模擬クイズ（全110問）</h1>
    <div class="progress" id="progress">1 / 110</div>
  </header>

  <div class="toolbar">
    <button class="btn-sm active" onclick="setMode('all')" id="mode-all">全110問</button>
    <button class="btn-sm" onclick="setMode('ai')" id="mode-ai">Agentforce (101-110)</button>
    <button class="btn-sm" onclick="setMode('wrong')" id="mode-wrong">間違えた問題 (<span id="wrong-count">0</span>)</button>
    <button class="btn-sm" onclick="toggleShuffle()" id="shuffle-btn">順番: 通常</button>
    <button class="btn-sm" onclick="jumpPrompt()">問題番号へ移動</button>
  </div>

  <div id="quiz-screen">
    <div class="badge-row">
      <span id="section-badge" class="badge">過去問100題</span>
      <span id="multi-badge" class="badge" style="display:none;"></span>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options-container"></div>
    <button class="btn" id="submit-btn" onclick="checkAnswer()">回答する</button>
    <button class="btn" id="next-btn" onclick="nextQuestion()" style="display:none;">次の問題へ</button>

    <div class="explanation-box" id="explanation-box">
      <div class="result-title" id="result-title"></div>
      <div class="explanation-detail" id="explanation-detail"></div>
    </div>
  </div>

  <div id="summary-screen" class="summary-screen" style="display:none;">
    <h2>演習完了！</h2>
    <div class="score-display" id="score-display"></div>
    <p id="score-message"></p>
    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px;">
      <button class="btn" onclick="restartQuiz()">もう一度挑戦する</button>
      <button class="btn" id="review-wrong-btn" onclick="setMode('wrong')" style="display:none; background-color:#6b21a8;">間違えた問題だけ復習</button>
    </div>
  </div>
</div>

<script>
const quizData = [
  {
    id: 1,
    question: "Cloud Kicksのマーケティングチームは、製品への関心を引くためにキャンペーンを使用しています。彼らは実行する各キャンペーンのキャンペーンメンバーのステータス項目にカスタム選択リスト値を求めていますが、現在は管理者に値の追加や削除を依頼しており、非常に時間がかかっています。マーケティングチームがキャンペーンメンバーのステータス選択リスト値を自分でカスタマイズできるようにするには、どの2つのユーザー権限が必要ですか？ 2つ選択してください。",
    options: [
      { key: "A", text: "キャンペーンメンバーの作成および編集" },
      { key: "B", text: "マーケティングユーザー機能ライセンス" },
      { key: "C", text: "アプリケーションのカスタマイズ権限" },
      { key: "D", text: "キャンペーンの編集権限" }
    ],
    answer: ["B", "D"],
    explanation: "正解: B, D\nA. キャンペーンメンバーレコード自体のデータ作成・編集権限であり、ステータス選択リスト値のカスタマイズ権限は含まれません。\nB. マーケティングユーザー機能ライセンス - 正解です。高度なキャンペーン設定（キャンペーンメンバーステータスの値のカスタマイズなど）を行う権限が付与されます。\nC. システム全体のカスタマイズを許可する強力な管理者権限であり、一般ユーザーへ付与するべきではありません。\nD. キャンペーンの編集権限 - 正解です。対象となるキャンペーンレコード自体に対する編集権限が必要です。"
  },
  {
    id: 2,
    question: "Ursa Majorの新しい営業担当者に、対話の準備が整った評価済みのリードがあります。リードの取引開始プロセスを使用する際、作成できる2つのレコードはどれですか？ 2つ選択してください。",
    options: [
      { key: "A", text: "取引先" },
      { key: "B", text: "キャンペーン" },
      { key: "C", text: "ケース" },
      { key: "D", text: "取引先責任者" }
    ],
    answer: ["A", "D"],
    explanation: "正解: A, D\nリードの取引開始時に作成（または既存レコードにマージ）できるのは、取引先、取引先責任者、および商談です。キャンペーンやケースは自動作成されません。"
  },
  {
    id: 3,
    question: "Ursa Major Solarのコールセンターマネージャーは、ケースの発生源、ステータス、所有者別にドリルダウンできるケースダッシュボードをエージェントに提供したいと考えています。この要望を満たすために、管理者はダッシュボードに何を追加するべきですか？",
    options: [
      { key: "A", text: "ダッシュボード検索条件" },
      { key: "B", text: "バケット列" },
      { key: "C", text: "ダッシュボードコンポーネント" },
      { key: "D", text: "複合グラフ" }
    ],
    answer: ["A"],
    explanation: "正解: A\nダッシュボード検索条件を使用すると、1つのダッシュボード上で発生源、ステータス、所有者などの条件に基づいてデータを動的に絞り込めます。"
  },
  {
    id: 4,
    question: "Northern Trail Outfittersのマーケティングディレクターは、リードステータス項目を評価済みとしてマークするために、予算項目に入力することを求めています。管理者はこの要請を満たすためにどのツールを使用するべきですか？",
    options: [
      { key: "A", text: "リードの取引開始" },
      { key: "B", text: "必須項目" },
      { key: "C", text: "ワークフロールール" },
      { key: "D", text: "入力規則" }
    ],
    answer: ["D"],
    explanation: "正解: D\n特定のリードステータス（評価済み）の時だけ予算項目を必須にするような条件付きの検証・保存ブロックには「入力規則」を使用します。"
  },
  {
    id: 5,
    question: "cloud kicksの管理者は、ユーザーがsalesforceで繰り返しToDoを追加できないと報告を受けました。ユーザーがこれを行えるようにするために、管理者が使用すべき2つの解決策はどれですか？2つの回答を選択してください。",
    options: [
      { key: "A", text: "活動設定で「定期的なToDoの作成を有効化」を有効にする" },
      { key: "B", text: "共有活動を無効にする" },
      { key: "C", text: "ページレイアウトに「一連の定期的なToDoの作成」項目を追加する" },
      { key: "D", text: "ToDoの通知サービスをオンにする" }
    ],
    answer: ["A", "C"],
    explanation: "正解: A, C\n活動設定で「定期的なToDoの作成を有効化」を有効にし、ToDoのページレイアウトに「一連の定期的なToDoの作成」項目を追加します。"
  },
  {
    id: 6,
    question: "dream house realtyのイベントマネージャーは、成功したオープンハウスで獲得した有望なリードを、関連する商談を持つ取引先責任者に変換する必要があります。関連付けられたキャンペーンメンバーの履歴を保持したまま、キャンペーンからこれを達成するにはどうすればよいですか？",
    options: [
      { key: "A", text: "リードを削除し、新しい取引先責任者と商談を作成する。" },
      { key: "B", text: "リードをコピーし、コピーしたレコードを取引先責任者に変換する。" },
      { key: "C", text: "キャンペーンメンバーの詳細ページからリードの取引を開始する。" },
      { key: "D", text: "キャンペーンメンバーの詳細ページから取引先責任者を追加する。" }
    ],
    answer: ["C"],
    explanation: "正解: C\nキャンペーンメンバーの詳細ページから直接リードの取引を開始することで、キャンペーンメンバーの履歴を保持したまま取引先・取引先責任者・商談に変換できます。"
  },
  {
    id: 7,
    question: "Ursa Major Solarは、設置するすべてのパネルに1年間の保証を提供しています。設置の詳細と保証情報は「Installation（設置）」というカスタムオブジェクトに取り込まれます。設置レコードは、モバイルアプリから設置担当者によって作成されます。設置が遅れたり問題が発生したりした場合、顧客満足度を高めるための手段として、顧客はより長い保証を受けることがあります。管理者は、保証の有効期限を取り込むためにSalesforceをどのように構成する必要がありますか？",
    options: [
      { key: "A", text: "保証有効期限項目のデフォルト値として数式を使用する。" },
      { key: "B", text: "保証購入から1年後を表示する数式項目を作成する。" },
      { key: "C", text: "有効期限項目が確実に入力されるように入力規則を追加する。" },
      { key: "D", text: "モバイルのページレイアウトに保証有効期限項目を含める。" }
    ],
    answer: ["A"],
    explanation: "正解: A\nデフォルト値として数式を設定すれば、初期値として1年後が自動入力されつつ、後からユーザーが手動で値を上書き・延長できます。"
  },
  {
    id: 8,
    question: "cloud kicksの営業担当者は、商品の販売を成約させるために商談レコードの割引を使用しています。商談が成約した場合、関連する商談商品に手動で割引を適用する必要があります。営業マネージャーは、この時間のかかる作業を自動化する方法があるかどうかを尋ねました。管理者はこの要件を満たすために何を使用する必要がありますか？",
    options: [
      { key: "A", text: "Flow Builder" },
      { key: "B", text: "承認プロセス" },
      { key: "C", text: "事前構築済みマクロ" },
      { key: "D", text: "数式項目" }
    ],
    answer: ["A"],
    explanation: "正解: A\n商談が成約したときにトリガーされるフローを作成し、関連する商談商品レコードを一括更新して割引を適用できます。"
  },
  {
    id: 9,
    question: "管理者が組織を強化するためにAppExchangeで見つけることができる2つのソリューションはどれですか？2つの回答を選択してください。",
    options: [
      { key: "A", text: "Communities" },
      { key: "B", text: "Consultants" },
      { key: "C", text: "Components" },
      { key: "D", text: "Customers" }
    ],
    answer: ["B", "C"],
    explanation: "正解: B, C\nAppExchangeでは認定コンサルタント（Consultants）やLightningコンポーネント（Components）などを検索・利用できます。"
  },
  {
    id: 10,
    question: "Northern Trail Outfittersの管理者は、10人の新入社員のために新しいユーザーを作成しました。なぜこれらのユーザーはSalesforce組織の取引先オブジェクトにアクセスできないのでしょうか？",
    options: [
      { key: "A", text: "ユーザーのプロファイルには取引先の共有ルールが必要です。" },
      { key: "B", text: "ユーザーのプロファイルには取引先オブジェクトへの権限が必要です。" },
      { key: "C", text: "ユーザーのロールがロール階層の下位にあります。" },
      { key: "D", text: "組織の共有直接設定が非公開に設定されています。" }
    ],
    answer: ["B"],
    explanation: "正解: B\nオブジェクトにアクセスするには、割り当てられたプロファイルまたは権限セットでそのオブジェクトの権限（参照など）が付与されている必要があります。"
  },
  {
    id: 11,
    question: "Northern TrailOutfittersの管理者は、割り当てられたライセンスと権限セットを追跡するためにスプレッドシートを使用してきました。Salesforceでこれを追跡するために使用できる機能は何ですか？",
    options: [
      { key: "A", text: "ログイン履歴" },
      { key: "B", text: "Lightning利用状況アプリケーション" },
      { key: "C", text: "ユーザーレポート" },
      { key: "D", text: "権限セットグループ" }
    ],
    answer: ["C"],
    explanation: "正解: C\nユーザーレポートを作成することで、ユーザーに割り当てられているプロファイル、ライセンス、権限セットなどの情報を一覧で追跡できます。"
  },
  {
    id: 12,
    question: "Cloud Kicksには、Shipmentsというカスタムオブジェクトがあります。同社は、取引先ページからすべての配送項目を確認したいと考えています。取引先が削除されても、Shipmentsレコードは残るようにする必要があります。管理者はShipmentsと取引先の間にどのような種別の関係を作成するべきですか？",
    options: [
      { key: "A", text: "Shipmentsは取引先への参照関係を持つ必要がある。" },
      { key: "B", text: "取引先はShipmentsへの参照関係を持つ必要がある。" },
      { key: "C", text: "Shipmentsは取引先への主従関係を持つ必要がある。" },
      { key: "D", text: "取引先はShipmentsへの主従関係を持つ必要がある。" }
    ],
    answer: ["A"],
    explanation: "正解: A\n子であるShipments側に取引先への「参照関係」を作成すると、関連リストに表示しつつ、親の取引先が削除されてもShipmentsレコードは残ります。"
  },
  {
    id: 13,
    question: "Ursa Majorは取引先をシルバー、ゴールド、またはプラチナレベルに分類しています。シルバーまたはゴールドパートナーの新しいケースが作成されたとき、それは通常のサポートキューに送信される必要があります。取引先がプラチナレベルの場合、自動的に優先サポートキューに送信される必要があります。管理者はこれを達成するために何を使用するべきですか？",
    options: [
      { key: "A", text: "割り当てルール" },
      { key: "B", text: "ケースルール" },
      { key: "C", text: "ワークフロールール" },
      { key: "D", text: "エスカレーションルール" }
    ],
    answer: ["A"],
    explanation: "正解: A\n新規作成されたケースを条件に応じて適切なキューやユーザーに自動振り分けするには「割り当てルール」を使用します。"
  },
  {
    id: 14,
    question: "営業担当者は、プロセスを通じて商談レコードに入力する際、重要な項目を見落としています。担当者は前のフェーズに戻ることはできず、プロセスを前に進める必要があります。管理者はこのニーズに対処するために、どの3つのオプションを使用するべきですか？3つの回答を選択してください。",
    options: [
      { key: "A", text: "ガイド付き販売を有効にする。" },
      { key: "B", text: "入力規則を使用する。" },
      { key: "C", text: "商談パスを設定する。" },
      { key: "D", text: "フローを使用して項目を必須としてマークする。" },
      { key: "E", text: "ページレイアウトで項目を必須としてマークする。" }
    ],
    answer: ["A", "B", "E"],
    explanation: "正解: A, B, E\n入力漏れやフェーズ逆戻りの制限には、ガイド付き販売、入力規則（PRIORVALUE関数等による制御）、ページレイアウトでの必須設定が有効です。"
  },
  {
    id: 15,
    question: "Universal Containersの管理者は、ユーザーがネットワーク外からSalesforceにアクセスするのを防ぐよう求められました。この設定の考慮事項となる2つはどれですか？2つの回答を選択してください。",
    options: [
      { key: "A", text: "IPアドレスの制限は、プロファイルまたは組織全体で設定される。" },
      { key: "B", text: "ユーザーはログインIP制限を回避するためにパスワードを変更できる。" },
      { key: "C", text: "IP制限を実施するには、「すべての要求でログインIPアドレスの制限を適用」を選択する必要がある。" },
      { key: "D", text: "シングルサインオンを使用すると、ユーザーはどこからでもログインできるようになる。" }
    ],
    answer: ["A", "C"],
    explanation: "正解: A, C\nIP制限はプロファイルまたは組織全体で設定でき、「すべての要求でログインIPアドレスの制限を適用」を選択することで厳格に実施できます。"
  },

    question: "Einstein Trust Layerの機能の一つで、外部LLMに送信される前にメールアドレスや電話番号などの個人情報を隠し、安全性を高める仕組みはどれですか？",
    options: [
      { key: "A", text: "セキュア・ゲートウェイ" },
      { key: "B", text: "データのマスキング" },
      { key: "C", text: "毒性検知（Toxicity Detection）" },
      { key: "D", text: "ゼロ・リテンション" }
    ],
    answer: ["B"],
    explanation: "正解: B\nEinstein Trust Layerの「データのマスキング」により、外部LLMへ送信される前に個人識別情報（PII）を動的に検出しマスクします。"
  },
  {
    id: 110,
    question: "管理者がAgentforceにカスタムアクションを追加したいと考えています。既存の「プロンプトテンプレート」をアクションとして呼び出すために必要な設定はどれですか？",
    options: [
      { key: "A", text: "プロンプトテンプレートを「有効化」する" },
      { key: "B", text: "プロンプトテンプレートの種別を「エージェントアクション」にする" },
      { key: "C", text: "フロー内でプロンプトを呼び出し、そのフローをアクションに指定する" },
      { key: "D", text: "プロンプトテンプレートのAPI参照名を「Agent_Prompt」にする" }
    ],
    answer: ["B"],
    explanation: "正解: B\nプロンプトテンプレートをエージェントのアクションとして呼び出せるようにするには、種別・利用設定をエージェントアクションとして扱えるよう構成します。"
  }
];

let currentMode = 'all'; // 'all' | 'ai' | 'wrong'
let wrongIds = new Set();
let activeList = [...quizData];
let currentIndex = 0;
let score = 0;
let isAnswered = false;
let isShuffled = false;

function updateWrongCount() {
  document.getElementById("wrong-count").textContent = wrongIds.size;
}

function setMode(mode) {
  if (mode === 'wrong' && wrongIds.size === 0) {
    alert("まだ間違えた問題はありません。");
    return;
  }
  currentMode = mode;
  ['all', 'ai', 'wrong'].forEach(m => {
    document.getElementById(`mode-${m}`).classList.toggle('active', m === mode);
  });
  restartQuiz();
}

function toggleShuffle() {
  isShuffled = !isShuffled;
  document.getElementById("shuffle-btn").textContent = isShuffled ? "順番: ランダム" : "順番: 通常";
  restartQuiz();
}

function jumpPrompt() {
  const input = prompt(`移動したい順番（1 〜 ${activeList.length} 番目）を入力してください：`);
  if (!input) return;
  const num = parseInt(input, 10);
  if (isNaN(num) || num < 1 || num > activeList.length) {
    alert("有効な番号を入力してください。");
    return;
  }
  currentIndex = num - 1;
  document.getElementById("summary-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  document.getElementById("progress").style.display = "block";
  loadQuestion();
}

function loadQuestion() {
  isAnswered = false;
  const current = activeList[currentIndex];
  const isMulti = current.answer.length > 1;
  const isAi = current.id >= 101;

  document.getElementById("progress").textContent = `${currentIndex + 1} / ${activeList.length}`;

  const secBadge = document.getElementById("section-badge");
  secBadge.textContent = isAi ? "Agentforce対応問題" : "過去問100題";
  secBadge.className = isAi ? "badge badge-ai" : "badge";

  const multiBadge = document.getElementById("multi-badge");
  multiBadge.style.display = isMulti ? "inline-block" : "none";
  multiBadge.textContent = `${current.answer.length}つ選択`;

  document.getElementById("question-text").textContent = `【問${current.id}】 ${current.question}`;

  const container = document.getElementById("options-container");
  container.innerHTML = "";

  current.options.forEach(opt => {
    const label = document.createElement("label");
    label.className = "option-item";
    label.id = `opt-${opt.key}`;

    const input = document.createElement("input");
    input.type = isMulti ? "checkbox" : "radio";
    input.name = "quiz-option";
    input.value = opt.key;

    const span = document.createElement("span");
    span.textContent = `${opt.key}. ${opt.text}`;

    label.appendChild(input);
    label.appendChild(span);
    container.appendChild(label);
  });

  document.getElementById("submit-btn").style.display = "inline-block";
  document.getElementById("next-btn").style.display = "none";
  document.getElementById("explanation-box").style.display = "none";
}

function checkAnswer() {
  if (isAnswered) return;
  const current = activeList[currentIndex];
  const checkedInputs = Array.from(document.querySelectorAll('input[name="quiz-option"]:checked'));

  if (checkedInputs.length === 0) {
    alert("選択肢を選んでください。");
    return;
  }

  isAnswered = true;
  const userAnswers = checkedInputs.map(el => el.value).sort();
  const correctAnswers = [...current.answer].sort();

  const isCorrect = JSON.stringify(userAnswers) === JSON.stringify(correctAnswers);
  if (isCorrect) {
    score++;
    wrongIds.delete(current.id);
  } else {
    wrongIds.add(current.id);
  }
  updateWrongCount();

  document.querySelectorAll('input[name="quiz-option"]').forEach(input => {
    input.disabled = true;
    const parent = document.getElementById(`opt-${input.value}`);
    if (correctAnswers.includes(input.value)) {
      parent.classList.add("correct");
    } else if (userAnswers.includes(input.value)) {
      parent.classList.add("wrong");
    }
  });

  const titleEl = document.getElementById("result-title");
  titleEl.textContent = isCorrect ? "⭕ 正解！" : "❌ 不正解...";
  titleEl.className = "result-title " + (isCorrect ? "is-correct" : "is-wrong");

  document.getElementById("explanation-detail").textContent = current.explanation;
  document.getElementById("explanation-box").style.display = "block";

  document.getElementById("submit-btn").style.display = "none";
  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = currentIndex < activeList.length - 1 ? "次の問題へ" : "結果を見る";
  nextBtn.style.display = "inline-block";
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < activeList.length) {
    loadQuestion();
  } else {
    showSummary();
  }
}

function showSummary() {
  document.getElementById("quiz-screen").style.display = "none";
  document.getElementById("progress").style.display = "none";
  const summary = document.getElementById("summary-screen");
  summary.style.display = "block";

  const percentage = Math.round((score / activeList.length) * 100);
  document.getElementById("score-display").textContent = `${score} / ${activeList.length} 問正解 (${percentage}%)`;
  document.getElementById("score-message").textContent =
    percentage >= 70 ? "合格ライン達成です！素晴らしい結果です。" : "もう少し！解説を確認しながら復習してみましょう。";

  const reviewBtn = document.getElementById("review-wrong-btn");
  reviewBtn.style.display = wrongIds.size > 0 ? "inline-block" : "none";
}

function restartQuiz() {
  if (currentMode === 'ai') {
    activeList = quizData.filter(q => q.id >= 101);
  } else if (currentMode === 'wrong') {
    activeList = quizData.filter(q => wrongIds.has(q.id));
  } else {
    activeList = [...quizData];
  }

  if (isShuffled) {
    for (let i = activeList.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [activeList[i], activeList[j]] = [activeList[j], activeList[i]];
    }
  }

  currentIndex = 0;
  score = 0;
  document.getElementById("summary-screen").style.display = "none";
  document.getElementById("quiz-screen").style.display = "block";
  document.getElementById("progress").style.display = "block";
  loadQuestion();
}

updateWrongCount();
restartQuiz();
</script>
