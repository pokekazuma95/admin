<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>アドミン100問クイズ 2025年版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* レイアウト: 一問一画面の縦長カラム。選択肢が主役で、回答後に各選択肢の下へ解説が開く */
  :root {
    --bg: #F1F5F7;
    --surface: #FFFFFF;
    --fg: #15232C;
    --muted: #586A75;
    --line: #D3DDE3;
    --accent: #0B67A3;
    --accent-fg: #FFFFFF;
    --sel-bg: #E4F0F8;
    --ok: #17794A;
    --ok-bg: #E3F4EA;
    --ng: #B0321E;
    --ng-bg: #FBE8E3;
    --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1920;
      --surface: #16252E;
      --fg: #E5EDF1;
      --muted: #94A6B0;
      --line: #2A3D48;
      --accent: #5DB3EA;
      --accent-fg: #0A1A24;
      --sel-bg: #173648;
      --ok: #5FCB94;
      --ok-bg: #12322A;
      --ng: #FF8F78;
      --ng-bg: #3B201B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1920;
    --surface: #16252E;
    --fg: #E5EDF1;
    --muted: #94A6B0;
    --line: #2A3D48;
    --accent: #5DB3EA;
    --accent-fg: #0A1A24;
    --sel-bg: #173648;
    --ok: #5FCB94;
    --ok-bg: #12322A;
    --ng: #FF8F78;
    --ng-bg: #3B201B;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.75;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---- スタート ---- */
  .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.3; margin: 8px 0 12px; font-weight: 700; text-wrap: balance; }
  h1 .num { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
  .lead { color: var(--muted); margin: 0 0 28px; max-width: 34em; }
  .modes { display: grid; gap: 10px; }
  .mode {
    display: grid; gap: 2px; text-align: left; width: 100%;
    padding: 14px 16px; border-radius: 10px;
    background: var(--surface); border: 1.5px solid var(--line);
  }
  .mode:hover { border-color: var(--accent); }
  .mode b { font-size: 16px; }
  .mode span { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .mode.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .mode.primary span { color: inherit; opacity: .85; }
  .foot { margin-top: 36px; font-size: 12px; color: var(--muted); line-height: 1.7; }

  /* ---- 出題 ---- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
  .top .quit { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
  .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 22px; }
  .track i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
  .qtag { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .qtag .pill { padding: 1px 8px; border-radius: 999px; background: var(--sel-bg); color: var(--accent); font-weight: 700; }
  .qtext { font-size: 17px; font-weight: 500; line-height: 1.8; margin: 0 0 18px; text-wrap: pretty; }

  .banner { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 12px 16px; border-radius: 10px; margin-bottom: 14px; font-weight: 700; scroll-margin-top: 12px; }
  .banner small { font-weight: 500; font-size: 14px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }
  .banner.ng { background: var(--ng-bg); color: var(--ng); }

  .opts { display: grid; gap: 10px; }
  .opt {
    display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start;
    width: 100%; text-align: left; padding: 12px 14px;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  }
  button.opt:hover { border-color: var(--accent); }
  .opt .key {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--font-mono); font-weight: 600; font-size: 14px;
    border: 1.5px solid var(--line); color: var(--muted);
  }
  .opt .txt { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
  .opt.sel { border-color: var(--accent); background: var(--sel-bg); }
  .opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.ok .key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .opt.ng { border-color: var(--ng); background: var(--ng-bg); }
  .opt.ng .key { background: var(--ng); border-color: var(--ng); color: var(--surface); }
  .opt.miss { border: 1.5px dashed var(--ok); }
  .opt.miss .key { border-color: var(--ok); color: var(--ok); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 4px; margin-left: 8px; line-height: 1.7; vertical-align: 2px; }
  .tag.ans { background: var(--ok); color: var(--surface); }
  .tag.you { background: var(--fg); color: var(--bg); }
  .why { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px dotted var(--line); font-size: 14px; line-height: 1.8; color: var(--muted); }
  .opt.ok .why, .opt.ng .why { color: var(--fg); }

  .bar {
    position: sticky; bottom: 0; margin-top: 18px;
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bg); border-top: 1px solid var(--line);
    display: flex; gap: 12px; align-items: center; justify-content: flex-end;
  }
  .bar .count { margin-right: auto; font-size: 13px; color: var(--muted); }
  .btn { padding: 11px 22px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 700; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--accent); }

  /* ---- 結果 ---- */
  .score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 6px 0 4px; }
  .score .big { font-family: var(--font-mono); font-weight: 600; font-size: clamp(52px, 14vw, 84px); line-height: 1; color: var(--accent); }
  .score .of { font-size: 18px; color: var(--muted); }
  .verdict { color: var(--muted); margin: 0 0 22px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin: 0 0 24px; }
  .chip { height: 32px; display: grid; place-items: center; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
  .chip.ng { background: var(--ng-bg); color: var(--ng); border: 1px solid var(--ng); }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  .actions { display: grid; gap: 10px; margin-top: 8px; }
  details.rev { border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 10px; }
  details.rev summary { cursor: pointer; padding: 12px 14px; font-size: 14px; line-height: 1.7; list-style-position: inside; }
  details.rev summary b { font-family: var(--font-mono); color: var(--ng); margin-right: 6px; }
  details.rev .in { padding: 0 14px 14px; }
  details.rev .qtext { font-size: 15px; }

  @media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>

<div class="wrap" id="app"></div>

<script>
const DATA = [{"n":1,"q":"管理者は、フローで後で使用するためにレコードタイプのIDを保存する必要があります。管理者はどの種類の変数を使用すべきでしょうか？","o":[{"k":"A","t":"ブール変数","e":"ブール変数は、true（真）またはfalse（偽）のどちらかの値を保存するために使用されます。レコードタイプのID（英数字の文字列）を保存するには適していません。"},{"k":"B","t":"テキスト変数","e":"テキスト変数は、文字列を保存するために使用されます。技術的にはIDを保存できますが、SalesforceのID専用のデータ型があるため、そちらを使用する方がベストプラクティスです。"},{"k":"C","t":"ID変数","e":"正解です。ID変数は、SalesforceのレコードID（この問題の場合はレコードタイプID）を保存するために特別に用意されたデータ型です。フロー内でIDを扱う際にはこの変数を使用するのが最も適切です。"},{"k":"D","t":"レコード変数","e":"レコード変数は、特定のオブジェクトのレコード全体のデータ（複数の項目値）をまとめて保存するために使用されます。単一のID値のみを保存する場合には適していません。"}],"a":["C"]},{"n":2,"q":"Universal Containersでは、取引先をセールスコンソールで表示する場合とサービスコンソールで表示する場合に、それぞれ異なるLightningページを表示する必要があります。管理者はこの要件をどのように満たすべきでしょうか？","o":[{"k":"A","t":"ページレイアウトの割り当てを更新する。","e":"ページレイアウトは、レコード詳細ページの項目やセクションの配置を制御しますが、Lightningページ全体のコンポーネント（タブ、カスタムコンポーネントなど）を制御するものではありません。この要件は、アプリケーションごとにLightningページ自体を変更することです。"},{"k":"B","t":"複数のレコードタイプを定義する。","e":"レコードタイプは、異なるビジネスプロセス、選択リストの値、ページレイアウトの割り当てに使用されます。アプリケーション（コンソール）に基づいてLightningページを切り替えるための直接的な解決策ではありません。"},{"k":"C","t":"Lightningページをアプリケーションのデフォルトとして割り当てる。","e":"正解です。Lightningページの有効化（割り当て）設定では、アプリケーション（この場合はセールスコンソールとサービスコンソール）ごとに異なるLightningページを「アプリケーションのデフォルト」として割り当てることができます。"},{"k":"D","t":"異なるユーザプロファイルを作成する。","e":"プロファイルに基づいてLightningページを割り当てることも可能ですが、要件は「アプリケーションごと」の切り替えです。同じユーザ（同じプロファイル）が両方のコンソールを切り替えて使用する場合、プロファイルによる制御では要件を満たせません。"}],"a":["C"]},{"n":3,"q":"DreamHouse Realtyには承認プロセスがあります。マネージャーがレコードを承認しようとしましたが、エラーが発生しました。管理者はこのリクエストのトラブルシューティングのために何を確認すべきでしょうか？","o":[{"k":"A","t":"プロセス内の次の承認者のために、代理承認者を追加する。","e":"代理承認者は、指定された承認者が不在の場合（休暇など）に対応するための機能です。承認者が無効化されていたり、指定されていなかったりする根本的なエラーを解決するものではありません。"},{"k":"B","t":"プロセスで更新される項目について、項目レベルセキュリティを更新して参照できるようにする。","e":"項目レベルセキュリティ（FLS）が参照不可の場合、承認者が詳細を確認できない可能性はありますが、承認ステップ自体がエラーになる直接的な原因（特に次の承認者に渡せないエラー）ではありません。"},{"k":"C","t":"次の承認者のユーザが無効化されているか、または見つからないかを確認する。","e":"正解です。承認プロセスがレコードを次の承認者にルーティングしようとした際、その指定されたユーザがシステムに存在しない（見つからない）、または無効化されている場合、プロセスは続行できずエラーとなります。これは承認エラーの一般的なトラブルシューティングの確認事項です。"},{"k":"D","t":"プロセスで更新される項目が表示されていることを確認するために、ページレイアウトを確認する。","e":"ページレイアウトは、ユーザインターフェース上で項目がどのように表示されるかを制御します。承認プロセスはバックグラウンドで動作するため、項目がページレイアウト上で非表示になっていても、承認のルーティングエラーの直接的な原因にはなりません。"}],"a":["C"]},{"n":4,"q":"Ursa Major Solarには、サポートキューにルーティングされるサービスレベルアグリーメント（SLA）があります。24時間のSLA（の期限）に達したケースは、自動的に次の階層のキューに再割り当てされる必要があります。この要件を満たすために使用すべき機能はどれですか？","o":[{"k":"A","t":"アインシュタインケースルーティング","e":"これはAIを使用して、ケースの内容や過去のデータに基づいて、新規ケースを適切なエージェントやキューに自動的にルーティングする機能です。SLA（時間）に基づいた再割り当てには使用されません。"},{"k":"B","t":"自動レスポンスルール","e":"これは、Webやメールから新規ケースが作成された際に、顧客へ自動的にメール返信（例：「お問い合わせを受け付けました」）を送信するためのルールです。ケースの再割り当ては行いません。"},{"k":"C","t":"ケース割り当てルール","e":"これは、新規作成されたケースを、定義された条件（例：ケースの発生源や種別）に基づいて特定のユーザやキューに割り当てるためのルールです。SLAの時間経過には対応しません。"},{"k":"D","t":"ケースエスカレーションルール","e":"正解です。これは、ケースが特定の時間（例：ケースの経過時間）内にクローズされない場合に、定義されたアクション（例：別のキューやユーザへの再割り当て、通知）を自動的に実行するルールです。24時間のSLAに基づいて次の階層に再割り当てするという要件に合致します。"}],"a":["D"]},{"n":5,"q":"Ursa Major Solarは、太陽エネルギー製品の販売を追跡するために商談を使用しています。同社には、異なるエネルギー市場に焦点を当てた2つの独立した営業チームがあります。サービスチームも、設置を追跡するために商談を使用したいと考えています。3つのチームすべてが、異なる項目とフェーズを使用する必要があります。管理者はこの要件をどのように設定すべきでしょうか？","o":[{"k":"A","t":"3つのセールスプロセスを作成する。3つのレコードタイプと1つのページレイアウトを作成する。","e":"「1つのページレイアウト」では、3つのチームが「異なる項目」を表示するという要件を満たすことができません。"},{"k":"B","t":"1つのセールスプロセスを作成する。3つのレコードタイプと3つのページレイアウトを作成する。","e":"「1つのセールスプロセス」では、3つのチームが「異なるフェーズ」を使用するという要件を満たすことができません。セールスプロセスは、商談で使用できるフェーズの選択リスト値を定義します。"},{"k":"C","t":"3つのセールスプロセスを作成する。3つのレコードタイプと3つのページレイアウトを作成する。","e":"正解です。3つのチームが「異なるフェーズ」（3つのセールスプロセスが必要）と「異なる項目」（3つのページレイアウトが必要）を必要とするため、これらをユーザに割り当てるために3つのレコードタイプが必要です。"},{"k":"D","t":"1つのセールスプロセスを作成する。1つのレコードタイプと3つのページレイアウトを作成する。","e":"「1つのセールスプロセス」と「1つのレコードタイプ」では、3つのチームの異なるニーズ（異なるフェーズと異なる項目の組み合わせ）に対応することができません。"}],"a":["C"]},{"n":6,"q":"Salesforceユーザのグローバルチームをサポートしている管理者が、組織（会社）設定を行うよう依頼されました。2つのオプションを選択してください","o":[{"k":"A","t":"通貨ロケール","e":"正解です。これは「組織情報」ページで設定される主要な組織（会社）設定の一つです。組織全体のデフォルトの通貨形式（例：$、￥など）を定義し、グローバルな運用に不可欠です。"},{"k":"B","t":"デフォルトの言語","e":"正解です。これも「組織情報」ページで設定される主要な組織（会社）設定です。ユーザが個人設定で言語を指定していない場合に使用される、組織の標準言語を定義します。"},{"k":"C","t":"パスワードポリシー","e":"これは組織全体のセキュリティ設定（パスワードの長さ、有効期限など）を管理しますが、「組織情報」ページで設定される主要な「組織（会社）設定」とは区別されます（通常は「パスワードポリシー」で設定します）。"},{"k":"D","t":"ログイン時間","e":"これは組織（会社）設定ではなく、プロファイルごとに設定されます。特定のプロファイルのユーザがシステムにログインできる時間帯を制限する機能です。"}],"a":["A","B"]},{"n":7,"q":"営業マネージャーは、商談のフェーズに基づいて重要な値を表示するために、何を実装できるかを知りたがっています。管理者はこの要件を満たすためにどのツールを使用すべきでしょうか？","o":[{"k":"A","t":"動的フォーム","e":"動的フォームは、Lightningページのコンポーネントや項目を、特定の条件（フェーズなど）に基づいて動的に表示または非表示にする機能です。要件を満たす可能性はありますが、フェーズの進捗に合わせて特定の項目を「強調表示」する機能としては、パスがより適しています。"},{"k":"B","t":"パスの主要項目","e":"正解です。パス（Sales Path）コンポーネントは、商談のフェーズ（または他のオブジェクトの選択リスト）を視覚的に表示する機能です。この機能には、各フェーズで特に重要な項目（最大5つ）を「主要項目」として設定し、ユーザに強調表示する機能が含まれています。"},{"k":"C","t":"商談プロセス","e":"商談プロセス（セールスプロセス）は、特定のレコードタイプに対して、商談の「フェーズ」選択リストで使用できる値（フェーズ）を定義するものです。項目値を表示または強調表示する機能ではありません。"},{"k":"D","t":"ワークフロールール","e":"ワークフロールールは、特定の条件が満たされたときに項目更新やメール送信などのアクションを自動化する（古い）機能です。UI上でユーザに項目を強調表示する機能ではありません。"}],"a":["B"]},{"n":8,"q":"Northern Trail Outfittersでは、ケースオブジェクトが非公開に設定されています。サポートマネージャーは、担当者が予想よりも広範なデータのビューを持っており、グループのダッシュボードですべてのケースを見ることができるという懸念を提起しました。担当者がダッシュボード上のデータに不適切にアクセスできる原因となっている可能性のあるものは何ですか？","o":[{"k":"A","t":"ダッシュボードの検索条件","e":"検索条件は、ダッシュボードに表示されるデータを絞り込むために使用されますが、ユーザのレコードに対するアクセス権（共有設定）自体を変更するものではありません。"},{"k":"B","t":"ダッシュボードの登録","e":"登録は、ダッシュボードの更新情報をメールなどで受信する機能です。ダッシュボードの実行ユーザやデータの可視性を制御するものではありません。"},{"k":"C","t":"動的ダッシュボード","e":"正解です。通常のダッシュボードは「指定されたユーザ」（例: マネージャー）として実行され、閲覧者（例: 担当者）はその指定ユーザのアクセス権でデータを表示します。ケースが非公開でも、マネージャーとして実行されていれば、担当者はすべてのケースを見れてしまいます。この問題を解決するのが「動的ダッシュボード」（閲覧ユーザとして実行）であり、この機能の設定（または設定されていないこと）が、データの可視性に直接影響します。"},{"k":"D","t":"公開ダッシュボード","e":"これはダッシュボードが保存されているフォルダのアクセス権（公開フォルダ）を指すことが多く、ダッシュボード自体へのアクセスを許可しますが、ダッシュボード内で表示される「データ」のアクセス権（誰として実行するか）を制御するものではありません。"}],"a":["C"]},{"n":9,"q":"Dreamhouse Realityの管理者は、Salesforceモバイルアプリケーション用のカスタマイズされたページを作成する必要があります。管理者はLightningアプリケーションビルダーを使用して、どの2種類のページを作成およびカスタマイズできますか？ 2つ選択してください","o":[{"k":"A","t":"ユーザページ","e":"Lightningアプリケーションビルダーでは、「ユーザページ」というタイプのページを作成する機能は提供されていません。"},{"k":"B","t":"ダッシュボードページ","e":"ダッシュボードページは、Lightningアプリケーションビルダーではなく、専用のダッシュボードビルダーを使用して作成・編集されます。"},{"k":"C","t":"アプリケーションページ","e":"正解です。アプリケーションページは、特定のオブジェクトに依存しないカスタムページ（ホームタブに似たもの）で、Lightningアプリケーションビルダーで作成でき、モバイルアプリにも表示できます。"},{"k":"D","t":"レコードページ","e":"正解です。レコードページは、取引先やカスタムオブジェクトなどのレコード詳細ページであり、Lightningアプリケーションビルダーを使用してコンポーネントを配置・カスタマイズでき、モバイルアプリでの表示にも適用されます。"}],"a":["C","D"]},{"n":10,"q":"Cloud Kicksは、リードソースが選択されている場合にのみ、ユーザが商談のフェーズを[成約]に選択できるようにしたいと考えています。管理者はこの目標をどのように達成すべきでしょうか？","o":[{"k":"A","t":"リードソースを商談フェーズ項目の連動選択リストにする。","e":"連動選択リストは、制御項目（この場合は商談フェーズ）の値に基づいて、連動項目（リードソース）の選択肢を絞り込む機能です。特定のフェーズで項目を必須にする要件は満たせません。"},{"k":"B","t":"フェーズが[成約]に設定されたときにリードソースを必須にする入力規則を設定する。","e":"正解です。入力規則を使用し、「フェーズが[成約]」かつ「リードソースが空白」の場合にエラーメッセージを表示させることで、リードソースが選択されている場合にのみ[成約]に設定できるという要件を実現できます。"},{"k":"C","t":"ページレイアウトで商談フェーズ項目を読み取り専用に変更する。","e":"この設定を行うと、ユーザはフェーズを[成約]に変更すること自体ができなくなり、営業活動を記録できなくなるため、要件を満たせません。"},{"k":"D","t":"商談フェーズをリードソース項目の連動選択リストに変更する。","e":"これは、リードソースの値に基づいて、選択できる商談フェーズを絞り込む設定です。要件は「[成約]にする際にリードソースが入力されていること」であり、入力規則が最も適切な解決策です。 ここから先は有料部分です"}],"a":["B"]},{"n":11,"q":"営業担当が商談のボタンをクリックすると、簡易的な割引計算画面が起動するようにすべきです。管理者はこの割引計算画面を構築するためにどの自動化ツールを使用すべきでしょうか？","o":[{"k":"A","t":"フロービルダー","e":"正解です。フロービルダーは、ユーザからの情報入力を受け付けるための「画面（スクリーン）」要素を提供できる唯一の宣言的な自動化ツールです。ボタン操作で画面フローを起動し、計算画面を表示させることができます。"},{"k":"B","t":"ワークフロールール","e":"ワークフロールールは、レコードの保存時にバックグラウンドで項目更新やメール送信などを実行する機能です。ユーザが操作する画面を構築することはできません。"},{"k":"C","t":"プラットフォームイベント","e":"プラットフォームイベントは、システム間で通知（イベント）を送受信するための機能であり、ユーザインターフェース（画面）を作成するツールではありません。"},{"k":"D","t":"プロセスビルダー","e":"プロセスビルダーは、レコードの変更をトリガーにしてバックグラウンドで様々なアクション（項目更新、フロー起動など）を実行するツールです。プロセスビルダー自体に画面を作成する機能はありません。"}],"a":["A"]},{"n":12,"q":"Northern Trail OutfittersのユーザがSalesforceへのログインに問題抱えています。ユーザのログイン履歴には、この人が複数回ログインを試み、組織からロックアウトされたことが示されています。管理者がユーザのSalesforceへのログインを助けるには、どの2つの方法を使用すべきでしょうか？","o":[{"k":"A","t":"ユーザとしてログインし、ユーザのロックを解除してパスワードをリセットする。","e":"「ユーザとしてログイン」機能は、主にトラブルシューティングやユーザの画面確認のために使用されます。この機能から直接ユーザのロック解除やパスワードリセット操作は行えません。"},{"k":"B","t":"ユーザがログインできるようにパスワードポリシーをリセットする。","e":"パスワードポリシーは組織全体のセキュリティ設定です。ロックアウトされた特定の1ユーザのために組織全体のポリシーを変更することは、セキュリティ上不適切であり、問題の解決策にもなりません。"},{"k":"C","t":"ユーザのレコード詳細ページでパスワードをリセットする。","e":"正解です。ユーザがパスワードを忘れた場合、またはロックアウト後に新しいパスワードが必要な場合、管理者はユーザレコードの[パスワードのリセット]ボタンを押して、ユーザにパスワードリセットリンクを送信できます。"},{"k":"D","t":"ユーザのレコード詳細ページで[ロック解除]ボタンを使用する。","e":"正解です。ユーザがログインの試行回数を超えてロックアウトされた場合、管理者のユーザ詳細ページに[ロック解除]ボタンが表示されます。これをクリックすることで、ユーザのロック状態を解除できます。"}],"a":["C","D"]},{"n":13,"q":"Ursa Majorは、取引先をシルバー、ゴールド、またはプラチナレベルとして分類しています。シルバーまたはゴールドパートナーの新しいケースが作成された場合、それは通常のサポートキューに送られるべきです。取引先がプラチナレベルの場合、それは自動的に優先サポートキューに行くべきです。管理者はこれを達成するために何を使用すべきですか？","o":[{"k":"A","t":"割り当てルール","e":"正解です。ケース割り当てルールは、新しく作成されたケースを、定義された条件（この場合は取引先のレベル）に基づいて、自動的に適切なユーザまたはキュー（通常のサポートキューや優先サポートキュー）にルーティングするために設計された機能です。"},{"k":"B","t":"ケースルール","e":"「ケースルール」という名前の特定の標準機能はSalesforceには存在しません。ケースの自動化には通常、割り当てルール、自動レスポンスルール、エスカレーションルールなどが使用されます。"},{"k":"C","t":"ワークフロールール","e":"ワークフロールールは、レコードの変更（作成や更新）に基づいて項目更新やメール送信などのアクションを実行する機能です。ケースの割り当ては主に割り当てルールの役割であり、ワークフローは適していません。"},{"k":"D","t":"エスカレーションルール","e":"エスカレーションルールは、ケースが一定時間内に解決されない場合（SLA違反など）に、そのケースを別のキューや上位の担当者にエスカレーション（上位報告または再割り当て）するために使用されます。新規ケースの初期割り当てには使用されません。"}],"a":["A"]},{"n":14,"q":"管理者は、商談が[成約]としてクローズされたときに商談所有者のためのフォローアップToDoをトリガーし、さらに60日後に顧客に確認するための別のToDoをトリガーしたいと考えています。管理者はどの2つの自動化ツールを使用すべきでしょうか？ 2つ選択してください","o":[{"k":"A","t":"プロセスビルダー","e":"正解です。プロセスビルダーは、レコードが特定の条件（例：商談が[成約]）を満たしたときに、複数のアクション（即時およびスケジュール済み）を実行できる自動化ツールです。この要件の「即時のToDo作成」と「60日後のToDo作成」の両方を設定できます。"},{"k":"B","t":"ワークフロールール","e":"ワークフロールールも、即時および時間ベースのToDo作成を実行できます。ただし、Salesforceはプロセスビルダーやフローへの移行を推奨しています。この選択肢も機能的には可能ですが、プロセスビルダーの方がより複雑なプロセスを管理できます。"},{"k":"C","t":"項目自動更新","e":"正解です。これは、プロセスビルダーやワークフロールールなどの自動化ツール内で呼び出される「アクション」の一種です。この要件ではToDo作成が主目的ですが、項目自動更新も自動化プロセス（A）の一部として、日付の更新やフラグの設定などに使用されることがあります。"},{"k":"D","t":"アウトバウンドメッセージ","e":"アウトバウンドメッセージは、Salesforce内の情報（例：商談の[成約]）をトリガーとして、外部のシステムにSOAPメッセージを送信する機能です。Salesforce内でToDoを作成する要件には適していません。"}],"a":["A","C"]},{"n":15,"q":"Universal Containersの営業担当役員は、営業チームのメンバーが商談の日付を過去の日付に変更できないようにしたいと考えています。管理者はこの要件を満たすために何を設定すべきでしょうか？","o":[{"k":"A","t":"割り当てルール","e":"割り当てルールは、主にリードやケースが作成されたときに、定義された条件に基づいて適切なユーザやキューに自動的に割り当てるために使用されます。日付項目の入力を制限する機能ではありません。"},{"k":"B","t":"入力規則","e":"正解です。入力規則は、ユーザがレコードを保存しようとする際に、データが特定の基準を満たしているか（例：日付が今日以降か）を検証するために使用されます。基準を満たさない場合（例：日付が過去である場合）にエラーメッセージを表示し、保存を防ぐことができます。"},{"k":"C","t":"項目レベルセキュリティ","e":"項目レベルセキュリティは、プロファイル単位で項目自体を参照可能、編集可能、または非表示にするかを制御します。特定の値（過去の日付）に基づいて入力を制限するような、条件付きの制御はできません。"},{"k":"D","t":"承認プロセス","e":"承認プロセスは、レコードが特定の条件を満たしたときに、正式な承認（例：マネージャーの承認）を得るためにレコードを送信するフローです。データの入力を防ぐためのものではありません。"}],"a":["B"]},{"n":16,"q":"管理者は、新しいAPIからカスタムオブジェクトに新しいレコードを一括インポートするために、データローダを使用することを計画しています。データローダを使用するために管理者は何を行う必要がありますか？","o":[{"k":"A","t":"データをインポートすることを許可する権限セットを追加する。","e":"データのインポートには適切な権限（例：オブジェクトへの「作成」権限や「APIの有効化」）が必要ですが、これはデータローダのログイン操作自体（特に信頼できるIP範囲外からのアクセス）に必要な特定のステップではありません。"},{"k":"B","t":"ログインするために、パスワードの末尾にセキュリティトークンを追加する。","e":"正解です。データローダはAPIクライアントであり、組織の「信頼できるIP範囲」外からログインする場合、Salesforceは本人確認のためにパスワードとセキュリティトークンの両方を要求します。その際、パスワードの末尾にトークンを連結して入力します。"},{"k":"C","t":"カスタムオブジェクトのレコードを一括インポートするために、データインポートツールを使用する。","e":"データインポートツール（データインポートウィザード）は、データローダとは異なるツールです。問題はデータローダの使用について尋ねています。"},{"k":"D","t":"パスワードとセキュリティトークンをリセットする。","e":"ログインに必要なアクションは、既存のセキュリティトークンを使用することです。パスワードを忘れたり、トークンが不明な場合にリセットを行いますが、ログインするための必須の操作ではありません。"}],"a":["B"]},{"n":17,"q":"管理者は、2つのオブジェクト間に1対多の関係を作成し、子レコードへのアクセスを制限する必要があります。管理者はどのタイプの項目を使用すべきでしょうか？","o":[{"k":"A","t":"積み上げ集計項目","e":"積み上げ集計項目は、主従関係にある子レコードの情報を親レコードで集計（合計や件数など）するための項目であり、オブジェクト間の関係を定義するものではありません。"},{"k":"B","t":"主従関係項目","e":"主従関係も1対多の関係を作成しますが、親レコードのアクセス権が子レコードのアクセス権を厳密に制御します（親が削除されると子も削除されるなど）。子レコードへのアクセスを親とは独立して「制限」したい場合には適していません。"},{"k":"C","t":"クロスオブジェクト数式","e":"クロスオブジェクト数式は、関連する親オブジェクトの項目値を参照して表示するための項目であり、2つのオブジェクト間の関係を確立するものではありません。"},{"k":"D","t":"参照項目","e":"正解です。参照関係は、オブジェクト間に1対多の関係を作成します。主従関係とは異なり、親と子のレコードが個別の共有設定を持つことができるため、子レコードへのアクセスを親とは別に「制限する」という要件に適しています。"}],"a":["D"]},{"n":18,"q":"Ursa Major Solarの管理者は、AppExchangeについて、またそれが会社のビジネスにいかに役立つかを学んだところです。AppExchangeを介して達成できる2つのアクションはどれですか？ 2つ選択してください","o":[{"k":"A","t":"認定開発者やコンサルタントを見つける。","e":"正解です。AppExchangeには、Salesforceの導入やカスタマイズを支援できる、Salesforce認定のコンサルティングパートナー（開発者やコンサルタント企業）を検索・閲覧できるセクションがあります。"},{"k":"B","t":"データローダデータツールをダウンロードする。","e":"データローダは、AppExchangeではなく、Salesforceの[設定]メニュー内の[データ管理]セクションからダウンロードします。"},{"k":"C","t":"業界固有のソリューションテンプレートをインストールする。","e":"正解です。AppExchangeは、サードパーティが開発したアプリケーションやコンポーネント、特定の業界（例：金融、ヘルスケア）向けのソリューションテンプレートなどをインストールできるマーケットプレイスです。"},{"k":"D","t":"標準のLightningコンポーネントをダウンロードする。","e":"「標準」のLightningコンポーネントは、Salesforceプラットフォームに最初から組み込まれているため、別途ダウンロードする必要はありません。AppExchangeで入手できるのは「カスタム」のLightningコンポーネントです。"}],"a":["A","C"]},{"n":19,"q":"Universal Containerの管理者は、Salesforceにブランド設定を追加したいと考えています。管理者が留意すべき2つの考慮事項はどれですか？ 2つ選択してください","o":[{"k":"A","t":"一度に有効にできるテーマは1つだけであり、テーマは組織全体に適用される。","e":"正解です。Lightning Experienceのテーマ設定では、組織全体で「有効」にできるテーマは常に1つだけです。このブランド設定は組織全体に適用されます。"},{"k":"B","t":"テーマはSalesforce ClassicとSalesforceモバイルアプリケーションに適用される。","e":"[テーマ]（Lightningテーマ）は、Lightning Experienceに適用される機能です。Salesforce ClassicやSalesforceモバイルアプリケーションには適用されず、これらは（もしあれば）独自のブランド設定オプションを持ちます。"},{"k":"C","t":"組み込みのテーマから最大150のカスタムテーマを作成、変更、またはコピーできる。","e":"Salesforce組織で作成できるカスタムテーマの上限は300です。したがって、150という記述は誤りです。"},{"k":"D","t":"Chatter 外部ユーザには、組み込みのLightningテーマのみが表示される。","e":"正解です。Chatter 外部ユーザやポータルユーザ（Experience Cloudユーザなど）は、組織に設定されたカスタムのLightningテーマのブランド設定を見ることができず、標準の組み込みテーマが表示されます。"}],"a":["A","D"]},{"n":20,"q":"管理者は、最近の更新の一部として作成されたフローを更新するように依頼されました。管理者が編集のためにフローを開くと、フローのツールボックスには、割り当て、決定、レコードの取得、およびループの4つの要素しか表示されません。何がこれを引き起こしているのでしょうか？","o":[{"k":"A","t":"フローが画面フローである。","e":"画面フローは、ユーザが操作するための画面（スクリーン）要素を含む、より多くの対話型要素（アクション、サブフローなど）を提供します。表示される要素が制限されている状況とは異なります。"},{"k":"B","t":"フローのバージョンが無効である。","e":"フローのバージョンが有効か無効かは、そのフロータイプで利用可能な要素（ツールボックスの内容）には影響しません。"},{"k":"C","t":"フローが保存前フローである。","e":"正解です。保存前フロー（レコードトリガーフローで「Fast Field Updates」を選択した場合）は、レコードがデータベースに保存される前に実行されるよう最適化されています。そのため、実行速度が非常に速い必要がありますが、使用できる要素は、レコードの項目値を更新するための基本的なロジック（割り当て、決定、レコードの取得、ループ）に制限されます。"},{"k":"D","t":"フローのバージョンが有効化されている。","e":"有効化されているフローは、直接編集のために開くことができません（通常、新しいバージョンを作成するかコピーする必要があります）。利用可能な要素が制限される理由ではありません。"}],"a":["C"]},{"n":21,"q":"Universal Containersでは、ユーザがSalesforceのレコードをチームの他のメンバーと共有できると同時に、一般的なトピックについてもコラボレーションできるようにしたいと考えています。この機能を有効にするための2つの考慮事項はどれですか？ 2つ選択してください","o":[{"k":"A","t":"コラボレーショングループは、すべての部門に対して自動的に作成される。","e":"Chatterグループは、部門（組織構造）とは無関係であり、自動的には作成されません。ユーザまたは管理者が手動で作成する必要があります。"},{"k":"B","t":"オブジェクトレイアウトは、グループ関連リストを含むように設定されるべきである。","e":"正解です。レコード（例：取引先）がどのChatterグループと共有されているかをユーザが確認できるようにするには、そのオブジェクトのページレイアウトに「グループ」関連リストを追加する設定が必要です。"},{"k":"C","t":"[レコードの追加]アクションがグループパブリッシャーで設定されている必要がある。","e":"正解です。ユーザがChatterグループのフィード内で[レコードの追加]アクションを使用してレコードを共有できるようにするには、管理者がグループのパブリッシャーレイアウトにこのアクションを設定しておく必要があります。"},{"k":"D","t":"管理者は、レコード共有を有効にするためにグループを作成する必要がある。","e":"レコード共有（Chatterでの共有）を有効にするために、管理者が事前にグループを作成することは必須ではありません。適切な権限があれば、ユーザ自身がグループを作成し、そこでレコードを共有し始めることができます。"}],"a":["B","C"]},{"n":22,"q":"標準のリードの[評価]項目には、[ホット]、[ウォーム]、[コールド]の選択リスト値があります。いくつかのレコードの[評価]項目に[Unrated (評価なし)]という値が含まれていたにもかかわらず、新しいリードのリストがエラーなしでインポートされました。これらのレコードはどのようにしてエラーなしで追加されたのでしょうか？","o":[{"k":"A","t":"[厳格に制限された選択リスト]チェックボックスがオフになっていた。","e":"正解です。選択リスト項目でこの設定がオフ（「選択リスト値を基準で厳密に制限します」が無効）の場合、API（データローダやインポートウィザードなど）は、選択リストで定義されていない値（今回の場合は[Unrated]）であっても、エラーを出さずに受け入れます。"},{"k":"B","t":"項目レベルセキュリティがすべてのプロファイルで[参照可能]に設定されていた。","e":"項目レベルセキュリティは、ユーザがその項目を参照または編集できるかどうかを制御しますが、その項目に入力できる「値」を検証するものではありません。"},{"k":"C","t":"選択リストへの入力にグローバル選択リスト値セットが使用されていた。","e":"グローバル選択リスト値セットを使用しているかどうかは、その選択リストが厳格に制限されているかどうか（定義外の値を受け入れるか）とは別の設定です。"},{"k":"D","t":"[すべてのレコードタイプに追加]チェックボックスがオンになっていた。","e":"この設定は、新しい選択リスト値を作成する際に、それを既存のすべてのレコードタイプに自動で含めるかどうかを指定するものです。データのインポート時の値の検証には関係ありません。"}],"a":["A"]},{"n":23,"q":"DreamHouse Realtyの管理者が、ケースページレイアウトにメールクイックアクションを追加しましたが、そのアクションがケースフィードに表示されません。クイックアクションが期待どおりに表示されるようにするために、どの機能を有効にする必要がありますか？","o":[{"k":"A","t":"メール通知","e":"メール通知は、Chatterでのメンションやレコードの更新など、システム内のイベントについてユーザに知らせるための一般的な設定です。ケースフィードのアクション表示とは直接関係ありません。"},{"k":"B","t":"メール-to-ケース","e":"正解です。ケースのフィードベースのレイアウトでメールクイックアクション（メールの送受信機能）を正しく表示および機能させるためには、「メール-to-ケース」機能が有効化され、設定されている必要があります。"},{"k":"C","t":"メールアラート","e":"メールアラートは、フローや承認プロセスなどの自動化によって、特定のメールテンプレートを使用して自動送信されるメールのアクションです。ユーザインターフェース上のクイックアクションの表示とは関係ありません。"},{"k":"D","t":"メールテンプレート","e":"メールテンプレートは、メール送信時に再利用できる定型文です。メールアクションの表示自体を制御する機能ではなく、メール送信時に使用されるものです。"}],"a":["B"]},{"n":24,"q":"主従関係の3つの特徴は何ですか？ 3つ選択してください","o":[{"k":"A","t":"主オブジェクトは、標準オブジェクトまたはカスタムオブジェクトにすることができます。","e":"正解です。主従関係の「主」（親）側は、取引先のような標準オブジェクトでも、カスタムオブジェクトでも設定することが可能です。"},{"k":"B","t":"従レコードの権限は、主とは独立して設定されます。","e":"これは参照関係の特徴です。主従関係では、従（子）レコードの共有設定やアクセス権は、主（親）レコードによって厳密に制御されます。"},{"k":"C","t":"各オブジェクトは、最大5つの主従関係を持つことができます。","e":"1つのオブジェクトが「従」（子）として持つことができる主従関係は、最大2つまでです。"},{"k":"D","t":"主従関係では、積み上げ集計がサポートされています。","e":"正解です。積み上げ集計項目（関連する子レコードの合計や件数などを親レコードに集計する機能）は、主従関係でのみ利用可能な重要な特徴です。"},{"k":"E","t":"従レコードの[所有者]項目は、主レコードの所有者です。","e":"正解です。厳密には、従（子）レコードには独立した[所有者]項目が存在しません。そのレコードの所有権とアクセス可視性は、主（親）レコードの所有者によって決定されます。"}],"a":["A","D","E"]},{"n":25,"q":"Cloud Kicksの営業マネージャーは、毎日の開始時にインサイトを提供することで、生産性を向上させたいと考えています。管理者はこの要件を満たすために、どの3つの営業固有の標準Lightningコンポーネントをホームページに追加すべきでしょうか？ 3つ選択してください。","o":[{"k":"A","t":"活動","e":"正解です。このコンポーネントは、ユーザの未完了のToDoや今後の行動（会議など）を表示します。「今日やるべきこと」を明確にし、日々の生産性向上に役立ちます。"},{"k":"B","t":"パス","e":"このコンポーネントは、商談やリードなどのレコードページで使用され、プロセスのフェーズや主要項目を示すものです。ホームページで毎日のインサイトを提供するものではありません。"},{"k":"C","t":"アシスタント","e":"正解です。このコンポーネントは、ユーザがすぐに対応すべき重要な更新（例：フォローアップが必要な商談、新規リード）を自動的に表示します。毎日の開始時に確認すべきインサイトとして最適です。"},{"k":"D","t":"重要な商談","e":"正解です。このコンポーネントは、金額や完了予定日に基づいて、ユーザが所有する最も重要な商談をハイライトします。営業担当が優先順位をつけるのに役立ちます。"},{"k":"E","t":"パフォーマンスグラフ","e":"このコンポーネントは、個人の目標に対するパフォーマンス（例：今四半期の成約額）を表示します。インサイトではありますが、A、C、Dほど「今日すぐに行動すべき」という日々のタスク管理には直結しません。"}],"a":["A","C","D"]},{"n":26,"q":"営業担当が、一度に読み込みたい300件の取引先と取引先責任者のリストを持っています。管理者はSalesforceにレコードをインポートするためにどのツールを利用すべきでしょうか？","o":[{"k":"A","t":"Dataloader.io","e":"Dataloader.ioはサードパーティ製のデータローディングツールです。Salesforceが標準で提供しているツール（データローダやウィザード）が他にあるため、この場合の第一選択肢にはなりません。"},{"k":"B","t":"データローダ","e":"データローダは、通常5万件を超える大量のデータ（最大500万件）を扱う場合や、ウィザードがサポートしていないオブジェクトをインポートする場合に使用する、より強力なクライアントアプリケーションです。300件のインポートには適していません。"},{"k":"C","t":"手動インポート","e":"「手動インポート」という名前の特定のSalesforceツールはありません。300件のレコードを手作業で1件ずつ入力することは非常に非効率です。"},{"k":"D","t":"データインポートウィザード","e":"正解です。データインポートウィザードは、最大5万件までのレコードをインポートするために設計された、ブラウザベースの簡易的なツールです。取引先や取引先責任者などの主要な標準オブジェクトに対応しており、300件という小規模なインポートに最適です。"}],"a":["D"]},{"n":27,"q":"Ursa Majorの新しい営業担当が、有望な（取引開始の準備が整った）リードを持っています。リードの取引開始プロセスを使用する際、どの2つのレコードが作成されますか？ 2つ選択してください","o":[{"k":"A","t":"取引先","e":"正解です。リードの取引開始プロセスでは、リードの会社情報（[会社名]項目）が、新しい取引先レコードを作成するため、または既存の取引先に紐付けるために使用されます。"},{"k":"B","t":"キャンペーン","e":"キャンペーンは通常、リードの発生源（例：展示会）として関連付けられますが、リードの取引開始プロセス自体によって新規作成されるレコードではありません。"},{"k":"C","t":"ケース","e":"ケースは、顧客からの問い合わせやサポート問題を管理するためのオブジェクトです。リードの取引開始プロセスでは作成されません。"},{"k":"D","t":"取引先責任者","e":"正解です。リードの個人情報（氏名、メールアドレスなど）が、新しい取引先責任者レコードを作成するために使用されます。"}],"a":["A","D"]},{"n":28,"q":"Cloud Kicksの管理者は、顧客が問題を電話で連絡してきたときに、サービス担当が同じ一連の質問を行えるようにするための画面フローを作成しました。この画面はケースから表示できるようにする必要があります。この画面フローはどのように配布すべきでしょうか？","o":[{"k":"A","t":"ページレイアウト","e":"ページレイアウトは、主にレコード詳細ページの項目や関連リストの配置を制御します。Lightning Experienceでフローのようなコンポーネントを配置するのは、Lightningページの役割です。"},{"k":"B","t":"コンポーネントの検索条件","e":"これは、Lightningページに配置されたコンポーネント（フローを含む）を、特定の条件に基づいて動的に表示または非表示にするための設定です。フローを「配置」する手段そのものではありません。"},{"k":"C","t":"Lightningページ","e":"正解です。画面フローを特定のレコード（この場合はケース）のページに表示するには、Lightningアプリケーションビルダーを使用して、そのオブジェクトのLightningレコードページを編集し、「フロー」コンポーネントをページ上に配置する必要があります。"},{"k":"D","t":"ホームページ","e":"ホームページは、すべてのユーザに共通の情報を表示する場所です。要件は「ケースから表示」すること、つまり特定のケースレコードに関連付けてフローを実行することであり、ホームページへの配置は適していません。"}],"a":["C"]},{"n":29,"q":"DreamHouse Realtyは定期的に顧客からの保証作業の要求を処理しており、顧客がケースを生成するためのセルフサービスオプションを提供したいと考えています。管理者はこの要求を満たすためにどの2つのソリューションを使用すべきでしょうか？ 2つ選択してください","o":[{"k":"A","t":"Web-to-ケース","e":"正解です。これは、顧客が企業のWebサイト上のフォーム（セルフサービスオプション）に入力することで、Salesforceに自動的に新しいケースを作成する機能です。要件に合致します。"},{"k":"B","t":"ケースエスカレーション","e":"ケースエスカレーションルールは、ケースが特定の時間内に解決されない場合に、ケースを自動的にエスカレート（再割り当てや通知）するために使用されます。顧客がケースを生成する機能ではありません。"},{"k":"C","t":"ケースキュー","e":"ケースキューは、エージェントへの割り当てを待っている既存のケースを保持するために使用されます。顧客がケースを生成する機能ではありません。"},{"k":"D","t":"メール-to-ケース","e":"正解です。これは、顧客が特定のメールアドレスにメールを送信する（セルフサービスオプション）ことで、Salesforceに自動的に新しいケースを作成する機能です。要件に合致します。"}],"a":["A","D"]},{"n":30,"q":"営業担当が、プロセスを通じて商談レコードを入力する際に、主要な項目を見逃します。担当は[Win]（成約）へ（フェーズを）進める必要があり、以前のフェーズに戻ることはできません。管理者はこのニーズに対応するためにどの3つのオプションを使用すべきでしょうか？ 3つ選択してください","o":[{"k":"A","t":"ガイド付き販売を有効にする。","e":"正解です。これは商談パス（Sales Path）の「成功へのガイダンス」機能を指します。各フェーズで実行すべきステップや入力すべき項目をテキストでユーザに案内し、項目の見逃しを防ぐのに役立ちます。"},{"k":"B","t":"入力規則を使用する。","e":"正解です。入力規則により、「特定のフェーズに変更しようとした時、特定の項目が空白であればエラーにする」という条件を設定できます。これにより、重要な項目が入力されることを強制できます。"},{"k":"C","t":"商談パスを設定する。","e":"商談パスは、フェーズの進捗を視覚化し、各フェーズの「主要項目」をハイライト表示する機能です。これはユーザの補助にはなりますが、項目の入力を「強制」するものではありません。"},{"k":"D","t":"フローを使用して項目を必須としてマークする。","e":"フロー（特に画面フロー）は、カスタム画面内で項目を必須にするために使用されますが、標準の商談レコードページのレイアウト上で項目を必須にするための主要な方法ではありません。"},{"k":"E","t":"ページレイアウトで項目を必須としてマークする。","e":"正解です。ページレイアウトで項目を「必須」に設定することは、ユーザがレコードを保存する際に常に入力を要求する最も直接的な方法であり、項目の見逃しを確実に防ぎます。"}],"a":["A","B","E"]},{"n":31,"q":"Ursa Major Solarは、設置するすべてのパネルに1年間の保証を提供しています。保証情報を含む設置の詳細は、[設置]というカスタムオブジェクトに記録されます。設置レコードは、設置担当者によってモバイルアプリから作成されます。設置が遅れたり問題が発生したりした場合、顧客満足度を高める方法として、顧客はより長い保証を受け取ることがあります。管理者は、保証の有効期限を記録するためにSalesforceをどのように設定すべきでしょうか？","o":[{"k":"A","t":"保証有効期限項目のデフォルト値として数式を使用する。","e":"正解です。日付項目を作成し、そのデフォルト値として「設置日 + 365日」のような数式を設定します。これにより、標準の1年保証の日付が自動入力されますが、顧客が「より長い保証」を受け取る例外的なケースでは、ユーザがそのデフォルト値を手動で上書き編集できます。"},{"k":"B","t":"保証購入日から1年後を表示する数式項目を作成する。","e":"数式項目で作成すると、日付は自動計算されますが、ユーザが値を編集できなくなります。これでは、「より長い保証」の例外に対応できません。"},{"k":"C","t":"有効期限項目が入力されていることを確認するための入力規則を追加する。","e":"入力規則は、項目が入力されていることを必須にする（空白を防ぐ）ことはできますが、日付を自動的に計算して設定するものではありません。"},{"k":"D","t":"保証有効期限項目をモバイルページレイアウトに含める。","e":"これは、ユーザが項目をモバイルで表示・編集するために必要なステップですが、日付を自動的に計算してデフォルト設定する解決策そのものではありません。"}],"a":["A"]},{"n":32,"q":"Cloud Kicksは、AppExchangeのアプリケーションがニーズを満たしていることを確認するために、試してみたいと考えています。管理者はどの2つのオプションを提案すべきでしょうか？ 2つ選択してください","o":[{"k":"A","t":"本番組織でのテストドライブ。","e":"「テストドライブ」は、AppExchange上で提供される、インストール不要の読み取り専用のデモ環境で試す機能であり、本番組織にインストールして試すことではありません。本番組織に直接インストールして試すことはリスクが伴います。"},{"k":"B","t":"Trailhead Playgroundへのダウンロード。","e":"正解です。Trailhead Playgroundは、学習や開発、テストに使用できるSalesforce組織です。本番環境に影響を与えることなく、アプリケーションをインストールしてその機能を試すことができます。"},{"k":"C","t":"Sandboxへのインストール。","e":"正解です。Sandboxは、本番組織のコピー（設定やデータを含む）であり、新しいアプリケーションのインストール、テスト、トレーニングを行うために設計された安全な環境です。アプリがニーズを満たすかを確認するのに最も適した場所の一つです。"},{"k":"D","t":"エディションの互換性を確認する。","e":"アプリが自社のSalesforceエディション（例：Professional, Enterprise）に対応しているかを確認することは非常に重要ですが、これはアプリを「試す」ための環境（場所）の選択肢ではありません。"}],"a":["B","C"]},{"n":33,"q":"Northern Trail Outfittersの管理者が、Salesforceに新しいユーザを追加できません。この問題の原因は何である可能性がありますか？","o":[{"k":"A","t":"ユーザ名がすでに他の組織で使用されている。","e":"正解です。Salesforceのユーザ名は、すべてのSalesforce組織（本番、Sandbox、Trailhead Playgroundなど）を通じて、世界中で一意である必要があります。もし入力しようとしたユーザ名が、世界の他のどこかの組織で既に使用されている場合、そのユーザ名で新しいユーザを作成することはできません。"},{"k":"B","t":"ユーザ名が[私のドメイン]固有のドメインに制限されている。","e":"[私のドメイン]は、主に組織のログインURLやブランド設定をカスタマイズする機能です。ユーザ作成時に入力するユーザ名の形式（ドメイン）を制限する機能ではありません。"},{"k":"C","t":"ユーザ名に使用されたメールアドレスが、取引先責任者レコードを持っている。","e":"ユーザ名に使用するメールアドレス（形式）が、既存の取引先責任者レコードのメールアドレスと重複していても、内部ユーザの作成は可能です。ユーザ名の一意性とは関係ありません。"},{"k":"D","t":"ユーザ名に使用されたメールが、会社のメールアドレスではない。","e":"Salesforceは、ユーザ名が会社のドメインであるか（例：@corporate.com）、個人ドメインであるか（例：@gmail.com）を検証しません。メールアドレスの形式でありさえすれば、ドメインに関わらず使用できます。"}],"a":["A"]},{"n":34,"q":"承認者が承認申請に応答しやすくするために、管理者が設定すべき3つの設定はどれですか？ 3つ選択してください","o":[{"k":"A","t":"承認を許可するように、組織のChatter設定を更新する。","e":"正解です。Chatter設定で承認を有効にすると、承認者はChatterフィード内で直接、承認または拒否の投稿を行えるようになり、応答が迅速かつ容易になります。"},{"k":"B","t":"組織のメール承認レスポンス設定を有効にする。","e":"正解です。この設定を有効にすると、承認者はSalesforceにログインすることなく、受信した承認依頼メールに「承認」や「却下」などのキーワードを返信するだけで、承認申請に応答できます。"},{"k":"C","t":"承認プロセス内で最初の申請アクションを指定する。","e":"申請アクションは、レコードが承認プロセスに申請された直後に実行される自動アクション（項目更新など）です。承認者が応答する際の利便性には直接関係ありません。"},{"k":"D","t":"[承認申請]コンポーネントを承認者のホームページに追加する。","e":"正解です。このLightningコンポーネントをホームページに配置すると、承認者はログイン後すぐに自分宛ての承認待ち項目を一覧で確認し、そこから直接応答できるため、見逃しを防ぎ、応答が容易になります。"},{"k":"E","t":"すべてのレコードを自動的に承認するフローを作成する。","e":"これは、承認者によるレビュー（応答）プロセスそのものをなくしてしまう自動化であり、「承認者が応答しやすくする」という要件とは異なります。"}],"a":["A","B","D"]},{"n":35,"q":"Universal Containersの管理者は、ユーザが新しいリードを作成するのを助ける画面フローを持っています。リードソースが \"Search Engine\" の場合、管理者はユーザに選択リストから特定の検索エンジンを選択させる必要があります。リードソースが \"Search Engine\" でない場合、この選択リストは非表示にすべきです。管理者はこの要件をどのように完了すべきでしょうか？","o":[{"k":"A","t":"決定要素を割り当てて、リードソースが \"Search Engine\" の場合にのみ、特定の検索エンジン（を入力する）ための2番目の画面にユーザを誘導する。","e":"この方法でも要件を満たすこと自体は可能ですが、ユーザを別々の画面に誘導するため、操作性が低下します。1つの画面内で完結させる方が効率的です。"},{"k":"B","t":"割り当て要素を使用し、1つはリードソースが \"Search Engine\" の場合、もう1つはそれ以外の場合にする。","e":"割り当て要素は、フロー内で変数に値を代入するために使用されるロジック要素であり、画面コンポーネントの表示/非表示を制御する機能ではありません。"},{"k":"C","t":"特定の検索エンジンのための選択リストを作成し、リードソースが \"Search Engine\" の場合にのみ表示されるように、コンポーネントの表示/非表示を設定する。","e":"正解です。画面フローのコンポーネントには「コンポーネントの表示/非表示」設定があり、同じ画面上の他のコンポーネントの値（例：リードソースが \"Search Engine\"）に基づいて、そのコンポーネント（検索エンジンの選択リスト）を動的に表示したり非表示にしたりできます。"},{"k":"D","t":"特定の検索エンジンのための選択リストを設定し、リードソースが \"Search Engine\" の場合にのみ条件付きで表示するために、入力規則を使用する。","e":"入力規則は、データが特定の基準を満たさない場合に保存をブロック（エラーを表示）するための機能であり、画面上のコンポーネントの表示/非表示を制御する機能ではありません。"}],"a":["C"]},{"n":36,"q":"営業担当が退職したため、管理者はその担当者のすべての取引先と商談を、チームはそのまま維持した状態で、新しい営業担当に再割り当てするよう依頼されました。管理者はこれを達成するためにどのツールを使用すべきでしょうか？","o":[{"k":"A","t":"データローダ","e":"データローダは、データの一括更新（この場合は所有者項目の更新）に使用できます。しかし、この要件（退職者のレコード移転）のために特別に設計された[一括移行]ツールとは異なり、操作が複雑になります。"},{"k":"B","t":"一括移行ツール","e":"正解です。これはSalesforceの標準機能であり、特定のユーザが所有するレコード（取引先、リード、商談など）を別のユーザに一括で再割り当てするために設計されています。取引先の移行時には、関連する商談や取引先チームを維持するオプションも提供されます。"},{"k":"C","t":"データインポートウィザード","e":"データインポートウィザードは、主に新しいレコードをSalesforceにインポート（追加）するために使用されるツールであり、既存レコードの所有権の再割り当てには適していません。"},{"k":"D","t":"Dataloader.io","e":"これはデータローダと同様の機能を持つサードパーティ製のツールです。データの一括更新は可能ですが、この要件には、専用に用意されている標準の[一括移行]ツールを使用するのが最も効率的かつ安全です。"}],"a":["B"]},{"n":37,"q":"Cloud Kicksは、データエクスポートサービスを使用してデータをバックアップで保護しようとしています。管理者がエクスポートをスケジュールする際に、覚えておくべき2つの考慮事項はどれですか？ 2つ選択してください","o":[{"k":"A","t":"メタデータのバックアップは、Sandboxの更新間隔に制限されます。","e":"メタデータのバックアップ（設定情報の保存）とSandboxの更新（テスト環境の作成・リフレッシュ）は、互いに制限し合う関係にはありません。"},{"k":"B","t":"データのバックアップは、週次または月次の間隔に制限されます。","e":"正解です。Salesforceの標準機能である[データエクスポートサービス]（[設定]から行うスケジュールエクスポート）は、スケジュール実行の間隔として週次（7日間隔）または月次（29日間隔）のみを選択できます。"},{"k":"C","t":"データエクスポートサービスは、Sandboxから実行されるべきです。","e":"データエクスポートサービスは、本番組織の重要な実データをバックアップするために使用されます。Sandbox（テスト環境）のデータをバックアップするのが主な目的ではありません。"},{"k":"D","t":"メタデータのバックアップは、別のプロセスを介して実行する必要があります。","e":"正解です。[データエクスポートサービス]は、取引先や商談などのレコードデータ（CSVファイル）をバックアップする機能です。カスタム項目、ページレイアウト、フローなどのメタデータ（設定情報）は含まれません。メタデータのバックアップは、変更セット、Salesforce CLI、サードパーティツールなど、別のプロセスで行う必要があります。"}],"a":["B","D"]},{"n":38,"q":"DreamHouse Realtyのイベントマネージャーが、成功したオープンハウス（内覧会）から得た有望なリードを持っており、これを関連する商談を持つ取引先責任者にする必要があります。関連するキャンペーンメンバーの履歴を保持したまま、これをキャンペーンから達成するにはどうすればよいでしょうか？","o":[{"k":"A","t":"リードを削除し、新しい取引先責任者と商談を作成する。","e":"この操作を行うと、元のリードに関連付けられていた活動履歴やキャンペーンメンバーとしての履歴がすべて失われてしまいます。「キャンペーンメンバーの履歴を保持」するという要件を満たせません。"},{"k":"B","t":"リードをコピー（複製）し、コピーされたレコードを取引先責任者に取引開始する。","e":"リードをコピーして取引開始すると、元のリードがシステムに残り、データが重複する可能性があります。これは標準的なリード取引開始プロセスではなく、非効率です。"},{"k":"C","t":"キャンペーンメンバーの詳細ページからリードを取引開始する。","e":"正解です。キャンペーンメンバーレコード（リード）から直接[取引開始]アクションを実行すると、標準のリード取引開始プロセスが開始されます。このプロセスにより、リードは（必要に応じて）取引先、取引先責任者、および商談に変換され、キャンペーンメンバーとしての履歴は新しく作成された取引先責任者に引き継がれます。"},{"k":"D","t":"キャンペーンメンバーの詳細ページから取引先責任者を追加する。","e":"「取引先責任者を追加」は、既存の取引先責任者をキャンペーンメンバーとして追加する操作であり、リードを取引先責任者に「変換（取引開始）」する操作ではありません。"}],"a":["C"]},{"n":39,"q":"Universal Containersは、商談の共有モデルを[非公開]にしており、商談チームを使用しています。Universal Containersの営業担当が退職し、そのユーザレコードが[無効化]されました。その後、この担当は再雇用され、管理者が古いユーザレコードを有効化しました。ユーザは以前と同じデフォルト商談チームに追加されましたが、退職前に作業していたレコードが表示されなくなりました。考えられる原因は何ですか？","o":[{"k":"A","t":"商談レコードのフェーズが[失注]に変更された。","e":"商談が[失注]フェーズになっても、通常はレコードへのアクセス権（可視性）が失われるわけではなく、編集がロックされるだけです。アクセスできなくなる直接的な原因ではありません。"},{"k":"B","t":"ユーザが無効化されたときに、権限セットが削除された。","e":"ユーザを無効化しても、割り当てられていた権限セットは削除されません。ユーザレコード上に割り当てが残ったままになり、ユーザが再有効化されると、それらの権限も再び有効になります。"},{"k":"C","t":"商談レコードのレコードタイプが変更された。","e":"レコードタイプが変更されても、そのユーザのプロファイルが新しいレコードタイプへのアクセス権を持っていれば、可視性が失われることはありません。無効化と再有効化に関連する問題の直接的な原因ではありません。"},{"k":"D","t":"それらのレコードは、そのユーザと[手動で共有]されていた。","e":"正解です。ユーザレコードを無効化すると、そのユーザはすべての商談チームや[手動共有]のリストから自動的に削除されます。ユーザを再有効化しても、これらの共有設定は自動的には復元されません。デフォルトチームに再度追加されても、手動で共有されていたレコードへのアクセス権は失われたままになります。"}],"a":["D"]},{"n":40,"q":"管理者は、取引先の単純な項目自動更新を依頼されました。サポートエージェントが取引先の[状況]を 'Audited' に変更すると、システムが取引先の[監査日]項目を今日の日付で自動的に更新するようにしたいと考えています。管理者はこの自動化を完了するためにどのツールを使用すべきでしょうか？","o":[{"k":"A","t":"承認プロセス","e":"承認プロセスは、レコードの承認（許可）を得るために使用される機能です。項目値を自動的に更新（設定）するものではありません。"},{"k":"B","t":"数式項目","e":"正解です。この要件は、[状況]項目が特定の値 ('Audited') である場合に、[監査日]項目に今日の日付を表示するものと解釈できます。数式項目は、他の項目の値に基づいて動的に値を計算（この場合は TODAY() を表示）する最も簡単な方法です。"},{"k":"C","t":"フロービルダー","e":"フロービルダーは、レコードが変更された際に項目を更新（スタンプ）するために使用できる、より強力な自動化ツールです。ただし、[状況]に基づいて日付を動的に表示するだけの場合、数式項目の方が設定が単純です。"},{"k":"D","t":"入力規則","e":"入力規則は、データが特定の基準を満たさない場合にレコードの保存をブロック（エラーを表示）するために使用されます。日付を自動的に設定する機能ではありません。"}],"a":["B"]},{"n":41,"q":"モバイルナビゲーションメニューで使用できる3つの項目はどれですか？ 3つ選択してください","o":[{"k":"A","t":"Lightningアプリケーションページ","e":"正解です。管理者は、Lightningアプリケーションビルダーで作成したカスタムの「アプリケーションページ」を、Salesforceモバイルアプリケーションのナビゲーションメニュー項目として追加できます。"},{"k":"B","t":"Lightningホームページ","e":"Lightningホームページは、主にデスクトップの[ホーム]タブのレイアウトを定義します。モバイルのナビゲーションメニューに直接追加する項目ではありません。"},{"k":"C","t":"Chatter","e":"正解です。Chatter（フィード、グループなど）は、Salesforceモバイルアプリケーションの主要な標準機能であり、ナビゲーションメニューに含めることができます。"},{"k":"D","t":"ユーティリティバー","e":"ユーティリティバーは、デスクトップのLightningアプリケーションのフッターに表示される機能であり、モバイルナビゲーションメニューの項目ではありません。"},{"k":"E","t":"ダッシュボード","e":"正解です。ダッシュボード（およびレポート）は、Salesforceモバイルアプリケーションでサポートされている標準機能であり、ユーザが素早くアクセスできるようにナビゲーションメニューに追加できます。"}],"a":["A","C","E"]},{"n":42,"q":"Cloud Kicksでは、商談が交渉フェーズに達すると、[金額]項目が営業ユーザには必須になります。営業マネージャーは、金額がわからなくても商談をこのフェーズに進められるようにする必要があります。管理者は、営業ユーザには交渉フェーズでこの項目を必須にしつつ、マネージャーには変更を許可するには、どのように設定すべきでしょうか？","o":[{"k":"A","t":"すべてのユーザに対して項目を必須にする。","e":"ページレイアウトなどで項目を必須にすると、営業ユーザだけでなくマネージャーも入力が必要となり、「マネージャーには変更を許可する」という要件を満たせません。"},{"k":"B","t":"マネージャーのために項目を入力するための数式項目を作成する。","e":"[金額]項目はユーザが手動で入力するための項目であり、数式項目（値を自動計算する項目）でこの要件を満たすことはできません。"},{"k":"C","t":"マネージャーにシステム管理者プロファイルを割り当てる。","e":"これはセキュリティ上のベストプラクティスに反します。1つの項目要件のために、マネージャーに組織全体の管理者権限を与えるべきではありません。"},{"k":"D","t":"条件を満たすために入力規則を設定する。","e":"正解です。入力規則を使用すると、条件を細かく指定できます。例えば、「フェーズが[交渉]」かつ「金額が空白」かつ「ユーザのプロファイルが[営業ユーザ]である」場合にエラーを出すように設定すれば、マネージャー（異なるプロファイル）をそのルールの対象外にできます。"}],"a":["D"]},{"n":43,"q":"Ursa Major Solarのコールセンターマネージャーは、エージェントに、ケースの発生源、状況（ステータス）、所有者によってドリルダウン（絞り込み）できるケースダッシュボードを提供したいと考えています。管理者はこの要求を満たすためにダッシュボードに何を追加すべきですか？","o":[{"k":"A","t":"ダッシュボードの検索条件","e":"正解です。ダッシュボードの検索条件（フィルタ）は、ダッシュボードの閲覧者が、定義された項目（この場合は発生源、状況、所有者）の値に基づいて、ダッシュボードに表示されるデータ全体を動的に絞り込む（ドリルダウンする）ことを可能にする機能です。"},{"k":"B","t":"バケット列","e":"バケット列（バケット項目）は、ダッシュボードではなく、レポート内で使用される機能です。レポートのデータを分析しやすくするために、項目の値をカテゴリ（バケット）にグループ化します。"},{"k":"C","t":"ダッシュボードコンポーネント","e":"ダッシュボードコンポーネントは、レポートのデータを視覚化するグラフやチャート（例：円グラフ、ゲージ）自体を指します。これらはデータを表示しますが、ダッシュボード全体を絞り込む機能ではありません。"},{"k":"D","t":"複合グラフ","e":"複合グラフは、ダッシュボードコンポーネントの一種（例：棒グラフと折れ線グラフを組み合わせたもの）です。これはデータの表示形式であり、ダッシュボードを絞り込む機能ではありません。"}],"a":["A"]},{"n":44,"q":"管理者は、潜在的なセッションの脆弱性を特定し修正するために、どのツールを使用すべきでしょうか？","o":[{"k":"A","t":"項目履歴管理","e":"項目履歴管理は、特定のレコードの項目値がいつ、誰によって変更されたかを追跡する機能です。セッションの脆弱性（セキュリティ設定）の特定には使用されません。"},{"k":"B","t":"設定変更履歴","e":"設定変更履歴は、[設定]メニューで行われた変更（例：プロファイルの変更、項目の作成）を追跡する機能です。セッション設定の脆弱性を分析するツールではありません。"},{"k":"C","t":"セキュリティヘルスチェック","e":"正解です。これは、Salesforce組織のセキュリティ設定（パスワードポリシー、セッション設定など）をSalesforceのベースラインと比較し、潜在的な脆弱性を特定するツールです。リスクを評価し、修正するための推奨事項を提供します。"},{"k":"D","t":"組織の共有設定","e":"組織の共有設定は、レコード（例：取引先、商談）へのデフォルトのアクセスレベル（非公開、公開読み取り専用など）を決定するものです。セッションのセキュリティとは関係ありません。"}],"a":["C"]},{"n":45,"q":"Cloud Kicksのユーザは、2週間ごとに繰り返すToDoを作成できるようにしたいと考えています。管理者はこの要件を満たすために何をすべきでしょうか？","o":[{"k":"A","t":"繰り返しToDoの作成を有効化する。","e":"正解です。Salesforceには、ユーザがToDoを作成する際に繰り返し（例：2週間ごと）を設定できる標準機能があります。この機能はデフォルトで無効になっていることが多いため、管理者が[設定]の[活動設定]で有効化する必要があります。"},{"k":"B","t":"繰り返しToDoを作成するフロー。","e":"フロービルダーを使用してカスタムの繰り返しToDo作成ロジックを構築することも理論上は可能ですが、要件はSalesforceの標準機能で満たせるため、複雑な自動化ツールを組むのは非効率です。"},{"k":"C","t":"繰り返しToDoを作成するワークフロールール。","e":"ワークフロールールは、レコードの変更に基づいてアクションを実行する（古い）自動化ツールであり、ユーザがToDoの繰り返しパターン（例：2週間ごと）を定義して作成するための機能ではありません。"},{"k":"D","t":"繰り返し活動をオンにする。","e":"「活動」にはToDoと行動（Events）が含まれます。行動は本質的に繰り返しが可能ですが、ToDoの繰り返し機能はAで示された特定の[繰り返しToDoの作成を有効化]設定によって制御されます。"}],"a":["A"]},{"n":46,"q":"DreamHouse Realty (DHR)は、住宅ローンのリードを生成する住宅ローン計算機を備えた、テンプレート化されたプロセスを望んでいます。DHRはプロジェクトを30日以内に完了する必要があり、今年の予算は上限に達しています。管理者がこの要求を満たすのに役立つAppExchangeアイテムはどれでしょうか？","o":[{"k":"A","t":"Lightning Data","e":"これは、サードパーティのデータ（企業統計など）をSalesforceレコードに追加し、データを充実させるためのAppExchangeカテゴリです。プロセスや計算機のテンプレートを提供するものではありません。"},{"k":"B","t":"Lightning Community","e":"これはExperience Cloud（旧称）であり、顧客やパートナー向けのポータルやサイトを構築するためのSalesforceのプラットフォーム自体を指します。特定のプロセスを提供するAppExchangeアイテムのカテゴリではありません。"},{"k":"C","t":"Flow Solutions","e":"正解です。これはAppExchangeで入手可能な、あらかじめ構築された自動化プロセス（フロー）のカテゴリです。「テンプレート化されたプロセス」と「住宅ローン計算機」という要件に合致します。多くは無料または低コストで迅速に導入できるため、「予算上限」と「30日以内」という制約も満たせます。"},{"k":"D","t":"Bolt Solutions","e":"これは、あらかじめ構築されたExperience Cloud（コミュニティ）の業界向けテンプレートを提供するカテゴリです。Flow Solutionsよりも大規模なサイト構築を含んでおり、通常、より複雑でコストがかかる可能性があり、予算と時間の制約に合いません。"}],"a":["C"]},{"n":47,"q":"クライアントサービスチームとカスタマーサポートチームは同じプロファイルを共有していますが、異なる権限セットを持っています。カスタムオブジェクト[Retention]の関連リストは、Lightningレコードページレイアウト上でクライアントサービスチームに制限される必要があります。管理者はこの要求を満たすために何を使用すべきですか？","o":[{"k":"A","t":"共有設定","e":"共有設定は、ユーザがどの「レコード」自体を閲覧または編集できるかを制御する機能です。Lightningページ上の特定の「コンポーネント」（関連リストなど）の表示/非表示を制御するものではありません。"},{"k":"B","t":"ページレイアウトの割り当て","e":"ページレイアウトの割り当ては、主にプロファイルとレコードタイプに基づいて行われます。両チームは同じプロファイルを共有しているため、ページレイアウトの割り当てだけでは要件（チームごとの表示制御）を満たすことができません。"},{"k":"C","t":"コンポーネントの表示/非表示","e":"正解です。Lightningアプリケーションビルダーでは、ページ上の各コンポーネント（関連リストコンポーネントを含む）に対して、[コンポーネントの表示/非表示]ルールを設定できます。このルールは、ユーザの権限セットに基づいて設定できるため、クライアントサービスチームの権限セットを持つユーザにのみ関連リストを表示させることができます。"},{"k":"D","t":"レコードタイプの割り当て","e":"レコードタイプの割り当て（およびそれによるページレイアウトの割り当て）もプロファイルに基づいています。同じプロファイルを共有しているため、この方法で2つのチームを区別することはできません。"}],"a":["C"]},{"n":48,"q":"Cloud Kicksのサポートマネージャーは、顧客にできるだけ早く応答したいと考えています。彼らは、顧客の問題解決に役立つ上位5つのトラブルシューティングのヒントを応答に含めるよう要求しました。管理者はこれらの要件を満たすために何を提案すべきですか？","o":[{"k":"A","t":"自動レスポンスルール","e":"これは、新規ケースが作成されたときに（例：「お問い合わせを受け付けました」）自動返信メールを送信する機能です。トラブルシューティングのヒント（ナレッジ）を動的に含めるための機能ではありません。"},{"k":"B","t":"メールアラート","e":"これは、フローや承認プロセスなどの自動化によってトリガーされるアクションであり、特定のメールテンプレートを送信します。トラブルシューティングのヒントのコンテンツ（ナレッジ）自体を提供するものではありません。"},{"k":"C","t":"ナレッジ記事","e":"正解です。これは、FAQや「トラブルシューティングのヒント」といったコンテンツを作成、管理、共有するための機能（Salesforceナレッジ）です。サポートエージェントは、これらの記事を参照し、顧客への返信に含めることができます。"},{"k":"D","t":"割り当てルール","e":"これは、新規ケースが作成されたときに、定義された条件に基づいて適切なユーザやキューにケースを割り当てるための機能です。顧客に応答したり、ヒントを提供したりするものではありません。"}],"a":["C"]},{"n":49,"q":"AW Computing (AWC) は時折、フリーランスの請負業者と協働しており、同社は彼らをSalesforceに取引先責任者として保存しています。請負業者は頻繁に代理店（所属先）を変更するため、AWCはレコードの履歴の正確性を維持したいと考えています。AWCは取引先責任者を追跡するために何を使用すべきでしょうか？","o":[{"k":"A","t":"パートナーコミュニティを使用して取引先責任者を追跡する。","e":"パートナーコミュニティ（Experience Cloud）は、外部パートナー（代理店など）がSalesforceにアクセスするためのポータル機能です。取引先責任者がどの取引先に所属していたかの履歴を管理するデータモデル機能ではありません。"},{"k":"B","t":"代理店ごとに新しい取引先責任者レコードを作成する。","e":"この方法では、同じ人物（請負業者）の取引先責任者レコードが重複して作成されてしまい、データを正確に管理できません。"},{"k":"C","t":"連結オブジェクトを作成して多対多の関係を追跡する。","e":"カスタムの連結オブジェクトを使用して取引先責任者と取引先の多対多関係を構築することも理論上は可能ですが、Salesforceにはこのための標準機能（選択肢D）が用意されています。"},{"k":"D","t":"[取引先責任者の複数取引先への関連付け]を有効にする。","e":"正解です。これは、1人の取引先責任者が（主たる1つの取引先に加えて）他の複数の取引先にも関連付けられるようにする標準機能です。これにより、請負業者が過去にどの代理店に所属していたかという履歴（関連）を正確に追跡できます。"}],"a":["D"]},{"n":50,"q":"Cloud Kicksは、[Shoe (靴)]オブジェクトの組織全体の共有設定を[非公開]に設定しています。営業マネージャーは、自分のチームの全営業担当の[Shoe]レコードを含むレポートを表示できる必要があります。管理者は、レポートへの適切なアクセスを提供するために、どの3つの項目を設定すべきでしょうか？ 3つ選択してください","o":[{"k":"A","t":"カスタムレポートタイプ","e":"正解です。レポートは、[Shoe]オブジェクト（および関連オブジェクト）のデータを定義するレポートタイプに基づいて構築されます。マネージャーが目的のデータを表示できるレポートを作成または表示するには、適切なレポートタイプが利用可能である必要があります。"},{"k":"B","t":"フォルダアクセス","e":"正解です。レポートはフォルダに保存されます。マネージャーがそのレポート自体を表示できるようにするには、そのレポートが保存されているフォルダに対する「参照」以上のアクセス権（共有設定）が必要です。"},{"k":"C","t":"レポート登録","e":"レポート登録は、レポートの更新結果をスケジュールに従ってメールで受信する機能です。レポート自体へのアクセス権（可視性）を設定するものではありません。"},{"k":"D","t":"項目レベルセキュリティ","e":"正解です。レポートに表示される各項目（列）について、マネージャーのプロファイルまたは権限セットが、それらの項目への「参照」アクセス権を持っている必要があります。項目が項目レベルセキュリティによって非表示に設定されている場合、レポートにも表示されません。"}],"a":["A","B","D"]},{"n":51,"q":"Cloud Kicksの分析ユーザは、オブジェクトに対する[参照]、[作成]、[編集]アクセス権が必要ですが、レコードの[削除]は制限されるべきです。管理者はこの要件を満たすために何をすべきですか？","o":[{"k":"A","t":"標準の[システム管理者]プロファイルを分析ユーザに割り当てる。","e":"[システム管理者]プロファイルは、オブジェクトの[削除]権限（および[すべてのデータの変更]）を持っているため、レコードの[削除]を制限するという要件に反します。"},{"k":"B","t":"ユーザに[すべて表示]アクセス権を与え、ロール階層の最上位ロールに割り当てる。","e":"[すべて表示]権限やロール階層は、レコードレベルの可視性（どのレコードが見えるか）を制御しますが、オブジェクトレベルの操作（削除できるか）を制御するものではありません。"},{"k":"C","t":"各オブジェクトの[削除]アクセス権を削除したカスタムプロファイルを作成して割り当てる。","e":"正解です。プロファイルは、ユーザの基本的な権限（CRUD操作）のベースラインを定義します。[削除]権限を明示的に含まないカスタムプロファイルを作成・割り当てることが、この要件を満たす最も確実な方法です。"},{"k":"D","t":"[参照]、[作成]、[編集]アクセス権を含む権限セットを作成して割り当てる。","e":"権限セットは、プロファイルの権限に権限を追加するものです。もしユーザのベースプロファイルに[削除]権限が含まれていた場合、権限セットでそれを取り消すことはできません。アクセス権を厳密に制限するには、プロファイルレベルでの設定が必要です。"}],"a":["C"]},{"n":52,"q":"Ursa Major Solarの管理者は、顧客の保証ケース用に新しいレコードタイプを作成しました。管理者がユーザに新しいレコードタイプを表示するために使用すべき2つの割り当てはどれですか？ 2つ選択してください","o":[{"k":"A","t":"プロファイルの割り当て","e":"正解です。プロファイル（または権限セット）への割り当ては、どのユーザがその新しいレコードタイプを作成または表示できるかを制御します。これがなければ、ユーザはそのレコードタイプを選択肢として見ることも、アクセスすることもできません。"},{"k":"B","t":"ロールの割り当て","e":"ロール（役割）は、主にレコードの可視性（ロール階層）とレポートの集計を制御します。ユーザがどのレコードタイプを利用できるかを制御するものではありません。"},{"k":"C","t":"アプリケーションマネージャの割り当て","e":"「アプリケーションマネージャの割り当て」という設定は、レコードタイプの表示に直接関係ありません。Lightningページの割り当てはアプリケーションマネージャで行いますが、レコードタイプ自体の利用可否は制御しません。"},{"k":"D","t":"ページレイアウトの割り当て","e":"正解です。ユーザがその新しいレコードタイプを選択したときに、どの項目レイアウト（どの項目を表示・編集できるか）を表示するかを定義するために、ページレイアウトの割り当てが必要です。"}],"a":["A","D"]},{"n":53,"q":"Northern Trail Outfittersには、新しい取引先が作成されたときに自動的に項目値を設定する新しいフローがあります。そのフローはプロセスによって起動されますが、フローが適切に動作していません。管理者は問題を特定するために何をすべきでしょうか？","o":[{"k":"A","t":"フロービルダーのネイティブデバッグ機能を使用する。","e":"正解です。フロービルダーには、フローがどのように実行されるかをシミュレーションし、変数値やロジックの分岐（決定要素など）をステップごとに確認できるデバッグツールが組み込まれています。これは、フローが期待どおりに動作しない原因を特定する最も直接的で効果的な方法です。"},{"k":"B","t":"ログインレベルでデバッグログを確認する。","e":"デバッグログも自動化のエラー調査に使用できますが、フロービルダーの専用デバッグ機能の方が、フローのロジックを視覚的に追跡しやすいため、フローの問題特定にはより適しています。"},{"k":"C","t":"設定変更履歴を表示し、エラーを確認する。","e":"設定変更履歴は、Salesforceの設定（フローの有効化や変更など）がいつ誰によって行われたかを記録するものです。フローの実行時のエラーやロジック上の問題を特定するツールではありません。"},{"k":"D","t":"メールログを設定し、送信エラーログを確認する。","e":"メールログは、Salesforceから送信されたメール（例：メールアラート）に関する問題を調査するために使用されます。今回のフローは項目値を設定するものであり、メール送信とは関係がないため、このログは役立ちません。"}],"a":["A"]},{"n":54,"q":"AW Computingは、商談が[失注]になったときに、リッチテキスト項目に失注理由を記録する必要があります。管理者はこの要件をどのように設定すべきでしょうか？","o":[{"k":"A","t":"ページレイアウト上で、失注理由項目の隣にある[必須]チェックボックスを選択する。","e":"リッチテキスト項目は、ページレイアウトレベルで必須項目として設定することができません。また、この設定ではフェーズに関わらず常に必須となってしまいます。"},{"k":"B","t":"フェーズが[失注]で、かつ失注理由が空白の場合にエラーを表示する入力規則を作成する。","e":"正解です。入力規則は、「フェーズが[失注]」という特定の条件を満たしたときにのみ、別の項目（失注理由）が空白でないことを検証し、空白であればエラーを表示して保存をブロックできます。"},{"k":"C","t":"オブジェクトマネージャで、失注理由項目の[必須]チェックボックスをオンにする。","e":"リッチテキスト項目は、項目レベル（オブジェクトマネージャ）で必須項目として設定することができません。また、この設定ではフェーズに関わらず常に必須となってしまいます。"},{"k":"D","t":"失注理由が空白の場合にエラーを表示するワークフロールールを設定する。","e":"ワークフロールールは、項目更新やメール送信などのアクションを自動化するための機能です。ユーザにエラーメッセージを表示してレコードの保存をブロックする機能はありません。"}],"a":["B"]},{"n":55,"q":"AW ComputingのCTOは、顧客満足度を向上させるため、ケースに関する新しいポリシーを定義しました。ケースの理由が「Installation（設置）」で送信されたすべてのケースは、Eメールで直ちに確認応答され、適切なエージェントに割り当てられる必要があります。4時間経過しても「New（新規）」ステータスのままのケースは、サポート管理部門にエスカレーションされなければなりません。この要件のために、どのケース管理ツールを利用する必要がありますか？","o":[{"k":"A","t":"自動レスポンスルール、マクロ、エンタイトルメント","e":"エンタイトルメント（SLAやサポートレベルの管理）は、この特定の要件では直接言及されていません。"},{"k":"B","t":"自動レスポンスルール、キュー、マクロ","e":"正解です。自動レスポンスルールは、「直ちにEメールで確認応答」する要件に対応します。キューは、「適切なエージェント」（のグループ）への割り当て先として使用されます。マクロは、エージェントがケースを処理する際の反復作業を自動化し、迅速な対応を支援するために使用できます。"},{"k":"C","t":"自動レスポンスルール、キュー、エスカレーションルール","e":"エスカレーションルールは「4時間後にエスカレーション」の要件に合致しますが、この選択肢は指定された正解ではありません。"},{"k":"D","t":"自動レスポンスルール、エンタイトルメント、エスカレーションルール","e":"エンタイトルメント（SLAやサポートレベルの管理）は、この特定の要件には含まれていません。"}],"a":["B"]},{"n":56,"q":"DreamHouse Realtyは、戸建てとコンドミニアムの両方の販売のために、定期的にオープンハウス（内覧会）を開催しています。コンドミニアムのオープンハウスには、いくつか追加のステップを踏む必要があります。エージェントは、住宅所有者組合への申請を送信し、承認を受ける必要があります。管理者は、オープンハウスのレコードをコンドミニアム用に作成するときにのみ、これらの追加ステップ（手順）が表示されるようにするには、どうすればよいでしょうか？","o":[{"k":"A","t":"1つのページレイアウトを作成する。レコードタイプを使用して、適切な状況の選択リスト値が表示されるようにする。","e":"「1つのページレイアウト」では、戸建てとコンドミニアムで異なる項目や「追加のステップ」を表示するというUI（ユーザインターフェース）上の要件を満たすことができません。"},{"k":"B","t":"2つのページレイアウトを作成する。ビジネスプロセスとレコードタイプを使用して、適切な選択リスト値が表示されるようにする。","e":"正解です。まず「戸建て」用と「コンドミニアム」用の2つのレコードタイプを作成します。次に、コンドミニアム用のページレイアウトにのみ「追加のステップ」（承認申請用の項目など）を配置します。さらに、ビジネスプロセスを使用して、コンドミニアム用の状況選択リストにのみ「承認申請中」などの固有の値を含めます。最後に、これら2つのページレイアウトと2つのビジネスプロセスを、それぞれのレコードタイプに割り当てます。"},{"k":"C","t":"1つのページレイアウトを作成する。ビジネスプロセスを使用して、適切な状況の選択リスト値が表示されるようにする。","e":"「1つのページレイアウト」では、UI上の要件（追加ステップの表示）を満たせません。また、ユーザに異なるビジネスプロセス（選択リスト値）を提供するためには、通常レコードタイプが必要です。"},{"k":"D","t":"2つのページレイアウトを作成し、一方に[戸建て状況]項目を、もう一方に[コンドミニアム状況]項目を配置する。","e":"状況を管理するために2つの異なるカスタム項目を作成するのは、Salesforceのベストプラクティスではありません。これは通常、1つの標準[状況]項目を、ビジネスプロセスとレコードタイプで制御します。"}],"a":["B"]},{"n":57,"q":"Cloud Kicksは、顧客が公開ホームページを訪れている間に、自分たちでケースを作成できるようにしたいと考えています。管理者は何を推奨すべきでしょうか？","o":[{"k":"A","t":"SMSレスポンス","e":"SMSレスポンスは、顧客がSMS（テキストメッセージ）を通じてやり取りできるようにする機能です。要件は「公開ホームページ」からの作成であり、SMSではないため適していません。"},{"k":"B","t":"Web-to-ケース","e":"正解です。Web-to-ケースは、SalesforceがHTMLフォームを生成する機能です。このフォームを「公開ホームページ」に設置することで、顧客がフォームに入力・送信すると、自動的にSalesforce内にケースが作成されます。"},{"k":"C","t":"メール-to-ケース","e":"メール-to-ケースは、顧客が特定のメールアドレス（例：support@company.com）にメールを送信すると、自動的にケースを作成する機能です。要件は「ホームページ」からの作成であり、メールではないため適していません。"},{"k":"D","t":"オムニチャネル","e":"オムニチャネルは、作成されたケースやチャットなどの作業項目を、適切なエージェントに自動的にルーティング（割り当て）するための内部機能です。顧客がホームページからケースを作成する機能ではありません。"}],"a":["B"]},{"n":58,"q":"Cloud Kicksの商談が成約したとき、同社は自動的に更新商談を作成したいと考えています。管理者はこの要求を達成するために、どの2つの自動化ツールを使用すべきでしょうか？ 2つ選択してください","o":[{"k":"A","t":"承認プロセス","e":"これは、レコードを承認（例：割引の承認）のために送信する機能です。商談が成約したときに新しいレコード（更新商談）を自動作成する機能ではありません。"},{"k":"B","t":"フロービルダー","e":"正解です。これはSalesforceの最新の自動化ツールです。レコードトリガーフローを使用し、商談が[成約]になったことをトリガーとして、[レコードを作成]要素を使って新しい更新商談を自動的に作成できます。"},{"k":"C","t":"ワークフロールール","e":"これは古い自動化ツールです。ワークフローで実行できるアクションは、項目更新、メールアラート、ToDo作成、アウトバウンドメッセージに限られており、新しい商談レコードを作成することはできません（ToDoを除く）。"},{"k":"D","t":"プロセスビルダー","e":"正解です。プロセスビルダーも、レコードの変更（例：商談が[成約]）をトリガーにしてアクションを実行できます。[レコードを作成]アクションが含まれており、これを使用して新しい更新商談を作成することが可能です。"}],"a":["B","D"]},{"n":59,"q":"Cloud Kicksの管理者がフローを構築しており、特定の条件を満たすレコードを検索し、それらのレコードの値をフローで後で使用するために変数に保存する必要があります。管理者はどのフロー要素を追加すべきでしょうか？","o":[{"k":"A","t":"割り当て","e":"割り当て要素は、フロー内の変数に値を代入したり、変更したりするために使用されます。Salesforceデータベースからレコードを検索する機能はありません。"},{"k":"B","t":"レコードの取得","e":"正解です。この要素は、特定の条件（例：「状況」が「新規」）を満たすレコードをSalesforceデータベースから検索し、見つかったレコードの項目値をフロー内の変数に保存して、後続のステップで使用できるようにします。"},{"k":"C","t":"レコードの作成","e":"この要素は、Salesforceに新しいレコード（例：新しい取引先責任者）を作成（挿入）するために使用されます。レコードを検索する機能ではありません。"},{"k":"D","t":"レコードの更新","e":"この要素は、フロー内で取得または定義された、既存のSalesforceレコードの項目値を変更するために使用されます。レコードを検索する機能ではありません。"}],"a":["B"]},{"n":60,"q":"ケースエスカレーションルールに関して、管理者が実行できる2つのアクションはどれですか？ 2つ選択してください","o":[{"k":"A","t":"ケースを再オープンする。","e":"エスカレーションルールは、クローズされていない（オープンな）ケースがSLA違反などに達したときに実行されます。クローズされたケースを「再オープンする」アクションは含まれていません。"},{"k":"B","t":"メール通知を送信する。","e":"正解です。ケースがエスカレーション条件（例：4時間未解決）を満たすと、エスカレーションアクションとして、指定されたユーザ（例：マネージャー）や追加のメールアドレスに通知メールを送信できます。"},{"k":"C","t":"ケースの優先度を変更する。","e":"ケースエスカレーションルールのアクションには、ケースの項目（[優先度]など）を直接変更する機能は含まれていません。項目の変更は通常フローなどで自動化されます。"},{"k":"D","t":"ケースを再割り当てする。","e":"正解です。これはエスカレーションルールの主要なアクションです。ケースが時間内に処理されない場合、そのケースを自動的に別のユーザ（例：上位のサポート担当）やキュー（例：Tier 2 サポートキュー）に再割り当てすることができます。"}],"a":["B","D"]},{"n":61,"q":"Universal Containersのユーザが退職しました。管理者は後任のために新しいユーザを作成する必要がありますが、利用可能なすべてのユーザライセンスを割り当ててしまっています。新しいユーザのためにユーザライセンスを解放するには、管理者は何をすべきでしょうか？","o":[{"k":"A","t":"以前の従業員のユーザレコードを無効化する。","e":"正解です。ユーザレコードを[無効化]すると、そのユーザに割り当てられていたSalesforceライセンスが解放（リリース）され、組織のライセンスプールに戻ります。その後、そのライセンスを新しい後任ユーザに割り当てることができます。"},{"k":"B","t":"以前の従業員のユーザレコードを削除する。","e":"Salesforceでは、一度作成されたユーザレコードを削除することはできません。これは、過去の変更履歴（誰が何をしたか）やレコードの所有権を保持するためです。"},{"k":"C","t":"以前の従業員のユーザレコードを凍結する。","e":"ユーザを[凍結]すると、そのユーザは一時的にログインできなくなりますが、ライセンスは解放されません。これは、ユーザのアクセスを緊急で停止する必要がある場合に使用されます。"},{"k":"D","t":"以前のユーザレコードを新しいユーザに変更する。","e":"既存のユーザレコードの名前やメールアドレスを新しい担当者のものに変更することは、監査証跡（誰がどのレコードを所有していたか）が不正確になるため、ベストプラクティスではありません。常に新しいユーザには新しいユーザレコードを作成すべきです。"}],"a":["A"]},{"n":62,"q":"Northern Trail Outfittersの管理者が、10人の新入社員のために新しいユーザを作成しました。なぜこれらのユーザはSalesforce組織の[取引先]オブジェクトにアクセスできないのでしょうか？","o":[{"k":"A","t":"ユーザのプロファイルには、[取引先]のための共有ルールが必要です。","e":"共有ルールは、レコードレベルのアクセス（どのレコードを表示できるか）を制御するものです。オブジェクト自体（例：[取引先]タブ）にアクセスする権限とは異なります。"},{"k":"B","t":"ユーザのプロファイルには、[取引先]オブジェクトへの権限が必要です。","e":"正解です。プロファイル（または権限セット）は、オブジェクトレベルのセキュリティ（CRUD操作：作成、参照、編集、削除）を定義します。ユーザがオブジェクト自体にアクセスできない場合、そのプロファイルに必要なオブジェクト権限（最低でも[参照]権限）が付与されていないことが原因です。"},{"k":"C","t":"ユーザのロールが、ロール階層の下位にある。","e":"ロール階層は、主にレコードレベルのアクセス（どのレコードを表示できるか）を制御します。オブジェクト自体へのアクセス権を制御するものではありません。"},{"k":"D","t":"組織全体の共有設定が[非公開]に設定されている。","e":"組織全体の共有設定（OWD）もレコードレベルのアクセスを制御します。OWDが[非公開]であっても、プロファイルでオブジェクト権限があれば、オブジェクト自体（例：[取引先]タブ）にはアクセスでき、少なくとも自分が所有するレコードは表示できます。"}],"a":["B"]},{"n":63,"q":"Ursa Major Solarは、ケース作成から2時間以上エージェントからの応答を待っているケースについて、マネージャーに自動的に通知したいと考えています。管理者はこの要件を満たすためにどの機能を使用すべきでしょうか？","o":[{"k":"A","t":"割り当てルール","e":"割り当てルールは、ケースが新規作成されたときに、定義された条件に基づいて適切なユーザやキューに割り当てるために使用されます。ケース作成後の経過時間に基づいて通知する機能ではありません。"},{"k":"B","t":"ケースエスカレーションルール","e":"正解です。ケースエスカレーションルールは、ケースが定義された時間（この場合は2時間）内に特定の条件（例：ステータスが「新規」のまま）を満たした場合に、自動的にアクション（例：マネージャーへの通知）を実行するために設計されています。"},{"k":"C","t":"オムニチャネルスーパーバイザ","e":"オムニチャネルスーパーバイザは、マネージャーがエージェントの作業負荷やキューの状態をリアルタイムで監視するためのダッシュボード機能です。時間経過に基づいて自動通知を送信する自動化ルールではありません。"},{"k":"D","t":"数式項目","e":"数式項目は、レコード上の他の値に基づいて値を計算（例：ケースの経過時間を表示）するために使用されます。それ自体が通知アクションをトリガーすることはできません。"}],"a":["B"]},{"n":64,"q":"AW Computingは、リードオブジェクトに[Market Segment]という新しいカスタムテキスト項目を追加しました。リードが取引開始されるとき、その新しい項目は取引先レコードにコピーされていません。リードの[Market Segment]項目が、取引開始された取引先レコードに通常通りコピーされるようにするために、管理者は何をすべきでしょうか？","o":[{"k":"A","t":"リードの[Market Segment]項目が、取引先の正しい項目にマッピングされていることを確認する。","e":"正解です。Salesforceのリード取引開始プロセスでは、カスタム項目のデータを取引先、取引先責任者、または商談に引き継ぐために、管理者が[リードの項目マッピング]設定で明示的に対応付けを行う必要があります。"},{"k":"B","t":"取引先に、新しいリード項目と全く同じ名前の項目があることを確認する。","e":"項目名（表示ラベルやAPI参照名）が同じであっても、[リードの項目マッピング]で設定されていない限り、カスタム項目は取引開始時に自動的にコピーされません。"},{"k":"C","t":"取引先のその項目に値があることを確認するために、入力規則を作成する。","e":"入力規則は、データが特定の基準を満たしているかを検証し、満たさない場合に保存をブロックする機能です。リードからデータをコピーする機能ではありません。"},{"k":"D","t":"リードから取引先にカスタム項目をコピーするために、レコードトリガーフローを作成する。","e":"フローでカスタムロジックを組むことも技術的には可能ですが、Salesforceにはこの要件のための標準機能（リードの項目マッピング）が用意されており、それを使用するのが最も適切です。"}],"a":["A"]},{"n":65,"q":"Ursa Major Solarは、ケースにパスを使用しています。同社は、ユーザにパス上にある状況（ステータス）の値を（順番に）追跡することを要求したいと考えています。エージェントがケースを以前の状況に戻すことは禁止されるべきです。管理者はこの要求を満たすためにどの機能を使用すべきでしょうか？","o":[{"k":"A","t":"事前定義された項目値","e":"これは、主にクイックアクションで使用され、レコード作成時に特定の項目にデフォルト値を設定する機能です。ユーザが値を変更するロジックや、状況の逆戻りを防ぐ制御はできません。"},{"k":"B","t":"グローバル選択リスト値","e":"これは、複数の項目やオブジェクト間で選択リストの値を共通化・共有するための機能です。選択できる値のリストは管理できますが、状況の変更順序（逆戻り防止）を制御するものではありません。"},{"k":"C","t":"連動選択リスト","e":"これは、ある項目（制御項目）の値に基づいて、別の項目（連動項目）で選択できる値を絞り込む機能です。1つの[状況]項目自体の変更ロジックには関係ありません。"},{"k":"D","t":"入力規則","e":"正解です。入力規則では、PRIORVALUE() (変更前の値) 関数を使用して、レコードの保存前の値と現在の値を比較できます。これにより、「前の状況が[作業中]だったのに、新しい状況が[新規]に戻された」といった、意図しない逆戻りを検知し、エラーを表示して保存をブロックすることができます。"}],"a":["D"]},{"n":66,"q":"Cloud KicksのユーザがSalesforceへのログインに問題を抱えています。そのユーザは管理者にパスワードのリセットを依頼しました。管理者がユーザのパスワードをリセットする際に考慮すべき2つのオプションはどれですか？ 2つ選択してください","o":[{"k":"A","t":"パスワードをリセットすると、ユーザのパスワードポリシーが変更されます。","e":"パスワードポリシーは、組織またはプロファイルレベルで設定されるセキュリティルール（例：文字数、有効期限）です。個々のユーザのパスワードリセット操作によって、そのユーザに適用されるポリシー自体が変更されることはありません。"},{"k":"B","t":"シングルサインオンユーザは、[パスワードをお忘れですか？]リンクを使用して自分のパスワードをリセットできます。","e":"シングルサインオン（SSO）ユーザのパスワードは、Salesforceではなく外部のIDプロバイダ（例：Okta, Azure AD）によって管理されています。そのため、Salesforceの[パスワードをお忘れですか？]リンクは使用できず、IDプロバイダの手順でリセットする必要があります。"},{"k":"C","t":"ロックアウトされたユーザのパスワードをリセットすると、ユーザのアカウントは自動的にロック解除されます。","e":"正解です。ユーザがログイン試行回数の超過によりロックアウトされた場合、管理者が[パスワードのリセット]ボタンを押す操作を行うと、アカウントのロックアウトも同時に解除されます。"},{"k":"D","t":"パスワードをリセットした後、ユーザがSalesforceに正常にログインするために、デバイスの有効化が必要になる場合があります。","e":"正解です。ユーザが認識されていないブラウザやデバイスからログインしようとすると、セキュリティ（本人確認）のためにデバイスの有効化（メールで送信される確認コードの入力など）が要求されます。パスワードリセット後のログインは、このプロセスをトリガーすることがあります。"}],"a":["C","D"]},{"n":67,"q":"Universal Containersの管理者は、ユーザが彼らのネットワークの外部からSalesforceにアクセスするのを防ぐよう依頼されました。この設定に関する2つの考慮事項はどれですか？ 2つ選択してください","o":[{"k":"A","t":"IPアドレス制限は、プロファイル上、または組織に対してグローバルに設定される。","e":"正解です。Salesforceでは、組織全体の[信頼できるIP範囲]（ネットワークアクセス）でグローバルに設定する方法と、プロファイルごとにより厳密な[ログインIP範囲]を設定する方法があり、どちらもネットワークアクセスを制限するための考慮事項です。"},{"k":"B","t":"ユーザは、ログインIP制限を避けるためにパスワードを変更できる。","e":"パスワードの変更は認証（本人確認）のプロセスであり、IPアドレス制限（アクセスの場所）とは無関係です。パスワードを変更しても、IP制限を回避することはできません。"},{"k":"C","t":"IP制限を強制するには、[すべての要求でログインIP範囲を強制]が選択されている必要がある。","e":"正解です。このセッション設定を有効にすると、ログイン時だけでなく、Salesforce内でのすべての操作（クリック）がIP制限の対象となり、許可されていない場所からのセッション継続を防ぐことができます。"},{"k":"D","t":"シングルサインオンは、ユーザがどこからでもログインすることを許可する。","e":"シングルサインオン（SSO）は認証（本人確認）プロセスを簡素化するものですが、Salesforce側で設定されたIP制限（アクセスの場所）をバイパスするものではありません。SSO利用時でもIP制限は適用されます。"}],"a":["A","C"]},{"n":68,"q":"Cloud Kicksの管理者は、カスタム項目を持つ新しいカスタムオブジェクトへのアクセスを、複数のユーザに付与する必要があります。管理者はこの要件を満たすためにどの2つのオプションを使用すべきでしょうか？ 2つ選択してください","o":[{"k":"A","t":"手動共有リストに追加する","e":"手動共有は、特定の「レコード」へのアクセス権（レコードレベルのセキュリティ）を個別に付与する機能です。オブジェクト自体（タブや項目）へのアクセス権（オブジェクトレベルのセキュリティ）を付与するものではありません。"},{"k":"B","t":"権限セットグループをユーザに割り当てる","e":"正解です。権限セットグループは、複数の権限セットを一つの単位としてまとめ、ユーザの職務（例：「営業マネージャ」）に基づいて割り当てるための機能です。Cで作成した権限セットを効率的に配布するために使用されます。"},{"k":"C","t":"権限セットを作成する","e":"正解です。権限セットは、ユーザの基本プロファイルを変更することなく、特定の権限（この場合は新しいカスタムオブジェクトとカスタム項目へのアクセス）を追加で付与するための標準的な方法です。"},{"k":"D","t":"組織全体の共有設定を編集する","e":"組織全体の共有設定は、レコードレベルのセキュリティの基本（デフォルトのアクセス権）を定義するものです。ユーザがオブジェクト自体にアクセスできるかどうか（オブジェクトレベルのセキュリティ）を制御するものではありません。"}],"a":["B","C"]},{"n":69,"q":"Salesforceモバイルアプリケーションでのみ表示されるように制限されたLightningアプリケーションで利用可能な項目はどれですか？","o":[{"k":"A","t":"[今日]","e":"[今日]は、Salesforceモバイルアプリケーションの標準ナビゲーション項目の一つであり、Lightningアプリケーションのユーティリティバーで設定する特定の項目ではありません。"},{"k":"B","t":"[お気に入り]","e":"[お気に入り]も、Salesforceモバイルアプリケーションの標準ナビゲーション項目の一つであり、ユーティリティバーとは別の機能です。"},{"k":"C","t":"ユーティリティバー","e":"正解です。管理者は、Lightningアプリケーションの[アプリケーションマネージャ]設定で、ユーティリティ項目を「デスクトップおよび電話」で利用できるように設定できます。これにより、ユーティリティバーの項目がSalesforceモバイルアプリケーションの[その他]メニューからアクセス可能になります。"},{"k":"D","t":"ホームページ","e":"[ホームページ]は、Lightningアプリケーションの主要なタブ（ページ）の一つであり、ユーティリティバー（アプリケーションのフッターやモバイルの[その他]メニューからアクセスする補助的なツール）とは異なるコンポーネントです。"}],"a":["C"]},{"n":70,"q":"Ursa Major Solarの管理者は、カスタムレポートタイプを作成し、営業業務チームのためにレポートを作成しました。しかし、どのユーザもそのレポートにアクセスできません。どの2つのオプションがこの問題の原因である可能性がありますか？ 2つ選択してください","o":[{"k":"A","t":"カスタムレポートタイプが[開発中]である。","e":"正解です。カスタムレポートタイプの状況が[開発中]の場合、システム管理者および[カスタムレポートタイプの管理]権限を持つユーザのみが、そのレポートタイプに基づくレポートを実行できます。営業業務チームがこの権限を持っていなければ、レポートにアクセスできません。"},{"k":"B","t":"ユーザのプロファイルに参照アクセス権がない。","e":"ユーザのプロファイルにレポート内のオブジェクトへの[参照]アクセス権がない場合、レポートを開いてもデータが表示されない（0件として表示される）ことはありますが、レポート自体にアクセスできない原因としては、AやDの方が可能性が高いです。"},{"k":"C","t":"組織がカスタムレポートタイプの上限に達している。","e":"組織がカスタムレポートタイプの上限に達している場合、管理者はそもそも新しいカスタムレポートタイプの作成を完了できなかったはずです。"},{"k":"D","t":"レポートが個人（非公開）フォルダに保存されている。","e":"正解です。レポートが作成者（この場合は管理者）の[私の個人カスタムレポート]フォルダ（非公開フォルダ）に保存されている場合、他のユーザはそのフォルダにアクセスできず、レポートを表示したり実行したりすることができません。"}],"a":["A","D"]},{"n":71,"q":"Ursa Major Solarは、太平洋時間の担当者のために営業時間を午前9時から午後5時に設定しています。東部時間の担当者は、サポートをカバーするために3時間早く営業時間を設定する必要があります。管理者はこの問題をどのように解決すべきですか？","o":[{"k":"A","t":"タイムゾーンごとに一時的な営業時間を設定する。","e":"営業時間は通常、一時的ではなく継続的な運用ルールです。Salesforceの「営業時間」機能は、恒久的な設定（または休業時間の設定）を意図しており、「一時的」な設定は要件に合いません。"},{"k":"B","t":"東部標準時に合わせるために、現在の営業時間を調整する。","e":"既存の「太平洋時間」の営業時間を変更してしまうと、太平洋時間の担当者の運用（SLA計算など）に影響が出てしまいます。両方のタイムゾーンをサポートする必要があるため、これは不適切です。"},{"k":"C","t":"タイムゾーンごとに1セットの営業時間を作成する。","e":"正解です。Salesforceでは、[設定]の[営業時間]で複数の営業時間レコードを作成できます。管理者は「太平洋時間 9-5」用と「東部時間（例：9-5 ET）」用の2つの異なるレコードを作成し、それぞれを適切なSLAプロセスやエスカレーションルールに関連付けることができます。"},{"k":"D","t":"担当者が営業時間を手動で設定できるようにする。","e":"営業時間は、SLAやエスカレーションルールなど、組織の自動化プロセスを制御するためのものであり、個々の担当者が手動で設定するものではありません（これはユーザ個人のタイムゾーン設定とは異なります）。"}],"a":["C"]},{"n":72,"q":"Cloud Kicksは、注文で適切な配送先情報が使用されるようにする必要があります。担当が取引先の配送先住所を変更したときに、その取引先に関連する選択した注文の配送先住所を更新するための、合理化されたソリューションが必要です。管理者はこの要件をどのように実現すべきでしょうか？","o":[{"k":"A","t":"注文ページ上の自動起動フロー。取引先の配送先住所が変更されるたびに、すべての未処理の注文の配送先住所を更新する。","e":"アクションの起点は取引先の変更であり、注文ページではないため不適切です。また、自動起動フローではユーザが更新する注文を「選択」できません。"},{"k":"B","t":"取引先ページ上の自動起動フロー。取引先の配送先住所が変更されるたびに、すべての未処理の注文の配送先住所を更新する。","e":"自動起動フロー（レコードトリガーフローなど）は、ユーザの介入なしにバックグラウンドで実行されます。これでは、担当が更新する注文を「選択する」という要件を満たせません。"},{"k":"C","t":"注文ページ上の画面フロー。担当が、関連するすべての未処理の注文で、更新された取引先の配送先住所を選択できるようにする。","e":"このフローは単一の注文ページで実行されます。要件は、1つの取引先の変更に基づき、関連する複数の注文を選択的に更新することであるため、取引先ページで実行する方が合理的です。"},{"k":"D","t":"取引先ページ上の画面フロー。担当が、関連するすべての未処理の注文で、更新された取引先の配送先住所を選択できるようにする。","e":"正解です。取引先ページに（ボタンなどで起動する）画面フローを配置することで、担当は取引先住所を変更した後、そのフローを起動できます。フローは関連する未処理の注文を一覧表示し、担当が更新したい注文を「選択」できる画面を提供します。"}],"a":["D"]},{"n":73,"q":"Cloud Kicks (CK) の新しい管理者は、今後のライセンス購入の予算を立てるために、Salesforceの使用状況を詳述するメモをまとめるよう依頼されました。管理者は、CKがどのタイプのライセンスを購入し、いくつ利用可能かを確認するために、どこを参照すべきでしょうか？","o":[{"k":"A","t":"[設定]でライセンスタイプを検索する。","e":"[設定]で検索すると、ライセンスに関連する様々な設定ページ（例：ユーザライセンス、権限セットライセンス）に移動できますが、購入したライセンスの総数と残数を一覧で確認する場所は[組織情報]ページです。"},{"k":"B","t":"[組織情報]の[ユーザライセンス]関連リスト。","e":"正解です。[設定]メニューの[組織情報]ページには、[ユーザライセンス]という関連リストがあります。ここには、組織が購入したすべてのユーザライセンス（例：Salesforce）について、[合計ライセンス数]、[使用ライセンス数]、[残りのライセンス数]が一覧表示されます。"},{"k":"C","t":"[設定]の[ユーザ管理設定]。","e":"[ユーザ管理設定]ページでは、ユーザのプロビジョニングやパスワードポリシーなど、ユーザ管理に関連する組織全体の動作を制御します。購入したライセンス数を確認する場所ではありません。"},{"k":"D","t":"[組織情報]の[使用量ベースのエンタイトルメント]関連リスト。","e":"この関連リストには、APIコール数やデータストレージ制限など、ユーザ数ではなく使用量に基づく制限が表示されます。ユーザライセンスの数を確認する場所ではありません。"}],"a":["B"]},{"n":74,"q":"Ursa Major Solarの営業担当が、一連のネットワーキングイベントを開始しました。彼らは毎月1回イベントを主催し、月別およびシリーズ別でキャンペーンのROIをレポートできるようにしたいと考えています。管理者は、レポート作成を簡素化するためにキャンペーンをどのように設定すべきでしょうか？","o":[{"k":"A","t":"月次イベントタイプ用に異なるレコードタイプを追加する。","e":"レコードタイプは、キャンペーンのレイアウトやプロセスを区別するために使用されますが、複数のキャンペーンのROIを「シリーズ」として集計するレポート要件には直接対応できません。"},{"k":"B","t":"すべて同じ名前を持つ個別のキャンペーンを作成する。","e":"同じ名前のキャンペーンを複数作成すると、レポート上でそれらを区別することが非常に困難になり、月別の分析が複雑になるため、不適切です。"},{"k":"C","t":"メンバーがどのイベントに参加したかを記録するために、キャンペーンメンバーの状況を設定する。","e":"キャンペーンメンバーの状況は、そのキャンペーンに対するメンバーの反応（例：「参加」、「欠席」）を追跡するものです。複数のキャンペーンを1つの「シリーズ」として集計する機能ではありません。"},{"k":"D","t":"月次イベントが親キャンペーンに積み上がるように、キャンペーン階層を使用する。","e":"正解です。キャンペーン階層を使用すると、個々の月次イベント（子キャンペーン）を作成し、それらすべてを1つの「シリーズ」（親キャンペーン）に関連付けることができます。これにより、レポートで月別のROI（子キャンペーンごと）とシリーズ全体のROI（親キャンペーンでの積み上げ集計）を簡単に確認できます。"}],"a":["D"]},{"n":75,"q":"Northern Trail Outfittersのマーケティングディレクターは、リードの[状況]項目が「Qualified（適格）」としてマークされるためには、[予算]項目が入力されている必要がある、と要求しました。管理者はこの要求を満たすためにどのツールを使用すべきでしょうか？","o":[{"k":"A","t":"リードの取引開始","e":"これは、リードを取引先、取引先責任者、商談に変換（コンバート）するプロセスのことです。特定の状況下で項目入力を強制する機能ではありません。"},{"k":"B","t":"項目の必須設定","e":"これは、ページレイアウトや項目レベルで[予算]項目を必須に設定することを指します。この設定では、状況が「Qualified」の時だけでなく、リード作成時など常に[予算]項目が必須となり、要件（状況がQualifiedの時だけ）を満たせません。"},{"k":"C","t":"ワークフロールール","e":"ワークフロールールは、レコードの保存時に項目更新やメール送信などを自動化する機能です。データが基準を満たさない場合に、ユーザにエラーを表示して保存をブロックすることはできません。"},{"k":"D","t":"入力規則","e":"正解です。入力規則は、レコードが保存される前にデータを検証するために使用されます。「状況が[Qualified]」かつ「[予算]項目が空白」の場合にエラーメッセージを表示するルールを設定することで、要件を正確に満たすことができます。"}],"a":["D"]},{"n":76,"q":"Cloud Kicksの管理者が、本番環境に新しいレコードを作成するはずのフローを持っています。しかし、新しいレコードが作成されていません。何が問題である可能性がありますか？","o":[{"k":"A","t":"フローが読み取り専用である。","e":"フローには「読み取り専用」という実行状態や設定はありません。フローはバージョン管理されますが、この設定がレコード作成を妨げる原因ではありません。"},{"k":"B","t":"フローが無効である。","e":"正解です。レコードトリガーフローや自動起動フローは、作成後に「有効化」される必要があります。フローが「無効」状態のままであれば、トリガー条件（例：レコードの作成）が満たされても実行されず、新しいレコードは作成されません。"},{"k":"C","t":"フローURLが無効化されている。","e":"フローURLは、主に画面フローを外部（例：Webサイトやポータル）から呼び出すために使用されます。レコード作成を自動化する（バックグラウンドで実行される）フローの動作には通常関係ありません。"},{"k":"D","t":"フローのトリガーが見つからない。","e":"フローが本番環境に自動化として存在するということは、トリガー（例：レコードが作成されたとき）は設定されているはずです。トリガーがないとフローは有効化できません。"}],"a":["B"]},{"n":77,"q":"管理者は、組織で行われた最近の設定変更を確認するためにどのツールを使用すべきでしょうか？","o":[{"k":"A","t":"重要な更新","e":"「重要な更新」（現在は「リリースの更新」）は、Salesforceが組織に影響を与える可能性のある新しいリリースや機能の更新を通知する場所です。管理者が行った設定変更の履歴ではありません。"},{"k":"B","t":"デバッグログ","e":"デバッグログは、フロー、Apex、入力規則などの自動化プロセスが実行された際の詳細なトランザクション情報をキャプチャするために使用されます。主にトラブルシューティング用であり、設定変更の履歴ではありません。"},{"k":"C","t":"設定変更履歴","e":"正解です。設定変更履歴は、[設定]メニュー内で行われた変更（例：プロファイルの変更、項目の作成、入力規則の変更など）を追跡し、過去6か月分の変更履歴（いつ、誰が、何を変更したか）をレビューできる機能です。"},{"k":"D","t":"項目履歴管理","e":"項目履歴管理は、特定のレコード（例：取引先レコード）の項目値（例：[電話]項目）がいつ、誰によって変更されたかを追跡する機能です。組織の設定変更を追跡するものではありません。"}],"a":["C"]},{"n":78,"q":"Cloud Kicksの管理者は、ユーザがSalesforceで繰り返しToDoを追加できないと報告されました。管理者がユーザがこれをできるようにするために使用すべき2つの解決策はどれですか？ 2つ選択してください","o":[{"k":"A","t":"[活動設定]で[繰り返しToDoの作成を有効化]する","e":"正解です。ユーザが繰り返しToDoを作成できるようにするための、組織全体の基本設定です。この設定が[活動設定]で有効になっていなければ、ユーザはこの機能を利用できません。"},{"k":"B","t":"[共有活動]を無効にする","e":"[共有活動]は、1つのToDoや行動を複数の取引先責任者に関連付ける機能です。ToDoの繰り返し機能とは関係ありません。"},{"k":"C","t":"[ToDoの繰り返しの作成]項目をページレイアウトに追加する","e":"正解です。組織設定（A）が有効になっていても、ユーザが実際に繰り返しを設定するためのUI（[繰り返す]チェックボックスと頻度設定）がToDoのページレイアウトから削除されている場合、ユーザは繰り返しToDoを作成できません。"},{"k":"D","t":"[ToDo通知]サービスをオンにする","e":"ToDo通知は、ToDoの期日に関するリマインダーをユーザに送信する機能です。繰り返しToDoを作成する機能とは関係ありません。"}],"a":["A","C"]},{"n":79,"q":"Northern Trail Outfitters (NTO) は [私のドメイン] をデプロイしました。最高マーケティング責任者は、すべてのSalesforceユーザがブランド化されたログインURLを使用してログインするようにしたいと考えています。ユーザのブックマークが更新されるための猶予期間が必要です。管理者は[私のドメイン]設定のポリシーをどのように設定すべきでしょうか？","o":[{"k":"A","t":"ログインポリシーを https://nto.my.salesforce.com からのログインを必須に設定する。","e":"[私のドメイン]の[ログインポリシー]設定には、特定の[私のドメイン]URLからのログインを「必須にする」というオプションはありません（[禁止する]オプションはDにあります）。"},{"k":"B","t":"リダイレクトポリシーを「リダイレクトしない」に設定する。","e":"この設定（リダイレクトなし）を選択すると、ユーザが古いブックマーク（例: login.salesforce.com）を使用した場合、単にエラーページが表示され、新しいドメインにリダイレクトされません。これは「猶予期間」の要件を満たしません。"},{"k":"C","t":"リダイレクトポリシーを「ドメイン内の同じページに警告付きでリダイレクトする」に設定する。","e":"正解です。このリダイレクトポリシーは、ユーザが古いURLにアクセスした場合でも自動的に新しい[私のドメイン]のURLにリダイレクトし、さらに「ブックマークを更新してください」という警告メッセージを表示します。これにより、業務を中断させることなく「猶予期間」を提供できます。"},{"k":"D","t":"ログインポリシーを https://login.salesforce.com からのログインを禁止するように設定する。","e":"この[ログインポリシー]設定を有効にすると、古いURL（login.salesforce.com）からのログインが即座にブロックされます。これは「猶予期間」の要件に反します。この設定は通常、猶予期間が終了した後に有効化されます。"}],"a":["C"]},{"n":80,"q":"Cloud Kicksの管理者が、取引先責任者を作成する画面フローをデバッグしようとしています。フロー内の変数の1つがデバッグ画面に表示されません。何がこの問題を引き起こしている可能性がありますか？","o":[{"k":"A","t":"[入力で使用可能]チェックボックスがオフになっていた。","e":"正解です。画面フローのデバッグを開始する際、[デバッグの詳細]セクション（デバッグ画面の初期画面）に表示され、テスト値を入力できる変数は、その変数の設定で[入力で使用可能]チェックボックスがオンになっているものだけです。"},{"k":"B","t":"フローが無効なバージョンである。","e":"フローのデバッグは、有効化されているバージョンでも無効な（保存されている）バージョンでも実行可能です。フローの有効/無効の状態は、デバッグ画面に変数が表示されるかどうかには影響しません。"},{"k":"C","t":"項目タイプがデバッグでサポートされていない。","e":"フローデバッガは、テキスト、数値、レコード変数など、フローで使用される標準的なデータ型をサポートしています。特定の型が原因でデバッグ画面から除外されることは通常ありません。"},{"k":"D","t":"[出力で使用可能]チェックボックスがオフになっていた。","e":"[出力で使用可能]チェックボックスは、そのフローがサブフローとして別のフローから呼び出されたときに、親フローに変数の値を返すかどうかを制御します。デバッグ画面での入力表示には影響しません。"}],"a":["A"]},{"n":81,"q":"Cloud Kicksには、同じ画面に2つの質問がある画面フローがありますが、一度に必要とされるのは1つだけです。管理者は、必要な質問のみを表示するように依頼されました。管理者はこれをどのように完了すべきでしょうか？","o":[{"k":"A","t":"シナリオごとに新しいバージョンのフローを使用する。","e":"フローのバージョンは、フローの設計自体を更新するために使用するものです。実行時にユーザに表示する質問を動的に切り替えるために使用するものではありません。"},{"k":"B","t":"決定要素と新しい画面を使用して、適切な質問を表示する。","e":"この方法でも実現可能ですが、要件は「同じ画面」上で制御することです。決定要素を使ってユーザを別々の画面に誘導するのは、ユーザ体験として最適ではない場合があります。"},{"k":"C","t":"コンポーネントの表示/非表示（条件付き表示）を使用して、不要な質問を非表示にする。","e":"正解です。画面フローの各コンポーネント（質問項目）には「コンポーネントの表示/非表示」設定があります。これを使用すると、同じ画面上の他の項目の値や変数の状態に基づいて、質問を動的に表示または非表示にできます。"},{"k":"D","t":"フロー画面内の分岐を使用して、適切なシナリオを表示する。","e":"フロー画面コンポーネント自体に「分岐」という機能はありません。フローのロジック分岐（パスの分岐）は「決定」要素によって制御されます。"}],"a":["C"]},{"n":82,"q":"Cloud Kicksは、Salesforceを利用して製品の出荷を追跡するより良い方法に取り組んでいます。管理者は座標を記録するためにどの項目タイプを使用すべきでしょうか？","o":[{"k":"A","t":"位置情報","e":"正解です。位置情報（Geolocation）項目タイプは、緯度と経度の座標を保存するために特別に設計されたカスタム項目です。これにより、レコードの位置を地図上に表示したり、場所間の距離を計算したりできます。"},{"k":"B","t":"ジオフェンス","e":"ジオフェンスは、Salesforceの標準項目タイプではありません。これは、Field Serviceなどの機能で使用される、特定の地理的境界を定義する概念を指します。"},{"k":"C","t":"カスタム住所","e":"「カスタム住所」という名前の標準項目タイプはありません。Salesforceには標準の[住所]（Address）複合項目タイプがありますが、これは主に市区町村や郵便番号などの住所情報を保存するもので、座標（位置情報）を保存するものではありません。"},{"k":"D","t":"外部参照","e":"外部参照（External Lookup）は、Salesforce Connectを使用して、Salesforce組織外の外部オブジェクトのレコードに関連付けるために使用される項目タイプです。座標を保存するものではありません。"}],"a":["A"]},{"n":83,"q":"Universal ContainersのITマネージャーが、システムのセキュリティ監査を行っています。管理者は、組織のセキュリティ状態の概要をどのように提供すべきでしょうか？","o":[{"k":"A","t":"組織全体の共有設定を[非公開]に変更して、可視性を制限する。","e":"組織全体の共有設定は、レコードのデフォルトの可視性を制御するものであり、組織のセキュリティ設定（パスワードポリシーなど）の概要を提供するツールではありません。"},{"k":"B","t":"イベント監視をオンにして、ユーザイベントを追跡する。","e":"イベント監視は、ユーザの行動を詳細に追跡する機能であり、監査には役立ちますが、セキュリティ設定の脆弱性をまとめた概要を提供するものではありません。"},{"k":"C","t":"過去6か月分のユーザログインデータをダウンロードする。","e":"ユーザログイン履歴は、誰がアクセスしたかを示しますが、組織のセキュリティ設定が安全かどうかの概要（サマリー）ではありません。"},{"k":"D","t":"ヘルスチェックを実行して、脆弱性を特定する。","e":"正解です。セキュリティヘルスチェックは、組織のセキュリティ設定をSalesforceのベースラインと比較し、潜在的な脆弱性を特定し、スコアと修正の推奨事項を概要として提供する専用のツールです。"}],"a":["D"]},{"n":84,"q":"Ursa Major Solarは、申請、ルーティング、および承認を簡素化するために、ガイド付きの経費報告プロセスでユーザを支援したいと考えています。管理者はこのソリューションを構築するためにどの2つのツールを使用すべきでしょうか？ 2つ選択してください","o":[{"k":"A","t":"入力規則","e":"入力規則は、データが特定の基準を満たしているかを検証し、満たさない場合に保存をブロックする機能です。「ガイド付きのプロセス」や「ルーティング」、「承認」の要件を満たすものではありません。"},{"k":"B","t":"フロービルダー","e":"正解です。フロービルダー（特に画面フロー）は、ユーザを経費報告の入力ステップ（例：経費の入力、領収書の添付）を通じて案内する「ガイド付きのプロセス」を作成するために使用されます。"},{"k":"C","t":"承認プロセス","e":"正解です。承認プロセスは、送信されたレコード（経費報告）を、定義されたルール（例：金額に基づく）に従って適切な承認者（例：マネージャー）に「ルーティング」し、正式な「承認」または却下を得るために設計された機能です。"},{"k":"D","t":"クイックアクション","e":"クイックアクションは、レコードをすばやく作成したり更新したりするためのショートカット機能です。ガイド付きのステップバイステップのプロセスや、複雑な承認ルーティングを管理する機能ではありません。"}],"a":["B","C"]},{"n":85,"q":"DreamHouse Realtyのブローカーは、取引先責任者レコードを参照するときに、1つ以上のケースに関する特定の情報（ケース名、ケースID、顧客名、ケースの理由、ケースの状況、ケース作成日）を見る必要があります。管理者は[設定]でどの2つの変更を行うべきでしょうか？ 2つ選択してください","o":[{"k":"A","t":"ページレイアウトエディタを使用して、関連リストタイプを[拡張リスト]に変更する。","e":"関連リストの表示タイプ（例：[拡張リスト]）は、ページレイアウトエディタではなく、Lightningアプリケーションビルダーで設定します。"},{"k":"B","t":"Lightningアプリケーションビルダーで[関連リスト]コンポーネントを編集し、関連リストタイプとして[関連リスト]を選択する。","e":"正解です。Lightningレコードページに、ケース関連リストを表示するためのコンポーネント（[関連リスト]または[関連リスト - 単一]）を配置し、設定する必要があります。"},{"k":"C","t":"Lightningアプリケーションビルダーで[関連リスト]コンポーネントを編集し、関連リストタイプとして[拡張リスト]を選択する。","e":"[拡張リスト]は6項目を表示できますが、まずページレイアウトで列を定義（D）し、コンポーネントを配置（B）することが基本的なステップとなります。"},{"k":"D","t":"ページレイアウトエディタを使用して、[ケース]関連リストに適切な列を含める。","e":"正解です。関連リストに表示される項目（列）は、取引先責任者オブジェクトのページレイアウトエディタで、[ケース]関連リストのプロパティを編集して追加する必要があります。"}],"a":["B","D"]},{"n":86,"q":"Cloud Kicksのマーケティングユーザは、取引開始済みのリードを表示および編集できる必要があります。管理者は彼らに「取引開始済みリードの表示および編集」権限を持つ権限セットを割り当てました。マーケティングユーザが編集のために取引開始済みリードにアクセスできる2つの方法はどれですか？ 2つ選択してください","o":[{"k":"A","t":"グローバル検索結果で見つける。","e":"正解です。「取引開始済みリードの表示および編集」権限を付与すると、通常は検索結果に表示されない取引開始済みのリードが、グローバル検索の対象となり、アクセスできるようになります。"},{"k":"B","t":"ホームページの[最近参照したレコード]コンポーネントを検索する。","e":"[最近参照したレコード]コンポーネントは、ユーザが最近アクセスしたレコードを表示します。取引開始済みのリードは、検索（A）やリストビュー（C）などでアクセスした後であればここに表示されるかもしれませんが、これ自体が取引開始済みリードを見つけるための主要なアクセス方法ではありません。"},{"k":"C","t":"リードの状況が[Qualified (取引開始済み)]であるリストビューを利用する。","e":"正解です。この権限により、リードのリストビューで取引開始済みのリード（通常は除外される）を表示できるようになります。ユーザは、リードの状況が取引開始済みの値（例：Qualified）であるリストビューを作成または使用して、これらのレコードにアクセスできます。"},{"k":"D","t":"データインポートウィザードを使用する。","e":"データインポートウィザードは、新しいレコードを一括でインポートしたり、既存のレコードを更新したりするためのツールです。ユーザがインターフェース上で個々の取引開始済みリードにアクセスして編集するための機能ではありません。"}],"a":["A","C"]},{"n":87,"q":"Cloud Kicksの管理者が、退職したユーザを無効化したいと考えています。ユーザが無効化できない2つの理由は何ですか？ 2つ選択してください","o":[{"k":"A","t":"ユーザがテリトリー階層の一部である。","e":"正解です。ユーザがテリトリー管理（Enterprise Territory Management）モデルにおいて、テリトリーに割り当てられている、または階層の一部である場合、無効化の前にテリトリーから削除する必要があります。"},{"k":"B","t":"ユーザがカスタム階層項目（参照先）になっている。","e":"ユーザがカスタム参照項目（例：マネージャ項目）の値として設定されているだけでは、通常、ユーザの無効化はブロックされません。"},{"k":"C","t":"ユーザがワークフローのメールアラートに割り当てられている。","e":"正解です。ユーザがワークフローのメールアラートの受信者、承認プロセスの承認者、またはケースエスカレーションルールの通知先などに設定されている場合、これらの自動化設定から削除されるまで無効化できません。"},{"k":"D","t":"ユーザがロール階層の最上位ロールである。","e":"ロール階層の最上位にいること自体は、ユーザの無効化を直接妨げる要因にはなりません。"}],"a":["A","C"]},{"n":88,"q":"管理者がSalesforceオブジェクトを扱う際に、留意すべき2つの考慮事項はどれですか？ 2つ選択してください","o":[{"k":"A","t":"カスタムオブジェクトと標準オブジェクトは、標準項目を持っています。","e":"標準オブジェクト（例：取引先）は標準項目（例：取引先名）を持っています。カスタムオブジェクトが作成時に持つのは、システム標準項目（所有者、作成日など）であり、通常は管理者がカスタム項目を追加して使用します。"},{"k":"B","t":"標準オブジェクトはSalesforceに（あらかじめ）含まれています。","e":"正解です。標準オブジェクトは、Salesforceライセンスの一部として最初から提供されている基本的なオブジェクト（例：取引先、取引先責任者、商談、ケース）です。"},{"k":"C","t":"新しい標準オブジェクトを作成することができます。","e":"正解です。（注：この選択肢は「標準オブジェクト」と記載されていますが、Salesforceの仕様上、管理者が新しく作成できるのは「カスタムオブジェクト」です。「標準オブジェクト」はSalesforceによって定義されており、管理者は作成できません。文脈上、管理者がビジネスニーズに合わせて新しいオブジェクト（カスタムオブジェクト）を作成できることを指していると考えられます。）"},{"k":"D","t":"標準オブジェクトのみが主従関係をサポートしています。","e":"カスタムオブジェクトも主従関係の主（親）または従（子）として使用できます。したがって、この記述は誤りです。"}],"a":["B","C"]},{"n":89,"q":"マーケティングチームは、アップセルプロモーションキャンペーンのために、[キャンペーンメンバーの状況]項目に新しい選択リスト値を追加したいと考えています。管理者は、選択リストの項目値を変更するためにどの2つの解決策を使用すべきでしょうか？ 2つ選択してください","o":[{"k":"A","t":"[キャンペーンメンバーの状況]関連リストをページレイアウトに追加する。","e":"これは、ページレイアウト上にコンポーネントを表示するための設定であり、選択リスト項目で利用可能な「値」自体を変更する操作ではありません。"},{"k":"B","t":"オブジェクトマネージャで[キャンペーンの状況]の選択リスト値を編集する。","e":"正解です。この選択肢は、[キャンペーンメンバーの状況]の編集を意図していると考えられます。管理者は、[設定] > [オブジェクトマネージャ] > [キャンペーンメンバー] > [項目とリレーション] > [状況] に移動し、すべてのキャンペーンで使用されるデフォルトの選択リスト値を追加・編集できます。"},{"k":"C","t":"[キャンペーンメンバーの状況]関連リストを一括変更する。","e":"これは、リストビューなどで既存のキャンペーンメンバーレコードの「データ」を一括で更新する操作を指す可能性があり、選択リストの定義（利用可能な値のリスト）を変更する操作ではありません。"},{"k":"D","t":"[キャンペーンメンバーの状況]関連リストで選択リスト値を変更する。","e":"正解です。特定のキャンペーン（今回の \"upsell promotional campaign\"）にのみ値を追加する場合、管理者はそのキャンペーンレコードページを開き、[キャンペーンメンバーの状況]関連リストの設定（[高度な設定]など）から、そのキャンペーン固有の状況値を追加・編集できます。"}],"a":["B","D"]},{"n":90,"q":"AW Computingは、ケースのLightningレコードページを改善したいと考えており、以下を含めることを望んでいます: ケースがクリティカルレコードタイプとして保存された場合、太字のフォントでメッセージを表示するフィルタリングされたコンポーネント。 ケースレイアウトから取引先の状況を素早く更新する方法。 管理者はこれらの要求を満たすためにどの2つのコンポーネントを使用すべきでしょうか？ 2つ選択してください","o":[{"k":"A","t":"関連リスト","e":"関連リストコンポーネントは、関連するレコードの「リスト」（例：取引先に関連するすべてのケース）を表示するために使用されます。特定のメッセージを表示したり、単一の親レコード（取引先）を更新したりする機能はありません。"},{"k":"B","t":"関連レコード","e":"正解です。これは要件2「取引先の状況を素早く更新する」を満たします。関連レコードコンポーネントをケースページに配置し、参照項目（この場合は取引先）を指定することで、親である取引先レコードの詳細を表示し、そのレイアウトから直接項目（取引先の状況など）を更新できます。"},{"k":"C","t":"レコードの詳細","e":"レコードの詳細コンポーネントは、現在のレコード（この場合はケース）の項目を表示する主要なコンポーネントです。関連する取引先の項目を更新したり、条件付きのメッセージを表示したりするものではありません。"},{"k":"D","t":"リッチテキスト","e":"正解です。これは要件1「フィルタリングされたコンポーネント」を満たします。管理者は、リッチテキストコンポーネントをページに追加し、「太字のフォントでメッセージ」を入力できます。その後、[コンポーネントの表示/非表示]設定を使用して、[レコードタイプ]が[Critical]である場合にのみ、このコンポーネントが表示されるように設定できます。"}],"a":["B","D"]},{"n":91,"q":"AW Computingの管理者が、Salesforceへのログインに問題を抱えているユーザに対応しています。管理者は、なぜユーザがログインできないのかを特定するために何をすべきでしょうか？","o":[{"k":"A","t":"ユーザのログイン履歴を確認する。","e":"正解です。ユーザのログイン履歴には、そのユーザの最近のログイン試行がすべて記録されます。ログインが失敗した場合、その理由（例：「パスワードが無効」、「ロックアウト」、「IP制限」など）が[状況]列に表示されるため、問題を特定するのに最適です。"},{"k":"B","t":"設定変更履歴を実行して、ログイン試行を確認する。","e":"設定変更履歴は、管理者が[設定]メニューで行った変更（例：プロファイルの編集、項目の作成）を追跡する機能です。個々のユーザのログイン試行（成功または失敗）を追跡するものではありません。"},{"k":"C","t":"パスワード履歴を取得し、パスワードポリシーに従っていたことを確認する。","e":"パスワード履歴は、ユーザが過去に使用したパスワードを（暗号化された形式で）管理するものですが、ログイン失敗の理由を特定する直接的なログではありません。"},{"k":"D","t":"プロファイルのセキュリティトークンをリセットする。","e":"セキュリティトークンはユーザごとにリセットするものであり、プロファイルごとではありません。また、トークンをリセットすることは、ログイン問題の解決策（APIログイン用）にはなるかもしれませんが、ログイン失敗の原因を特定するための調査ステップではありません。"}],"a":["A"]},{"n":92,"q":"Northern Trail Outfittersの管理者は、割り当てられたライセンスと権限セットをスプレッドシートで追跡していました。Salesforceでこれを追跡するために使用できる機能は何ですか？","o":[{"k":"A","t":"ログイン履歴","e":"ログイン履歴は、ユーザーがいつ、どこからSalesforceにログインしたかというアクセス記録を追跡します。割り当てられたライセンスや権限セットを一覧表示し、管理するための機能ではありません。"},{"k":"B","t":"Lightning使用状況アプリケーション","e":"Lightning使用状況アプリケーションは、Lightning Experienceの採用状況、ページのパフォーマンス、ユーザーの活動状況を監視するためのものです。ライセンスや権限の割り当て状況を追跡するものではありません。"},{"k":"C","t":"ユーザーレポート","e":"正解です。標準の「ユーザー」レポートタイプを使用してレポートを作成することで、組織内のすべてのユーザーと、彼らに割り当てられたプロファイル、ロール、およびライセンスタイプを一覧表示できます。権限セットの割り当て状況もレポートで追跡できるため、スプレッドシートの代替として最適です。"},{"k":"D","t":"権限セットグループ","e":"権限セットグループは、複数の権限セットを1つのグループにまとめ、ユーザーへの割り当てを簡素化するための機能です。これは権限を割り当てるための機能であり、割り当て状況を追跡・報告するための機能ではありません。"}],"a":["C"]},{"n":93,"q":"Northern Trail Outfitters には、取引先に新規ケースを作成するカスタムクイックアクションがあります。管理者はどうすればそのクイックアクションをSalesforceモバイルアプリで利用できるようにできますか？","o":[{"k":"A","t":"アクションを含むカスタムLightningアプリケーションを作成する。","e":"カスタムLightningアプリケーションは、ユーザーがアクセスできるタブの集まりやナビゲーションバーを定義しますが、特定のオブジェクトのレコードページに表示されるクイックアクションを制御するものではありません。"},{"k":"B","t":"アクションを含めるために、ケースのコンパクトページレイアウトを変更する。","e":"コンパクトレイアウトは、モバイルアプリのレコードハイライト（上部）に表示される主要な項目を制御します。また、このクイックアクションは取引先オブジェクト（起点）に属するため、ケース（作成対象）のレイアウトではなく、取引先のレイアウトで設定します。"},{"k":"C","t":"アクションをSalesforceモバイルナビゲーションメニューに含める。","e":"モバイルナビゲーションメニューは、モバイルアプリのメインメニュー（左側のスライドメニュー）に表示される項目（オブジェクト、Lightningページなど）を設定する場所であり、レコードページのアクションを制御するものではありません。"},{"k":"D","t":"「SalesforceモバイルおよびLightning Experienceのアクション」をページレイアウトに追加する。","e":"正解です。オブジェクト固有のクイックアクション（この場合は取引先オブジェクトの「新規ケース」アクション）をモバイルアプリやLightning Experienceのレコードページで利用可能にするには、そのオブジェクト（取引先）のページレイアウトを編集し、「SalesforceモバイルおよびLightning Experienceのアクション」セクションに該当のアクションをドラッグアンドドロップで追加する必要があります。"}],"a":["D"]},{"n":94,"q":"新規リードを、リードの住所に基づいて正しい営業担当者にルーティングする必要があります。管理者はこの要件をどのように設定すべきですか？","o":[{"k":"A","t":"数式項目を作成する。","e":"数式項目は、他の項目の値に基づいて自動的に値を計算する項目です。レコードの所有権を特定のユーザーに割り当てる（ルーティングする）機能はありません。"},{"k":"B","t":"リード割り当てルールを使用する。","e":"正解です。リード割り当てルールは、Salesforceの標準機能であり、リードが作成された際に、定義された条件（この場合は住所情報）に基づいて、リードを自動的に適切なユーザーまたはキューに割り当てるために設計されています。"},{"k":"C","t":"エスカレーションルールで割り当てる。","e":"エスカレーションルールは、主に対応が遅れているケースを自動的に再割り当てしたり通知したりするために使用される機能です。リードの新規割り当てには使用されません。"},{"k":"D","t":"入力規則を設定する。","e":"入力規則は、ユーザーが入力したデータが特定の基準を満たしているかどうかを保存前に検証し、満たしていない場合にエラーメッセージを表示する機能です。レコードの割り当てには関係ありません。"}],"a":["B"]},{"n":95,"q":"DreamHouse Realtyは、取引先とケースのカテゴリ項目で、レコードタイプに応じた一貫した選択リストの値を使用する必要があります。（2つ選択）","o":[{"k":"A","t":"複数選択選択リスト","e":"これは、ユーザーが一度に複数の値を選択できる選択リストのデータ型を指します。オブジェクト間で値の一貫性を持たせたり、レコードタイプに応じて値を制御したりする特定の要件には直接対応していません。"},{"k":"B","t":"連動選択リスト","e":"正解です。連動選択リストは、ある項目（制御項目）の値に基づいて、別の項目（この場合はカテゴリ項目）で利用可能な値を動的に絞り込む機能です。これは、レコードタイプによる値の制御と組み合わせて使用できます。"},{"k":"C","t":"グローバル選択リスト","e":"正解です。グローバル選択リスト（値セット）は、一度定義した選択リストの値のセットを、複数のオブジェクト（ここでは取引先とケース）やカスタム項目で再利用できるようにする機能です。これにより、「一貫した選択リストの値を使用する」という要件が満たされます。"},{"k":"D","t":"カスタム選択リスト","e":"これはグローバルではない通常の選択リストです。これを使用すると、取引先オブジェクトとケースオブジェクトで「カテゴリ」の値を個別に定義する必要があり、値の一貫性を維持するのが難しくなります。"}],"a":["B","C"]},{"n":96,"q":"管理者が管理パッケージをインストールしたところ、それに権限セットグループが含まれていました。インストールされた権限セットグループには、いくつかのオブジェクトに対する削除アクセスが含まれており、管理者はその権限セットグループのユーザーがレコードを削除できないようにする必要があります。削除アクセスを制御するために、管理者は何をすべきですか？","o":[{"k":"A","t":"権限セットグループでミューティング権限セットを使用して、選択した権限をミュートする。","e":"正解です。ミューティング権限セットは、権限セットグループ（特に管理パッケージで提供されるもの）によって付与された特定の権限を、グループ内の他の権限セットを変更せずに無効化（ミュート）するために設計された機能です。"},{"k":"B","t
