":"オブジェクトの削除アクセスを選択解除した新しい権限セットを作成する。","e":"Salesforceの権限は加算的（積み上げ式）です。権限セットグループ内の他の権限セットが削除権限を付与している場合、削除権限が「ない」新しい権限セットを追加しても、既に付与されている権限を取り消すことはできません。"},{"k":"C","t":"ユーザーに削除権限がロールアップ（継承）されないようにする新しいロールを作成する。","e":"ロールは、主にレコードレベルのアクセス権（どのレコードが見えるか）を階層で制御するものであり、オブジェクトレベルの権限（削除できるかどうか）を制御するものではありません。"},{"k":"D","t":"ユーザーのプロファイルを編集して、オブジェクトから削除アクセスを削除する。","e":"プロファイルで削除権限を削除しても、権限セットグループがその権限を付与している場合、ユーザーはプロファイルと権限セットグループの両方の権限を（加算して）持つため、引き続き削除アクセス権を持ってしまいます。"}],"a":["A"]},{"n":97,"q":"Cloud Kicksは、[High Value Customer]（高価値顧客）チェックボックス項目がtrueに設定されている場合、最初の画面をスキップしてユーザーが2番目の画面に誘導されるように、画面フローを更新したいと考えています。管理者は決定要素をどのように設定すべきですか？","o":[{"k":"A","t":"演算子に「次の文字列と一致する」を使用し、値として {!$GlobalConstant.True} を使用する。","e":"正解です。フローの決定要素でチェックボックス項目（ブール型）の値を評価する場合、その項目が「true」であるかどうかを、グローバル定数 {!$GlobalConstant.True} と「次の文字列と一致する」（Equals）演算子を使用して比較するのが正しい方法です。"},{"k":"B","t":"演算子に「次の文字列と一致する」を使用し、値として \"High Value Customer\" を使用する。","e":"\"High Value Customer\" は文字列リテラルです。チェックボックス項目の値はtrueまたはfalse（ブール値）であるため、文字列と比較することはできません。"},{"k":"C","t":"演算子に「次の文字列を含む」を使用し、値として {!$GlobalConstant.False} を使用する。","e":"「次の文字列を含む」（Contains）演算子は、通常テキスト値の比較に使用され、ブール型の比較には適していません。また、要件は「true」の場合を評価することです。"},{"k":"D","t":"演算子に「次の文字列を含む」を使用し、値として \"High Value Customer\" を使用する。","e":"「次の文字列を含む」（Contains）演算子はブール型の比較には適しておらず、比較対象の値も（true/falseではない）文字列リテラルであるため不適切です。"}],"a":["A"]},{"n":98,"q":"Northern Trail Outfittersの営業担当は、商談の確度項目の値を変更する方法を求めています。管理者はこの要求を満たすために何を提案すべきですか？","o":[{"k":"A","t":"新しいフェーズの選択リスト値を定義する。","e":"商談のフェーズは確度と連動していますが、新しいフェーズ値を追加しても、営業担当が既存の確度項目を手動で変更できるようにはなりません。"},{"k":"B","t":"商談にカスタム項目を作成する。","e":"「確度」はSalesforceの標準項目であり、すでに存在します。新しいカスタム項目を作成することは、標準の確度項目を変更可能にする解決策にはなりません。"},{"k":"C","t":"売上予測サポートを設定する。","e":"売上予測は、商談データを使用して将来の売上を予測する機能です。これを設定しても、確度項目自体の編集可否には直接影響しません。"},{"k":"D","t":"ページレイアウトで項目を編集可能にする。","e":"正解です。ユーザーが項目値を変更できない場合、最も一般的な原因はページレイアウトでその項目が「参照のみ」に設定されていることです。管理者は、営業担当が使用するページレイアウトを編集し、「確度」項目を編集可能（「参照のみ」のチェックを外す）にする必要があります。"}],"a":["D"]},{"n":99,"q":"Northern Trail Outfittersは、各マーケティングキャンペーンでどれだけの収益が生み出されたかを計算したいと考えています。管理者はこの情報をどのように提供すべきですか？","o":[{"k":"A","t":"標準のキャンペーンレポートを設計し、「キャンペーンの値 - 商談成立」項目を追加する。","e":"レポートは、既存のデータを表示および集計するための機能です。この選択肢は、キャンペーンレコード自体で収益を「計算」し、その値を保持するメカニズムを作成する方法を説明していません。"},{"k":"B","t":"定期的なデータジョブを実行してキャンペーンレコードを更新する。","e":"これは技術的には可能ですが、リアルタイムのデータ更新ではなく、バッチ処理に依存します。積み上げ集計の機能と比較して、設定が複雑であり、標準的な解決策ではありません。"},{"k":"C","t":"キャンペーンに（商談からの）積み上げ集計項目を作成する。","e":"正解です。キャンペーン（親）レコードに関連する商談（子）レコードの金額を合計し、キャンペーン自体で総収益を「計算」するための標準的な概念が積み上げ集計です。（注：標準の商談とキャンペーンの関係は参照関係ですが、この選択肢は収益を集計する概念的なメカニズムを指しています。）"},{"k":"D","t":"キャンペーンに合計金額項目を追加し、ワークフロールールを使用して商談が成立したときに値を更新する。","e":"ワークフロールール（およびその後継のフロー）はレコードが特定の基準を満たしたときに項目を更新できますが、複数の子レコードの値を正確に「合計」する（ロールアップする）ようには設計されていません。これは集計には不完全な方法です。"}],"a":["C"]},{"n":100,"q":"Cloud Kicksのサポートエージェントは、ケースを解決するためのリソースを見つけるのに時間をかけすぎています。エージェントは、ケースのページレイアウトからドキュメントや類似のケースをより効率的に見つける方法を必要としています。管理者はこの要件をどのように満たすべきですか？","o":[{"k":"A","t":"一般的なケースの解決策を取得するためにカスタムオブジェクトを作成する。","e":"解決策を保存するためにカスタムオブジェクトを構築することは可能ですが、Salesforceにはこの目的のために特別に設計された「ナレッジ」機能が標準で備わっています。ナレッジの方が、ケースページへの統合や検索効率の点で優れています。"},{"k":"B","t":"ケースの詳細を取得するためにインタビューフローを使用する。","e":"フローは、ユーザーから情報を収集したり、プロセスをガイドしたりするためには役立ちますが、既存のドキュメントや類似のケースを検索・表示する機能ではありません。"},{"k":"C","t":"類似のケースを探すためにグローバル検索を使用するようユーザーに指示する。","e":"グローバル検索は強力な検索ツールですが、エージェントは作業中のケースのコンテキスト（ページレイアウト）から離れて手動で検索する必要があります。これは「より効率的な方法」とは言えません。"},{"k":"D","t":"記事とデータカテゴリを持つナレッジを設定する。","e":"正解です。Salesforceナレッジは、ドキュメント、FAQ、解決手順などを「記事」として保存・管理する機能です。ケースページレイアウトにナレッジコンポーネントを追加すると、エージェントは作業中のケースに関連する記事をコンテキスト内で効率的に検索・参照でき、問題解決の時間を短縮できます。 高評価して応援しよう！ 高評価 よしろう koki shimura / ばう 曽良けんた｜業務改善×Salesforce Setorisu り 南極 つか 13人 #Salesforce #Salesforce問題集 #Salesforce認定アドミニストレーター #Salesforce過去問 #Salesforce初心者 #Salesforce認定Platformアドミニストレーター タグをもっとみる 68 1 この記事が気に入ったらチップで応援してみませんか？ チップで応援"}],"a":["D"]}];
const KEY = 'sfadm100v2025-wrong';
const app = document.getElementById('app');

function loadWrong() { try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function saveWrong(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const NUM = ['', '', '2', '3', '4', '5'];

let S = { screen: 'start' };

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function start(mode) {
  let order = DATA.map((_, i) => i);
  if (mode === 'random') order = shuffle(order);
  if (mode === 'wrong') { const w = loadWrong(); order = shuffle(order.filter(i => w.includes(DATA[i].n))); }
  if (!order.length) return;
  S = { screen: 'quiz', mode, order, pos: 0, picked: [], answered: false, results: [] };
  render();
  window.scrollTo(0, 0);
}

function optsHTML(q, picked, answered) {
  return '<div class="opts">' + q.o.map(o => {
    const isAns = q.a.includes(o.k), isPick = picked.includes(o.k);
    if (!answered) {
      return `<button type="button" class="opt${isPick ? ' sel' : ''}" data-act="pick" data-k="${o.k}" aria-pressed="${isPick}">
        <span class="key">${o.k}</span><span class="txt">${esc(o.t)}</span></button>`;
    }
    const cls = isAns && isPick ? 'ok' : (!isAns && isPick ? 'ng' : (isAns ? 'miss' : ''));
    const tags = (isAns ? '<span class="tag ans">正解</span>' : '') + (isPick ? '<span class="tag you">あなたの回答</span>' : '');
    return `<div class="opt ${cls}"><span class="key">${o.k}</span>
      <span class="txt">${esc(o.t)}${tags}<span class="why">${esc(o.e)}</span></span></div>`;
  }).join('') + '</div>';
}

function renderStart() {
  const w = loadWrong();
  app.innerHTML = `
    <div class="eyebrow">PLATFORM ADMINISTRATOR 2025年11月版</div>
    <h1>アドミン<span class="num">100</span>問クイズ</h1>
    <p class="lead">1問ずつ答えると、回答のあとにすべての選択肢の解説が出ます。「2つ選択」「3つ選択」の問題も含まれます。</p>
    <div class="modes">
      <button class="mode primary" data-act="start" data-mode="seq"><b>1番から順番に解く</b><span>全100問を問題番号順に出題します</span></button>
      <button class="mode" data-act="start" data-mode="random"><b>ランダムな順番で解く</b><span>全100問をシャッフルして出題します</span></button>
      ${w.length ? `<button class="mode" data-act="start" data-mode="wrong"><b>間違えた問題だけ解く（${w.length}問）</b><span>これまでの結果から、まだ間違えたままの問題を出題します</span></button>` : ''}
    </div>
    <p class="foot">問題と解説は、note「Salesforce過去問解説おじさん」の問題集をもとに作成しています。2025年11月版の問題集です。</p>`;
}

function renderQuiz() {
  const total = S.order.length;
  const q = DATA[S.order[S.pos]];
  const need = q.a.length;
  const okCount = S.results.filter(r => r.ok).length;
  const last = S.results[S.results.length - 1];
  const ok = S.answered && last && last.ok;
  const pct = Math.round((S.pos + (S.answered ? 1 : 0)) / total * 100);
  const banner = S.answered ? `<div class="banner ${ok ? 'ok' : 'ng'}" id="banner" tabindex="-1">
      <span>${ok ? '正解です' : '不正解'}</span><small>正解は ${q.a.join('・')}</small></div>` : '';
  const bar = S.answered
    ? `<div class="bar"><button class="btn" data-act="next">${S.pos + 1 >= total ? '結果を見る' : '次の問題へ'}</button></div>`
    : `<div class="bar"><span class="count">${need > 1 ? `選択 ${S.picked.length} / ${need}` : ''}</span>
       <button class="btn" data-act="submit" ${S.picked.length === need ? '' : 'disabled'}>回答する</button></div>`;
  app.innerHTML = `
    <div class="top"><span class="mono">${S.pos + 1} / ${total}　正解 ${okCount}</span><button class="quit" data-act="home">中断してトップへ</button></div>
    <div class="track"><i style="width:${pct}%"></i></div>
    <div class="qtag"><span class="pill mono">Q${q.n}</span>${need > 1 ? `<span>${need}つ選択</span>` : '<span>1つ選択</span>'}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${banner}
    ${optsHTML(q, S.picked, S.answered)}
    ${bar}`;
}

function renderResult() {
  const total = S.results.length;
  const ok = S.results.filter(r => r.ok).length;
  const pct = Math.round(ok / total * 100);
  const wrong = S.results.filter(r => !r.ok);
  const verdict = pct >= 65 ? '本試験の合格目安（65%）を超えています。' : '本試験の合格目安は65%です。間違えた問題を見直しましょう。';
  app.innerHTML = `
    <div class="eyebrow">結果</div>
    <div class="score"><span class="big">${ok}</span><span class="of">/ ${total} 問正解（${pct}%）</span></div>
    <p class="verdict">${verdict}</p>
    <div class="chips">${S.results.map(r => `<span class="chip ${r.ok ? 'ok' : 'ng'}">${DATA[r.idx].n}</span>`).join('')}</div>
    <div class="actions">
      ${wrong.length ? '<button class="btn" data-act="start" data-mode="wrong">間違えた問題だけ、もう一度解く</button>' : ''}
      <button class="btn ghost" data-act="start" data-mode="${S.mode === 'random' ? 'random' : 'seq'}">全問をもう一度解く</button>
      <button class="btn ghost" data-act="home">トップへ戻る</button>
    </div>
    ${wrong.length ? `<h2>間違えた問題（${wrong.length}問）</h2>` + wrong.map(r => {
      const q = DATA[r.idx];
      return `<details class="rev"><summary><b>Q${q.n}</b>${esc(q.q.length > 60 ? q.q.slice(0, 60) + '…' : q.q)}</summary>
        <div class="in"><p class="qtext">${esc(q.q)}</p>${optsHTML(q, r.picked, true)}</div></details>`;
    }).join('') : ''}`;
}

function render() {
  if (S.screen === 'start') renderStart();
  else if (S.screen === 'quiz') renderQuiz();
  else renderResult();
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'start') return start(el.dataset.mode);
  if (act === 'home') { S = { screen: 'start' }; render(); window.scrollTo(0, 0); return; }
  if (S.screen !== 'quiz') return;
  const q = DATA[S.order[S.pos]];
  if (act === 'pick' && !S.answered) {
    const k = el.dataset.k;
    if (q.a.length === 1) S.picked = [k];
    else if (S.picked.includes(k)) S.picked = S.picked.filter(x => x !== k);
    else { S.picked.push(k); if (S.picked.length > q.a.length) S.picked.shift(); }
    render();
  } else if (act === 'submit' && !S.answered) {
    if (S.picked.length !== q.a.length) return;
    S.answered = true;
    S.results.push({ idx: S.order[S.pos], ok: sameSet(S.picked, q.a), picked: S.picked.slice() });
    render();
    const b = document.getElementById('banner');
    if (b) b.scrollIntoView({ block: 'center', behavior: 'smooth' });
  } else if (act === 'next' && S.answered) {
    if (S.pos + 1 >= S.order.length) {
      const w = new Set(loadWrong());
      S.results.forEach(r => { const n = DATA[r.idx].n; if (r.ok) w.delete(n); else w.add(n); });
      saveWrong([...w]);
      S.screen = 'result';
      render();
    } else {
      S.pos++; S.picked = []; S.answered = false;
      render();
    }
    window.scrollTo(0, 0);
  }
});

render();
</script>

</body></html>
