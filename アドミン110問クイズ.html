ブコンポーネントを追加しただけではユーザーの役割に基づく動的な表示制御にはなりません。動的な表示にはコンポーネントの表示条件を使用する必要があります。"}],"a":["A"]},{"n":93,"q":"Cloud Kicks (CK) は新しい営業アプリケーションを必要としています。管理者はAppExchangeにアプリケーションパッケージがあることに気付き、CKのニーズを満たすかどうかを確認するためにSandboxでのテストを開始したいと考えています。Sandboxにマネージドパッケージをインストールする際の2つの考慮事項は何ですか？2つ選択してください。","o":[{"k":"A","t":"パッケージへのメタデータの変更は、本番環境で再作成する必要があります。","e":"マネージドパッケージのコンポーネント自体はロックされており、管理者が直接メタデータを変更することはほとんどできません。また、追加で行った設定は変更セットなどで本番環境に移行できるため、必ずしも手動で再作成する必要はありません。"},{"k":"B","t":"https://www.google.com/search?q=%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%88%E3%83%BC%E3%83%AB%E3%83%AA%E3%83%B3%E3%82%AF%E3%82%92test.salesforce.comに変更する必要があります。","e":"正解です。AppExchangeからパッケージをインストールする場合、デフォルトのリンクは本番環境用になっています。Sandboxにインストールするには、https://www.google.com/search?q=URL%E3%82%92test.salesforce.comに変更してSandbox環境にルーティングする必要があります。"},{"k":"C","t":"「管理者のみのインストール」が利用可能な唯一のインストールオプションになります。","e":"Sandboxへのインストール時であっても、本番環境と同様に複数のオプション（管理者のみ、すべてのユーザー、特定のプロファイル）から選択してインストールすることが可能です。"},{"k":"D","t":"Sandboxが更新されると、パッケージは削除されます。","e":"正解です。Sandboxのリフレッシュを実行すると、本番環境の構成でSandboxが完全に上書きされるため、リフレッシュ前にSandboxのみにインストールされていたパッケージは消去されます。"}],"a":["B","D"]},{"n":94,"q":"Cloud Kicksの管理者はカスタム項目を削除しましたが、その項目をまだ使用しているビジネスユニットがあることに気付きました。項目を復元する際、管理者はどのようなことを考慮するべきでしょうか？","o":[{"k":"A","t":"項目をレポートに再追加する必要があります。","e":"削除された項目を復元すると、その項目は削除前に使用されていたレポートに自動的に復元されるため、管理者が手動で再追加する必要はありません。"},{"k":"B","t":"項目の履歴は削除されたままになります。","e":"正解です。カスタム項目を削除して復元した場合、項目のデータ自体は復元されますが、その項目に対して記録されていた項目履歴追跡のデータは完全に失われ、復元することはできません。これは管理者が必ず考慮すべき事項です。"},{"k":"C","t":"項目をごみ箱から復元する必要があります。","e":"削除されたカスタム項目はごみ箱に移動するのではなく、オブジェクトマネージャの項目と関係にある削除された項目リストから復元を行う必要があります。"},{"k":"D","t":"項目をページレイアウトに再追加する必要があります。","e":"項目を復元すると、削除前に配置されていたページレイアウト上の元の位置に自動的に復元されるため、手動でページレイアウトに再追加する必要はありません。"}],"a":["B"]},{"n":95,"q":"別のシステムからレコードをインポートして更新する際、管理者は識別子として何を使用するべきでしょうか？","o":[{"k":"A","t":"リッチテキスト項目","e":"リッチテキスト項目は画像や書式設定されたテキストを保存するためのものであり、レコードを特定するための一意の識別子として使用することはできません。"},{"k":"B","t":"レコードID","e":"レコードIDはSalesforce内で自動的に割り当てられる一意の識別子ですが、外部の別システムからデータを取り込んで照合や更新を行う際のキーとしては使用できません。外部システムのIDを持たせる必要があります。"},{"k":"C","t":"自動採番項目","e":"自動採番項目はレコード作成時にSalesforce内で連番を自動的に割り当てるものであり、外部システムの既存のレコードと一意に照合するための識別子としては機能しません。"},{"k":"D","t":"外部ID","e":"正解です。外部IDは、Salesforce外のシステムで使用されている一意の識別子を保存するためのカスタム項目属性です。データインポート時にこの外部IDをキーとして使用することで、外部システムのレコードとSalesforceのレコードを正確に紐づけ、効率的に更新や挿入を行うことができます。"}],"a":["D"]},{"n":96,"q":"Northern Trail Outfittersは、Salesforceから外部の人事システムへの経費レポートを開始したいと考えています。このプロセスはマネージャーとディレクターによる確認が必要です。管理者はどの2つのツールを設定するべきでしょうか？2つ選択してください。","o":[{"k":"A","t":"クイックアクション","e":"正解です。クイックアクションを使用することで、ユーザーがSalesforce上でレコードから直接、経費レポートの作成やプロセスの開始をすばやく実行できるインターフェースを提供できます。"},{"k":"B","t":"アウトバウンドメッセージ","e":"アウトバウンドメッセージはSalesforceから外部システムへデータを送信するために使用されますが、マネージャーやディレクターによる段階的な確認プロセスをシステム内で構築する機能ではありません。"},{"k":"C","t":"承認プロセス","e":"正解です。承認プロセスを使用することで、マネージャーやディレクターなどの承認者にレコードの確認と承認を要求する、構造化されたルーティングのワークフローを自動化して構築できます。"},{"k":"D","t":"メールアラートアクション","e":"メールアラートアクションは指定された受信者にメール通知を送信する機能であり、レコードの送信やマネージャーによる承認のステップ自体を制御および管理するツールではありません。"}],"a":["A","C"]},{"n":97,"q":"Cloud Kicksの管理者は、取引先責任者を作成する画面フローをデバッグしようとしています。フロー内の変数の1つがデバッグ画面に表示されません。この問題の原因として何が考えられますか？","o":[{"k":"A","t":"入力可能のチェックボックスがオフになっていた。","e":"正解です。フローのデバッグ時に変数の初期値を設定したり、外部から値を受け取ったりするには、変数の設定で入力可能チェックボックスがオンになっている必要があります。これがオフの場合、デバッグ画面の入力項目として表示されません。"},{"k":"B","t":"フローが非アクティブなバージョンである。","e":"フローが非アクティブなバージョンであっても、フロービルダーキャンバスから直接デバッグを実行することは可能です。したがって、デバッグ画面に変数が表示されない原因にはなりません。"},{"k":"C","t":"項目型がデバッグでサポートされていない。","e":"フローデバッグツールは、フローで使用される標準的な変数のデータ型をサポートしています。項目型が原因でデバッグ画面に変数が表示されないということは基本的にありません。"},{"k":"D","t":"出力可能のチェックボックスがオフになっていた。","e":"出力可能のチェックボックスは、フローが終了した後にその変数の値を他のプロセスや親フローに渡すために使用されます。デバッグ開始時の入力画面に変数が表示されないことの原因ではありません。"}],"a":["A"]},{"n":98,"q":"管理者は、子レコードへのアクセスが制限された、2つのオブジェクト間の1対多の関係を作成する必要があります。管理者はどのタイプの項目を使用するべきですか？","o":[{"k":"A","t":"積み上げ集計項目","e":"積み上げ集計項目は、主従関係にある子レコードの数値を計算して親レコードに表示するための項目であり、オブジェクト間の関係そのものを作成するための機能ではありません。"},{"k":"B","t":"主従関係項目","e":"主従関係項目は1対多の関係を作成しますが、親レコードのアクセス権が子レコードに強制的に引き継がれます。そのため、親レコードへのアクセス権を持ちながら子レコードへのアクセスを制限するという要件には適していません。"},{"k":"C","t":"クロスオブジェクト数式","e":"クロスオブジェクト数式は、関連する親オブジェクトの項目値を参照して表示するための項目であり、オブジェクト間に新しい関係を構築するものではありません。"},{"k":"D","t":"参照項目","e":"正解です。参照項目は2つのオブジェクト間に1対多の関係を作成します。主従関係とは異なり、親と子は独立しているため、子レコードに独自の共有設定を適用してアクセスを制限することができます。"}],"a":["D"]},{"n":99,"q":"Universal Containersには、3つの独立した事業部門があります。各部門には、ユーザーに表示する必要がある特定の項目があります。ただし、営業チームが必要とする項目は、サービスチームが必要とする項目とは異なります。管理者はこの要件をどのように設定するべきですか？","o":[{"k":"A","t":"2つのレコードタイプを作成し、それぞれに3つのページレイアウトを設定する。","e":"レコードタイプはビジネスプロセスや要件が異なる事業部門（今回は3つ）に基づいて作成する必要があるため、2つのレコードタイプではすべての部門の要件をカバーすることができません。"},{"k":"B","t":"1つのレコードタイプを作成し、6つのページレイアウトを設定する。","e":"3つの異なる事業部門があるため、それぞれの業務プロセスや選択リスト値を区別するために、1つではなく3つのレコードタイプを作成する必要があります。"},{"k":"C","t":"3つのレコードタイプを作成し、それぞれに2つのページレイアウトを設定する。","e":"正解です。3つの事業部門それぞれに対して個別のレコードタイプを作成します（計3つ）。そして、各レコードタイプに対して、営業チーム用とサービスチーム用の2つの異なるページレイアウトを作成し、それぞれのユーザープロファイルに割り当てることで、適切な項目を表示するという要件を満たすことができます。"},{"k":"D","t":"6つのレコードタイプを作成し、それぞれに1つのページレイアウトを設定する。","e":"レコードタイプは事業部門の数（3つ）に合わせて作成すべきです。チーム間（営業とサービス）での表示項目の違いを管理するためにレコードタイプを増やす必要はなく、画面表示の制御にはページレイアウトを使用するのが適切です。"}],"a":["C"]},{"n":100,"q":"Northern Trail Outfittersはケースオブジェクトを非公開に設定しています。サポートマネージャーは、担当者が想定よりも広い範囲のデータビューを持っており、グループのダッシュボードですべてのケースを見ることができるという懸念を提起しました。担当者がダッシュボード上のデータに不適切なアクセス権を持つ原因として考えられるものは何ですか？","o":[{"k":"A","t":"ダッシュボード検索条件","e":"ダッシュボード検索条件は、ダッシュボード上に表示されるデータをユーザーが絞り込むための機能です。この機能によってユーザーの基盤となるデータアクセス権限が拡大されることはないため、他のユーザーの非公開レコードが見える原因にはなりません。"},{"k":"B","t":"ダッシュボードの登録","e":"ダッシュボードの登録は、スケジュールに従ってダッシュボードを自動更新し、その結果をメールで送信する機能です。この設定自体がSalesforce組織内でのダッシュボード閲覧時のデータアクセス権を不適切に広げる直接の原因ではありません。"},{"k":"C","t":"動的ダッシュボード","e":"正解です。動的ダッシュボードを使用すると、ダッシュボードの実行ユーザーとして指定された特定のユーザー（すべてのケースデータにアクセスできるマネージャーなど）の権限でデータが表示されるように設定されている可能性があります。そのため、本来はアクセス権のないレコードのデータであっても、担当者のダッシュボード上に表示されてしまう原因となります。"},{"k":"D","t":"公開ダッシュボード","e":"ダッシュボードが公開フォルダーに保存されている場合、対象ユーザーはそのダッシュボード自体にはアクセスできますが、表示されるデータは依然として設定された実行ユーザーのアクセス権限に依存します。公開ダッシュボードにアクセスできるという事実自体が、レコードへのデータアクセス権を不適切に広げているわけではありません。 Salesforce認定Platformアドミニストレーター試験のセクション「Agentforce」に対応した問題を作成しました。 Agentforceは、従来のEinstein Copilotから進化した自律型AIエージェントのプラットフォームです。試験では、基本的な設定方法、トピックとアクションの役割、およびセキュリティ（Einstein Trust Layer）に関する知識が問われます。"}],"a":["C"]},{"n":101,"q":"Ursa Major Solarの管理者は、ユーザーがSalesforce組織内で自律型AIエージェントを使用して、自然言語でデータをクエリしたりタスクを実行したりできるようにしたいと考えています。この機能を有効にするための最初のステップは何ですか？","o":[{"k":"A","t":"ユーザーに「Agentforceコンソール」権限セットを割り当てる","e":"権限の割り当ては必要ですが、機能そのものを有効化する前に行う手順ではありません。"},{"k":"B","t":"[設定] の [Agentforce設定] で「Agentforce」を有効にする","e":"正解です。 Agentforceを利用するには、まずシステム管理者が [設定] 画面から機能をグローバルに有効化する必要があります。"},{"k":"C","t":"App Builderで「Einstein Copilot」コンポーネントを配置する","e":"Agentforceは従来のEinstein Copilotの後継ですが、まずは設定での有効化が先決です。"},{"k":"D","t":"プロンプトビルダーで新しいテンプレートを作成する","e":"プロンプトビルダーはアクションの構成要素ですが、Agentforce全体の有効化手順とは異なります。"}],"a":["B"]},{"n":102,"q":"管理者は、Agentforceエージェントが特定のビジネスプロセス（例：ケースのクローズや注文状況の確認）を実行できるように設定する必要があります。エージェントがどのような指示に従い、どのアクションを実行するかを決定するための「命令のグループ」を何と呼びますか？","o":[{"k":"A","t":"エージェント・プロトコル","e":"Salesforceの標準用語ではありません。"},{"k":"B","t":"プロンプト・テンプレート","e":"特定の応答を生成するための指示ですが、エージェントの自律的な判断ロジックを構成する単位ではありません。"},{"k":"C","t":"トピック","e":"正解です。 Agentforceにおける「トピック（Topic）」は、エージェントが特定の意図（インテント）を理解し、関連するアクションを実行するための指示とガードレールのグループです。"},{"k":"D","t":"スキル・セット","e":"以前のEinstein Botなどで使われていた概念に近いですが、Agentforceでは「トピック」と「アクション」という用語が中心となります。"}],"a":["C"]},{"n":103,"q":"管理者は、Agentforceが顧客の機密データを外部のLLM（大規模言語モデル）に送信する際に、データが保護され、モデルの学習に使用されないことを確認したいと考えています。Salesforceのどの機能がこのデータプライバシーを保証しますか？","o":[{"k":"A","t":"Shield Platform Encryption","e":"保存データの暗号化機能であり、LLMとの通信時におけるリアルタイムのデータ保護やマスキングを専門とするものではありません。"},{"k":"B","t":"Einstein Trust Layer","e":"正解です。 これはデータマスキング、有害コンテンツの検出、および「データ保持ゼロ（Zero Retention）」ポリシーを通じて、生成AI利用時の安全性を確保するSalesforceの標準アーキテクチャです。"},{"k":"C","t":"データの匿名化サービス","e":"一般的な用語ですが、Salesforceの特定の機能名ではありません。"},{"k":"D","t":"セキュア・コネクタ","e":"外部システムとの接続を指しますが、AIの信頼性担保に特化したフレームワークではありません。"}],"a":["B"]},{"n":104,"q":"管理者は、Agentforceエージェントに特定レコードの更新を行わせるために「フロー（Flow）」をアクションとして追加しました。エージェントがこのフローを正しく呼び出すために、フロー側で設定すべき必須項目は何ですか？","o":[{"k":"A","t":"フローを「テンプレート」としてマークする","e":"必須ではありません。"},{"k":"B","t":"フローのAPI参照名を「Agent_」で始める","e":"命名規則は自由であり、動作に影響しません。"},{"k":"C","t":"フローの要素として「AIポーズ」を追加する","e":"そのような要素は必須ではありません。"},{"k":"D","t":"説明（Description）フィールドにエージェントが理解できる詳細な指示を記入する","e":"正解です。 Agentforceの推論エンジンは、フローの「説明」を読み取って、そのフローが「いつ」「何のために」使われるべきかを判断します。これが不適切だと、エージェントはアクションを正しく選択できません。"}],"a":["D"]},{"n":105,"q":"管理者は、本番環境にAgentforceをデプロイする前に、エージェントがユーザーの入力に対して期待通りのトピックを選択し、正しいアクションを実行するかを確認したいと考えています。どのツールを使用すべきですか？","o":[{"k":"A","t":"エージェント・デバッガー","e":"似た名称ですが、正しくは「Agentforceビルダー（旧Einstein Copilot ビルダー）」内の「キャンバス」を使用します。"},{"k":"B","t":"Agentforce キャンバス","e":"正解です。 Agentforceビルダーのプレビュー（キャンバス）画面では、エージェントと対話し、背後でどのトピックが選択され、どのロジックが実行されたかをリアルタイムで確認（プランニングの可視化）できます。"},{"k":"C","t":"プロンプト・シミュレーター","e":"プロンプトビルダーで使用されるツールであり、エージェント全体の挙動確認用ではありません。"},{"k":"D","t":"イベント・モニタリング","e":"実行後のログ確認には役立ちますが、設定中のテストツールとしてはキャンバスが適切です。"}],"a":["B"]},{"n":106,"q":"管理者は、Agentforceを自社のExperience Cloudサイト（外部サイト）に配置し、顧客が注文ステータスを自己解決できるようにしたいと考えています。Agentforceをサイト上で利用可能にするために使用する設定項目はどれですか？","o":[{"k":"A","t":"ページレイアウトの「エージェント・パレット」","e":"ページレイアウトは標準画面の構成を管理するもので、外部サイトへのチャネル展開には使用しません。"},{"k":"B","t":"エクスペリエンスビルダーの「組み込みサービスチャット」コンポーネント","e":"正解です。 AgentforceをExperience Cloudで公開する場合、組み込みサービス（Embedded Service）の設定を行い、エクスペリエンスビルダーでコンポーネントを配置してデプロイします。"},{"k":"C","t":"キャンバスアプリの「Agentforce連携」","e":"キャンバスアプリは外部システムをSalesforce内に埋め込むためのもので、Agentforceの展開方法としては不適切です。"},{"k":"D","t":"サイト設定の「公開アクセス設定」","e":"公開アクセスの許可は必要ですが、これだけではチャットインターフェースは提供されません。"}],"a":["B"]},{"n":107,"q":"Agentforceエージェントがユーザーの要求に対して回答を生成する際、Salesforce内のレコードへのアクセス権はどのように決定されますか？","o":[{"k":"A","t":"エージェントには常に「すべてのデータの参照」権限が与えられる","e":"セキュリティ上のリスクがあるため、このような仕様にはなっていません。"},{"k":"B","t":"管理者が「エージェント・システムユーザー」に付与した権限に基づく","e":"Agentforceはシステムコンテキストではなく、現在のユーザーの権限を尊重します。"},{"k":"C","t":"エージェントを使用している「実行ユーザー」の権限に基づく","e":"正解です。 Agentforceはユーザーの権限（共有ルールやプロファイル、権限セット）を遵守するため、ユーザーが通常アクセスできないデータはエージェントも取得・操作できません。"},{"k":"D","t":"プロンプトテンプレートで定義された「データセット」に限定される","e":"プロンプトテンプレートは入力を定義しますが、最終的なデータアクセス権限はユーザーのセキュリティ設定に従います。"}],"a":["C"]},{"n":108,"q":"管理者は、Agentforceがユーザーの質問に対して「どのトピックを選択すべきか」を判断する推論プロセスを確認したいと考えています。Agentforceビルダーにおいて、AIがプランを立て、実行したステップをログ形式で表示する機能は何ですか？","o":[{"k":"A","t":"実行ログ","e":"Salesforce全体のシステムログとは異なります。"},{"k":"B","t":"プランニング・履歴","e":"概念としては近いですが、標準的な機能名ではありません。"},{"k":"C","t":"インタラクション・パネル（推論の表示）","e":"正解です。 Agentforceビルダーのテスト画面では、AIがどのように質問を解釈し、どのトピックを選択してプランを作成したかという「思考プロセス」をリアルタイムで確認できます。"},{"k":"D","t":"デバッグ・コンソール","e":"開発者コンソールの一部であり、Agentforceの推論確認用ではありません。"}],"a":["C"]},{"n":109,"q":"Einstein Trust Layerの機能の一つで、外部LLMに送信される前にメールアドレスや電話番号などの個人情報を隠し、安全性を高める仕組みはどれですか？","o":[{"k":"A","t":"セキュア・ゲートウェイ","e":"通信の安全性を指す一般的な用語です。"},{"k":"B","t":"データのマスキング","e":"正解です。 Einstein Trust Layerは、プロンプトに含まれる個人識別情報（PII）を動的に検出し、送信前にマスク（置換）することで、機密データがSalesforceの外に出るのを防ぎます。"},{"k":"C","t":"毒性検知（Toxicity Detection）","e":"不適切な内容や有害な回答が生成されるのを防ぐ機能です。"},{"k":"D","t":"ゼロ・リテンション","e":"外部LLMプロバイダがデータを保存・学習に使用しないことを保証する規約のことです。"}],"a":["B"]},{"n":110,"q":"管理者がAgentforceにカスタムアクションを追加したいと考えています。既存の「プロンプトテンプレート」をアクションとして呼び出すために必要な設定はどれですか？","o":[{"k":"A","t":"プロンプトテンプレートを「有効化」する","e":"有効化は必要ですが、それだけではエージェントから呼び出せるようにはなりません。"},{"k":"B","t":"プロンプトテンプレートの種別を「エージェントアクション」にする","e":"正解です。 プロンプトビルダーで作成する際、または作成後に、そのテンプレートをエージェントのアクションとして使用できるように設定する必要があります。"},{"k":"C","t":"フロー内でプロンプトを呼び出し、そのフローをアクションに指定する","e":"フロー経由でも可能ですが、プロンプトテンプレートを直接アクションとして設定するのが最も効率的です。"},{"k":"D","t":"プロンプトテンプレートのAPI参照名を「Agent_Prompt」にする","e":"命名規則による制約はありません。 高評価して応援しよう！ 高評価 さとるん | 元市民大学運営 昔SE 今マーケに興味 Ryo Seki koshian NJ みや 深雪 minari 16人 #Salesforce #Salesforce問題集 #Salesforce過去問 #Salesforce認定Platformアドミニストレーター 86 10 この記事が気に入ったらチップで応援してみませんか？ チップで応援"}],"a":["B"]}];
const KEY = 'sfadm110-wrong';
const app = document.getElementById('app');

function loadWrong() { try { const v = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function saveWrong(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const NUM = ['', '', '2', '3', '4', '5'];

let S = { screen: 'start' };

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function start(mode) {
  let order = DATA.map((_, i) => i);
  if (mode === 'random') order = shuffle(order);
  if (mode === 'wrong') { const w = loadWrong(); order = shuffle(order.filter(i => w.includes(DATA[i].n))); }
  if (!order.length) return;
  S = { screen: 'quiz', mode, order, pos: 0, picked: [], answered: false, results: [] };
  render();
  window.scrollTo(0, 0);
}

function optsHTML(q, picked, answered) {
  return '<div class="opts">' + q.o.map(o => {
    const isAns = q.a.includes(o.k), isPick = picked.includes(o.k);
    if (!answered) {
      return `<button type="button" class="opt${isPick ? ' sel' : ''}" data-act="pick" data-k="${o.k}" aria-pressed="${isPick}">
        <span class="key">${o.k}</span><span class="txt">${esc(o.t)}</span></button>`;
    }
    const cls = isAns && isPick ? 'ok' : (!isAns && isPick ? 'ng' : (isAns ? 'miss' : ''));
    const tags = (isAns ? '<span class="tag ans">正解</span>' : '') + (isPick ? '<span class="tag you">あなたの回答</span>' : '');
    return `<div class="opt ${cls}"><span class="key">${o.k}</span>
      <span class="txt">${esc(o.t)}${tags}<span class="why">${esc(o.e)}</span></span></div>`;
  }).join('') + '</div>';
}

function renderStart() {
  const w = loadWrong();
  app.innerHTML = `
    <div class="eyebrow">PLATFORM ADMINISTRATOR 2026年版（Agentforce対応）</div>
    <h1>アドミン<span class="num">110</span>問クイズ</h1>
    <p class="lead">1問ずつ答えると、回答のあとにすべての選択肢の解説が出ます。「2つ選択」「3つ選択」の問題も含まれます。</p>
    <div class="modes">
      <button class="mode primary" data-act="start" data-mode="seq"><b>1番から順番に解く</b><span>全110問を問題番号順に出題します</span></button>
      <button class="mode" data-act="start" data-mode="random"><b>ランダムな順番で解く</b><span>全110問をシャッフルして出題します</span></button>
      ${w.length ? `<button class="mode" data-act="start" data-mode="wrong"><b>間違えた問題だけ解く（${w.length}問）</b><span>これまでの結果から、まだ間違えたままの問題を出題します</span></button>` : ''}
    </div>
    <p class="foot">問題と解説は、note「Salesforce過去問解説おじさん」の問題集をもとに作成しています。Agentforceの新セクションを含む改訂版に対応しています。</p>`;
}

function renderQuiz() {
  const total = S.order.length;
  const q = DATA[S.order[S.pos]];
  const need = q.a.length;
  const okCount = S.results.filter(r => r.ok).length;
  const last = S.results[S.results.length - 1];
  const ok = S.answered && last && last.ok;
  const pct = Math.round((S.pos + (S.answered ? 1 : 0)) / total * 100);
  const banner = S.answered ? `<div class="banner ${ok ? 'ok' : 'ng'}" id="banner" tabindex="-1">
      <span>${ok ? '正解です' : '不正解'}</span><small>正解は ${q.a.join('・')}</small></div>` : '';
  const bar = S.answered
    ? `<div class="bar"><button class="btn" data-act="next">${S.pos + 1 >= total ? '結果を見る' : '次の問題へ'}</button></div>`
    : `<div class="bar"><span class="count">${need > 1 ? `選択 ${S.picked.length} / ${need}` : ''}</span>
       <button class="btn" data-act="submit" ${S.picked.length === need ? '' : 'disabled'}>回答する</button></div>`;
  app.innerHTML = `
    <div class="top"><span class="mono">${S.pos + 1} / ${total}　正解 ${okCount}</span><button class="quit" data-act="home">中断してトップへ</button></div>
    <div class="track"><i style="width:${pct}%"></i></div>
    <div class="qtag"><span class="pill mono">Q${q.n}</span>${need > 1 ? `<span>${need}つ選択</span>` : '<span>1つ選択</span>'}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${banner}
    ${optsHTML(q, S.picked, S.answered)}
    ${bar}`;
}

function renderResult() {
  const total = S.results.length;
  const ok = S.results.filter(r => r.ok).length;
  const pct = Math.round(ok / total * 100);
  const wrong = S.results.filter(r => !r.ok);
  const verdict = pct >= 65 ? '本試験の合格目安（65%）を超えています。' : '本試験の合格目安は65%です。間違えた問題を見直しましょう。';
  app.innerHTML = `
    <div class="eyebrow">結果</div>
    <div class="score"><span class="big">${ok}</span><span class="of">/ ${total} 問正解（${pct}%）</span></div>
    <p class="verdict">${verdict}</p>
    <div class="chips">${S.results.map(r => `<span class="chip ${r.ok ? 'ok' : 'ng'}">${DATA[r.idx].n}</span>`).join('')}</div>
    <div class="actions">
      ${wrong.length ? '<button class="btn" data-act="start" data-mode="wrong">間違えた問題だけ、もう一度解く</button>' : ''}
      <button class="btn ghost" data-act="start" data-mode="${S.mode === 'random' ? 'random' : 'seq'}">全問をもう一度解く</button>
      <button class="btn ghost" data-act="home">トップへ戻る</button>
    </div>
    ${wrong.length ? `<h2>間違えた問題（${wrong.length}問）</h2>` + wrong.map(r => {
      const q = DATA[r.idx];
      return `<details class="rev"><summary><b>Q${q.n}</b>${esc(q.q.length > 60 ? q.q.slice(0, 60) + '…' : q.q)}</summary>
        <div class="in"><p class="qtext">${esc(q.q)}</p>${optsHTML(q, r.picked, true)}</div></details>`;
    }).join('') : ''}`;
}

function render() {
  if (S.screen === 'start') renderStart();
  else if (S.screen === 'quiz') renderQuiz();
  else renderResult();
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'start') return start(el.dataset.mode);
  if (act === 'home') { S = { screen: 'start' }; render(); window.scrollTo(0, 0); return; }
  if (S.screen !== 'quiz') return;
  const q = DATA[S.order[S.pos]];
  if (act === 'pick' && !S.answered) {
    const k = el.dataset.k;
    if (q.a.length === 1) S.picked = [k];
    else if (S.picked.includes(k)) S.picked = S.picked.filter(x => x !== k);
    else { S.picked.push(k); if (S.picked.length > q.a.length) S.picked.shift(); }
    render();
  } else if (act === 'submit' && !S.answered) {
    if (S.picked.length !== q.a.length) return;
    S.answered = true;
    S.results.push({ idx: S.order[S.pos], ok: sameSet(S.picked, q.a), picked: S.picked.slice() });
    render();
    const b = document.getElementById('banner');
    if (b) b.scrollIntoView({ block: 'center', behavior: 'smooth' });
  } else if (act === 'next' && S.answered) {
    if (S.pos + 1 >= S.order.length) {
      const w = new Set(loadWrong());
      S.results.forEach(r => { const n = DATA[r.idx].n; if (r.ok) w.delete(n); else w.add(n); });
      saveWrong([...w]);
      S.screen = 'result';
      render();
    } else {
      S.pos++; S.picked = []; S.answered = false;
      render();
    }
    window.scrollTo(0, 0);
  }
});

render();
</script>

</body></html>
