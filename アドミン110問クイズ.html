<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>アドミン110問クイズ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  /* レイアウト: 一問一画面の縦長カラム。選択肢が主役で、回答後に各選択肢の下へ解説が開く */
  :root {
    --bg: #F1F5F7;
    --surface: #FFFFFF;
    --fg: #15232C;
    --muted: #586A75;
    --line: #D3DDE3;
    --accent: #0B67A3;
    --accent-fg: #FFFFFF;
    --sel-bg: #E4F0F8;
    --ok: #17794A;
    --ok-bg: #E3F4EA;
    --ng: #B0321E;
    --ng-bg: #FBE8E3;
    --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1920;
      --surface: #16252E;
      --fg: #E5EDF1;
      --muted: #94A6B0;
      --line: #2A3D48;
      --accent: #5DB3EA;
      --accent-fg: #0A1A24;
      --sel-bg: #173648;
      --ok: #5FCB94;
      --ok-bg: #12322A;
      --ng: #FF8F78;
      --ng-bg: #3B201B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1920;
    --surface: #16252E;
    --fg: #E5EDF1;
    --muted: #94A6B0;
    --line: #2A3D48;
    --accent: #5DB3EA;
    --accent-fg: #0A1A24;
    --sel-bg: #173648;
    --ok: #5FCB94;
    --ok-bg: #12322A;
    --ng: #FF8F78;
    --ng-bg: #3B201B;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.75;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---- スタート ---- */
  .eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
  h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.3; margin: 8px 0 12px; font-weight: 700; text-wrap: balance; }
  h1 .num { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
  .lead { color: var(--muted); margin: 0 0 28px; max-width: 34em; }
  .modes { display: grid; gap: 10px; }
  .mode {
    display: grid; gap: 2px; text-align: left; width: 100%;
    padding: 14px 16px; border-radius: 10px;
    background: var(--surface); border: 1.5px solid var(--line);
  }
  .mode:hover { border-color: var(--accent); }
  .mode b { font-size: 16px; }
  .mode span { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .mode.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .mode.primary span { color: inherit; opacity: .85; }
  .foot { margin-top: 36px; font-size: 12px; color: var(--muted); line-height: 1.7; }

  /* ---- 出題 ---- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
  .top .quit { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }
  .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 22px; }
  .track i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
  .qtag { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .qtag .pill { padding: 1px 8px; border-radius: 999px; background: var(--sel-bg); color: var(--accent); font-weight: 700; }
  .qtext { font-size: 17px; font-weight: 500; line-height: 1.8; margin: 0 0 18px; text-wrap: pretty; }

  .banner { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 12px 16px; border-radius: 10px; margin-bottom: 14px; font-weight: 700; scroll-margin-top: 12px; }
  .banner small { font-weight: 500; font-size: 14px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }
  .banner.ng { background: var(--ng-bg); color: var(--ng); }

  .opts { display: grid; gap: 10px; }
  .opt {
    display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start;
    width: 100%; text-align: left; padding: 12px 14px;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  }
  button.opt:hover { border-color: var(--accent); }
  .opt .key {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--font-mono); font-weight: 600; font-size: 14px;
    border: 1.5px solid var(--line); color: var(--muted);
  }
  .opt .txt { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
  .opt.sel { border-color: var(--accent); background: var(--sel-bg); }
  .opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.ok .key { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .opt.ng { border-color: var(--ng); background: var(--ng-bg); }
  .opt.ng .key { background: var(--ng); border-color: var(--ng); color: var(--surface); }
  .opt.miss { border: 1.5px dashed var(--ok); }
  .opt.miss .key { border-color: var(--ok); color: var(--ok); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 4px; margin-left: 8px; line-height: 1.7; vertical-align: 2px; }
  .tag.ans { background: var(--ok); color: var(--surface); }
  .tag.you { background: var(--fg); color: var(--bg); }
  .why { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px dotted var(--line); font-size: 14px; line-height: 1.8; color: var(--muted); }
  .opt.ok .why, .opt.ng .why { color: var(--fg); }

  .bar {
    position: sticky; bottom: 0; margin-top: 18px;
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--bg); border-top: 1px solid var(--line);
    display: flex; gap: 12px; align-items: center; justify-content: flex-end;
  }
  .bar .count { margin-right: auto; font-size: 13px; color: var(--muted); }
  .btn { padding: 11px 22px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 700; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--accent); }

  /* ---- 結果 ---- */
  .score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 6px 0 4px; }
  .score .big { font-family: var(--font-mono); font-weight: 600; font-size: clamp(52px, 14vw, 84px); line-height: 1; color: var(--accent); }
  .score .of { font-size: 18px; color: var(--muted); }
  .verdict { color: var(--muted); margin: 0 0 22px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; margin: 0 0 24px; }
  .chip { height: 32px; display: grid; place-items: center; border-radius: 6px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
  .chip.ng { background: var(--ng-bg); color: var(--ng); border: 1px solid var(--ng); }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  .actions { display: grid; gap: 10px; margin-top: 8px; }
  details.rev { border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 10px; }
  details.rev summary { cursor: pointer; padding: 12px 14px; font-size: 14px; line-height: 1.7; list-style-position: inside; }
  details.rev summary b { font-family: var(--font-mono); color: var(--ng); margin-right: 6px; }
  details.rev .in { padding: 0 14px 14px; }
  details.rev .qtext { font-size: 15px; }

  @media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>

<div class="wrap" id="app"></div>

<script>
const DATA = [{"n":1,"q":"Cloud Kicksのマーケティングチームは、製品への関心を引くためにキャンペーンを使用しています。彼らは実行する各キャンペーンのキャンペーンメンバーのステータス項目にカスタム選択リスト値を求めていますが、現在は管理者に値の追加や削除を依頼しており、非常に時間がかかっています。マーケティングチームがキャンペーンメンバーのステータス選択リスト値を自分でカスタマイズできるようにするには、どの2つのユーザー権限が必要ですか？ 2つ選択してください。","o":[{"k":"A","t":"キャンペーンメンバーの作成および編集","e":"この権限はキャンペーンメンバーレコード自体のデータを作成および編集するためのものであり、キャンペーンメンバーステータスの選択リスト値を設定やカスタマイズする権限は含まれていません。"},{"k":"B","t":"マーケティングユーザー機能ライセンス","e":"正解です。ユーザー詳細画面でマーケティングユーザー機能ライセンスを割り当てる(マーケティングユーザーチェックボックスをオンにする)ことで、キャンペーンの作成、編集、削除、および高度なキャンペーン設定(キャンペーンメンバーステータスの値のカスタマイズなど)を行う権限が付与されます。"},{"k":"C","t":"アプリケーションのカスタマイズ権限","e":"この権限はシステム全体のカスタマイズを許可する強力な管理者権限です。キャンペーンのステータス値を変更するためだけにマーケティングチームの一般ユーザーへ付与するべきではありません。"},{"k":"D","t":"キャンペーンの編集権限","e":"正解です。キャンペーンメンバーステータスの値を自分でカスタマイズするには、マーケティングユーザー機能ライセンスを持っていることに加えて、その対象となるキャンペーンレコード自体に対する編集権限を持っている必要があります。"}],"a":["B","D"]},{"n":2,"q":"Ursa Majorの新しい営業担当者に、対話の準備が整った評価済みのリードがあります。リードの取引開始プロセスを使用する際、作成できる2つのレコードはどれですか？ 2つ選択してください。","o":[{"k":"A","t":"取引先","e":"正解です。リードの取引開始プロセスを実行すると、Salesforceはリードに入力されている会社情報に基づいて、新しい取引先レコードを作成するか、既存の取引先レコードにマージすることができます。"},{"k":"B","t":"キャンペーン","e":"キャンペーンはマーケティング活動を管理するためのオブジェクトであり、リードの取引開始プロセス中に自動的に作成されることはありません。"},{"k":"C","t":"ケース","e":"ケースは顧客からの問い合わせやサポートの要求を管理するためのオブジェクトであり、リードの取引開始によって作成されるレコードではありません。取引開始時に作成できるのは、取引先、取引先責任者、および商談です。"},{"k":"D","t":"取引先責任者","e":"正解です。リードの取引開始プロセスを実行すると、Salesforceはリードに入力されている個人情報に基づいて、新しい取引先責任者レコードを作成するか、既存の取引先責任者レコードにマージすることができます。"}],"a":["A","D"]},{"n":3,"q":"Ursa Major Solarのコールセンターマネージャーは、ケースの発生源、ステータス、所有者別にドリルダウンできるケースダッシュボードをエージェントに提供したいと考えています。この要望を満たすために、管理者はダッシュボードに何を追加するべきですか？","o":[{"k":"A","t":"ダッシュボード検索条件","e":"正解です。ダッシュボード検索条件を使用すると、ユーザーは1つのダッシュボード上で、ケースの発生源、ステータス、所有者などの指定した条件に基づいてデータを動的に絞り込み、異なる視点から分析することができます。"},{"k":"B","t":"バケット列","e":"バケット列は、レポート上でカスタムの数式や新しい項目を作成せずに、複数の値を1つのカテゴリに素早くグループ化するための機能です。ダッシュボード全体のデータを絞り込むための機能ではありません。"},{"k":"C","t":"ダッシュボードコンポーネント","e":"ダッシュボードコンポーネントは、基となるレポートのデータをグラフや表などの視覚的な形式で表示するための構成要素です。コンポーネントを追加するだけでは、ユーザーが動的にデータを絞り込む機能は提供されません。"},{"k":"D","t":"複合グラフ","e":"複合グラフは、棒グラフと折れ線グラフなどを組み合わせて、1つのグラフ上で複数のデータセットを比較するためのダッシュボードコンポーネントの表示形式です。データをドリルダウンするための検索条件を提供するものではありません。"}],"a":["A"]},{"n":4,"q":"Northern Trail Outfittersのマーケティングディレクターは、リードステータス項目を評価済みとしてマークするために、予算項目に入力することを求めています。管理者はこの要請を満たすためにどのツールを使用するべきですか？","o":[{"k":"A","t":"リードの取引開始","e":"リードの取引開始は、リードを取引先、取引先責任者、および必要に応じて商談のレコードに変換するプロセスです。特定のステータスに基づいて項目の入力を強制する機能ではありません。"},{"k":"B","t":"必須項目","e":"ページレイアウトや項目レベルで必須項目に設定すると、レコードを保存する際に常にその項目への入力が求められます。今回のように特定のリードステータスの時だけ入力を必須にするという条件付きの要件は満たすことができません。"},{"k":"C","t":"ワークフロールール","e":"ワークフロールールは、特定の条件を満たしたときにメールアラートやToDoの作成などの自動化アクションを実行するための機能です。ユーザーが特定の条件を満たさないデータを保存するのをブロックすることはできません。"},{"k":"D","t":"入力規則","e":"正解です。入力規則を使用すると、ユーザーがレコードを保存する前にデータが特定の条件を満たしているかを検証できます。リードステータスが評価済みに変更されたときに予算項目が空白である場合、エラーを表示して保存をブロックするように設定できるため、今回の要件を満たす最適なツールです。"}],"a":["D"]},{"n":5,"q":"cloud kicksの管理者は、ユーザーがsalesforceで繰り返しToDoを追加できないと報告を受けました。ユーザーがこれを行えるようにするために、管理者が使用すべき2つの解決策はどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"活動設定で「定期的なToDoの作成を有効化」を有効にする","e":"正解です。ユーザーが繰り返しのToDoを作成できるようにするには、まず活動設定で定期的なToDoの作成機能を有効にする必要があります。これにより組織全体で機能が利用可能になります。"},{"k":"B","t":"共有活動を無効にする","e":"共有活動は、1つのToDoや行動を複数の取引先責任者に関連付けるための機能です。定期的なToDoの作成機能とは無関係であり、これを無効にしても繰り返しToDoを作成できるようにはなりません。"},{"k":"C","t":"ページレイアウトに「一連の定期的なToDoの作成」項目を追加する","e":"正解です。活動設定で機能を有効にした後、ユーザーが実際にレコード作成画面から定期的なToDoを作成できるように、ToDoのページレイアウトに該当する項目を追加して配置する必要があります。"},{"k":"D","t":"ToDoの通知サービスをオンにする","e":"ToDoの通知は、ToDoが割り当てられた際にユーザーへリマインダーやアラートを送信する機能です。定期的なToDoを作成する機能そのものとは関係がありません。"}],"a":["A","C"]},{"n":6,"q":"dream house realtyのイベントマネージャーは、成功したオープンハウスで獲得した有望なリードを、関連する商談を持つ取引先責任者に変換する必要があります。関連付けられたキャンペーンメンバーの履歴を保持したまま、キャンペーンからこれを達成するにはどうすればよいですか？","o":[{"k":"A","t":"リードを削除し、新しい取引先責任者と商談を作成する。","e":"既存のリードを削除してしまうと、そのリードに関連付けられていたキャンペーンメンバーとしての活動履歴やその他のデータがすべて失われてしまいます。履歴を保持するという要件を満たすことができません。"},{"k":"B","t":"リードをコピーし、コピーしたレコードを取引先責任者に変換する。","e":"リードをコピーして取引を開始しても、元のリードに紐づいていたキャンペーンメンバーの履歴は新しい取引先責任者に自動的には引き継がれません。また、不要な重複データを作成することになってしまいます。"},{"k":"C","t":"キャンペーンメンバーの詳細ページからリードの取引を開始する。","e":"正解です。キャンペーンメンバーの詳細ページから直接リードの取引を開始することで、リードは取引先、取引先責任者、および商談に変換されます。この方法を使用すると、元のリードに関連付けられていたキャンペーンメンバーの履歴が、新しく作成された取引先責任者レコードにそのまま引き継がれて保持されます。"},{"k":"D","t":"キャンペーンメンバーの詳細ページから取引先責任者を追加する。","e":"キャンペーンメンバーの詳細ページから新しい取引先責任者を単に追加するだけでは、既存のリードのデータや履歴を引き継いで変換することはできません。リードの取引開始プロセスを実行する必要があります。"}],"a":["C"]},{"n":7,"q":"Ursa Major Solarは、設置するすべてのパネルに1年間の保証を提供しています。設置の詳細と保証情報は「Installation（設置）」というカスタムオブジェクトに取り込まれます。設置レコードは、モバイルアプリから設置担当者によって作成されます。設置が遅れたり問題が発生したりした場合、顧客満足度を高めるための手段として、顧客はより長い保証を受けることがあります。管理者は、保証の有効期限を取り込むためにSalesforceをどのように構成する必要がありますか？","o":[{"k":"A","t":"保証有効期限項目のデフォルト値として数式を使用する。","e":"正解です。保証の有効期限項目のデフォルト値として数式を設定することで、レコード作成時に最初は1年間の保証期間を自動的に入力させることができます。デフォルト値の利点は、後からユーザーが手動でその値を上書きして編集できる点にあるため、顧客満足度向上のために保証期間を延長するという要件を満たすことができます。"},{"k":"B","t":"保証購入から1年後を表示する数式項目を作成する。","e":"数式項目を使用すると、常に計算された値が表示され、ユーザーが手動で値を上書きして変更することができなくなります。そのため、状況に応じて保証期間を延長するという要件を満たすことができません。"},{"k":"C","t":"有効期限項目が確実に入力されるように入力規則を追加する。","e":"入力規則は、レコード保存時に項目が入力されているかをチェックしたり、特定の条件を満たしているかを検証したりするためのものです。デフォルトで1年間の保証期間を自動設定する機能を提供するものではありません。"},{"k":"D","t":"モバイルのページレイアウトに保証有効期限項目を含める。","e":"ページレイアウトに項目を追加するだけでは、1年間の保証期間の自動入力機能は提供されません。設置担当者が毎回手動で1年後の日付を計算して入力する必要があり、要件に合致しません。"}],"a":["A"]},{"n":8,"q":"cloud kicksの営業担当者は、商品の販売を成約させるために商談レコードの割引を使用しています。商談が成約した場合、関連する商談商品に手動で割引を適用する必要があります。営業マネージャーは、この時間のかかる作業を自動化する方法があるかどうかを尋ねました。管理者はこの要件を満たすために何を使用する必要がありますか？","o":[{"k":"A","t":"Flow Builder","e":"正解です。フロービルダーは、Salesforce内で複雑なビジネスプロセスを自動化するための強力なツールです。商談が成約したときにトリガーされるレコードトリガフローを作成し、その商談に関連するすべての商談商品レコードを自動的に更新して割引を適用することができます。これにより、手作業による時間のかかるプロセスを排除できます。"},{"k":"B","t":"承認プロセス","e":"承認プロセスは、割引の承認など、レコードの承認を必要とするステップを自動化するための機能です。レコードの承認経路を定義するものであり、関連する子レコードである商談商品の項目値を自動的に一括更新するためには最適なツールではありません。"},{"k":"C","t":"事前構築済みマクロ","e":"事前構築済みマクロは、サポートエージェントなどが頻繁に行う反復的なタスクをワンクリックで実行するための機能です。商談が成約したという条件に基づいて、関連する複数の子レコードをバックグラウンドで自動的に更新するような処理には適していません。"},{"k":"D","t":"数式項目","e":"数式項目は、他の項目の値や計算式に基づいて値を自動的に計算して表示する読み取り専用の項目です。商談商品に割引額を計算して表示することは可能ですが、レコードの更新処理そのものを自動化したり、商談が成約したタイミングで特定のアクションを実行したりするツールではありません。"}],"a":["A"]},{"n":9,"q":"管理者が組織を強化するためにAppExchangeで見つけることができる2つのソリューションはどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"Communities","e":"Communities（現在はExperience Cloudサイト）はSalesforceの標準機能プラットフォームであり、組織を強化するためにAppExchangeから直接インストールまたは検索するソリューションではありません。"},{"k":"B","t":"Consultants","e":"正解です。AppExchangeには、Salesforceの導入、カスタマイズ、最適化、戦略立案などを専門とする認定コンサルタント（Consultants）のディレクトリがあり、要件に合った専門家を見つけて支援を依頼することができます。"},{"k":"C","t":"Components","e":"正解です。AppExchangeでは、Lightningページやアプリケーションの構築に直接追加できる再利用可能なビルディングブロックであるLightningコンポーネント（Components）を見つけて組織にインストールすることができます。"},{"k":"D","t":"Customers","e":"AppExchangeはSalesforceを拡張するためのアプリケーション、コンポーネント、コンサルティングサービスを提供するビジネス向けのマーケットプレイスであり、顧客（Customers）を見つけるためのプラットフォームではありません。"}],"a":["B","C"]},{"n":10,"q":"Northern Trail Outfittersの管理者は、10人の新入社員のために新しいユーザーを作成しました。なぜこれらのユーザーはSalesforce組織の取引先オブジェクトにアクセスできないのでしょうか？","o":[{"k":"A","t":"ユーザーのプロファイルには取引先の共有ルールが必要です。","e":"共有ルールは、組織の共有直接設定の制限を拡張し、特定のレコードへのアクセス権を他のユーザーやグループに付与するためのものです。オブジェクトそのものへの基本的なアクセス権を付与する機能ではありません。"},{"k":"B","t":"ユーザーのプロファイルには取引先オブジェクトへの権限が必要です。","e":"正解です。ユーザーが特定のオブジェクトのタブを表示したりレコードにアクセスしたりするには、まず割り当てられたプロファイルまたは権限セットで、そのオブジェクトに対する「参照」などのオブジェクトレベルの権限が付与されている必要があります。"},{"k":"C","t":"ユーザーのロールがロール階層の下位にあります。","e":"ロール階層は、他のユーザーが所有するレコードに対するレコードレベルのアクセス権を拡張するために使用されるものです。ユーザーがオブジェクト自体に全くアクセスできない根本的な原因ではありません。"},{"k":"D","t":"組織の共有直接設定が非公開に設定されています。","e":"組織の共有直接設定が非公開であっても、オブジェクトに対する権限さえあれば、ユーザーは少なくとも自身が所有するレコードにはアクセスして表示することができます。オブジェクト全体にアクセスできない理由は、プロファイルでのオブジェクト権限が不足しているためです。 ここから先は有料部分です"}],"a":["B"]},{"n":11,"q":"Northern TrailOutfittersの管理者は、割り当てられたライセンスと権限セットを追跡するためにスプレッドシートを使用してきました。Salesforceでこれを追跡するために使用できる機能は何ですか？","o":[{"k":"A","t":"ログイン履歴","e":"ログイン履歴は、ユーザーのSalesforceへのログイン試行、ステータス、IPアドレスなどを監視するための機能です。ライセンスや権限セットの割り当て状況を追跡するものではありません。"},{"k":"B","t":"Lightning利用状況アプリケーション","e":"Lightning利用状況アプリケーションは、組織内でのLightning Experienceの採用状況やログイン指標、ページのパフォーマンスなどを追跡・監視するためのツールです。ライセンス管理用ではありません。"},{"k":"C","t":"ユーザーレポート","e":"正解です。ユーザーレポートを作成することで、組織内のユーザーに割り当てられているプロファイル、ライセンス、権限セットなどの詳細な情報を抽出し、リストとして追跡することができます。これによりスプレッドシートでの手動管理が不要になります。"},{"k":"D","t":"権限セットグループ","e":"権限セットグループは、複数の権限セットを1つにまとめてユーザーに割り当てやすくするための機能です。割り当て状況自体を一覧で追跡・レポートするための機能ではありません。"}],"a":["C"]},{"n":12,"q":"Cloud Kicksには、Shipmentsというカスタムオブジェクトがあります。同社は、取引先ページからすべての配送項目を確認したいと考えています。取引先が削除されても、Shipmentsレコードは残るようにする必要があります。管理者はShipmentsと取引先の間にどのような種別の関係を作成するべきですか？","o":[{"k":"A","t":"Shipmentsは取引先への参照関係を持つ必要がある。","e":"正解です。参照関係を使用すると、2つのオブジェクトを関連付けながら、それぞれのレコードの独立性を保つことができます。Shipmentsオブジェクト（子）に取引先（親）への参照関係項目を作成することで、取引先ページの関連リストにShipmentsレコードを表示できるようになります。また、参照関係では親レコードである取引先が削除されても、子レコードであるShipmentsは削除されずに組織に残るため、今回の要件を完全に満たします。"},{"k":"B","t":"取引先はShipmentsへの参照関係を持つ必要がある。","e":"取引先オブジェクトにShipmentsへの参照関係項目を作成すると、1つのShipmentsレコードに対して複数の取引先が紐づく構造になり、親子の関係性が逆転してしまいます。"},{"k":"C","t":"Shipmentsは取引先への主従関係を持つ必要がある。","e":"主従関係を作成すると取引先ページにShipmentsの関連リストを表示することは可能ですが、主従関係の強い結びつきの仕様により、親レコード（取引先）が削除されると子レコード（Shipments）も自動的に削除されてしまうため、要件を満たしません。"},{"k":"D","t":"取引先はShipmentsへの主従関係を持つ必要がある。","e":"親子関係の向きが逆になっているだけでなく、主従関係であるため親レコードが削除された際に連動して削除される動作となり、要件を満たしません。"}],"a":["A"]},{"n":13,"q":"Ursa Majorは取引先をシルバー、ゴールド、またはプラチナレベルに分類しています。シルバーまたはゴールドパートナーの新しいケースが作成されたとき、それは通常のサポートキューに送信される必要があります。取引先がプラチナレベルの場合、自動的に優先サポートキューに送信される必要があります。管理者はこれを達成するために何を使用するべきですか？","o":[{"k":"A","t":"割り当てルール","e":"正解です。割り当てルールは、特定の条件に基づいて、新しく作成されたケースやリードを適切なユーザーまたはキューに自動的に振り分けるために使用されます。取引先のレベルという条件に基づいてケースを異なるサポートキューにルーティングする今回の要件に最適な機能です。"},{"k":"B","t":"ケースルール","e":"Salesforceには「ケースルール」という名称の独立した標準機能は存在しません。ケースの自動処理やルーティングを制御するための機能は、割り当てルールやエスカレーションルールなどの具体的なルール機能として提供されています。"},{"k":"C","t":"ワークフロールール","e":"ワークフロールールは、レコードが特定の条件を満たしたときに、項目の自動更新、メールアラート、ToDoの作成などのアクションを実行するための自動化機能です。ケースの担当者やキューへの初期割り当てプロセスには、専用の割り当てルールを使用するのがベストプラクティスです。"},{"k":"D","t":"エスカレーションルール","e":"エスカレーションルールは、ケースが作成されてから一定時間内に解決または対応されなかった場合に、自動的に別の担当者や上位のキューに再割り当て（エスカレーション）するための機能です。レコードの新規作成時の初期ルーティングを行うための機能ではありません。"}],"a":["A"]},{"n":14,"q":"営業担当者は、プロセスを通じて商談レコードに入力する際、重要な項目を見落としています。担当者は前のフェーズに戻ることはできず、プロセスを前に進める必要があります。管理者はこのニーズに対処するために、どの3つのオプションを使用するべきですか？3つの回答を選択してください。","o":[{"k":"A","t":"ガイド付き販売を有効にする。","e":"正解です。プロセスに沿って各フェーズで入力すべき重要な項目やガイダンスをユーザーに提示し、重要な情報の入力漏れを防ぐためのサポートを提供します。"},{"k":"B","t":"入力規則を使用する。","e":"正解です。入力規則を使用すると、特定のフェーズに進む際に必要な項目が入力されているかをシステムで検証し、空白の場合にエラーを出すことができます。また、PRIORVALUE関数などを利用して、以前のフェーズに戻ることを制限することも可能です。"},{"k":"C","t":"商談パスを設定する。","e":"商談パスを設定すると、フェーズごとの重要な項目や成功へのガイダンスを視覚的に表示することはできますが、パス機能単体では項目の入力を強制したり、前のフェーズに戻ることをシステム的に制限したりすることはできません。"},{"k":"D","t":"フローを使用して項目を必須としてマークする。","e":"フローはプロセスの自動化に使用する強力なツールですが、ユーザーインターフェース上で項目自体を必須入力として設定するための機能ではありません。必須入力の制御には、ページレイアウトや入力規則を使用するのが適切です。"},{"k":"E","t":"ページレイアウトで項目を必須としてマークする。","e":"正解です。ページレイアウト上で重要な項目を必須に設定することで、レコードを保存する際に必ずその項目が入力されるように制限でき、入力漏れを根本から防ぐことができます。"}],"a":["A","B","E"]},{"n":15,"q":"Universal Containersの管理者は、ユーザーがネットワーク外からSalesforceにアクセスするのを防ぐよう求められました。この設定の考慮事項となる2つはどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"IPアドレスの制限は、プロファイルまたは組織全体で設定される。","e":"正解です。SalesforceにおけるIPアドレス制限は、ネットワークアクセス設定を使用して組織全体の信頼済みIP範囲として設定するか、プロファイルレベルで厳密なログインIPアドレスの制限として設定することができます。"},{"k":"B","t":"ユーザーはログインIP制限を回避するためにパスワードを変更できる。","e":"パスワードを変更しても、設定されたログインIP制限を回避することはできません。IP制限はネットワークレベルのセキュリティ層で機能するため、ユーザー個人の認証情報の変更によってバイパスすることは不可能です。"},{"k":"C","t":"IP制限を実施するには、「すべての要求でログインIPアドレスの制限を適用」を選択する必要がある。","e":"正解です。ユーザーがログイン後に制限外のIPアドレスのネットワークに移動した場合（モバイル環境など）でもアクセスを継続してブロックするには、セッションの設定で「すべての要求でログインIPアドレスの制限を適用」オプションを有効にする必要があります。"},{"k":"D","t":"シングルサインオンを使用すると、ユーザーはどこからでもログインできるようになる。","e":"シングルサインオンを導入しても、Salesforce側のプロファイル等で設定されたIPアドレス制限は引き続き適用されます。そのため、シングルサインオンを使用したからといってネットワーク外のどこからでも自由にログインできるようになるわけではありません。"}],"a":["A","C"]},{"n":16,"q":"Cloud Kicksの分析ユーザーは、オブジェクトに対する「参照」、「作成」、および「編集」アクセス権を必要としていますが、レコードの「削除」は制限される必要があります。この要件を満たすために、管理者は何を行うべきですか？","o":[{"k":"A","t":"分析ユーザーに標準のシステム管理者プロファイルを割り当てる。","e":"標準のシステム管理者プロファイルには、大部分のオブジェクトに対する「削除」および「すべて変更」権限が含まれています。このプロファイルを割り当てると、ユーザーがレコードを削除できてしまうため、要件を満たしません。また、標準プロファイルのオブジェクト権限は編集できません。"},{"k":"B","t":"ユーザーに「すべて表示」アクセス権を付与し、ロール階層で最上位のロールに割り当てる。","e":"ロール階層はレコードレベルのアクセス権を制御するものであり、オブジェクトに対する「作成」や「編集」、「削除」といったオブジェクトレベルの権限を制御するものではありません。また、「すべて表示」権限ではレコードの作成や編集はできません。"},{"k":"C","t":"各オブジェクトの「削除」アクセス権を削除したカスタムプロファイルを作成して割り当てる。","e":"正解です。標準プロファイルをベースにしてカスタムプロファイルを作成し、各オブジェクトの「削除」権限を外して「参照」「作成」「編集」のみを残すことで、ユーザーがレコードを削除できないようにアクセス権を適切に制限することができます。"},{"k":"D","t":"「参照」、「作成」、および「編集」アクセス権を含む権限セットを作成して割り当てる。","e":"権限セットは、ユーザーのベースとなるプロファイルに権限を追加するために使用されるものであり、権限を減らすことはできません。もしユーザーの元のプロファイルに「削除」権限が含まれている場合、権限セットを使用してその権限を取り消すことはできないため、プロファイルレベルでの制御が必要です。"}],"a":["C"]},{"n":17,"q":"Cloud kicksは、注文で適切な配送詳細が使用されるようにする必要があります。担当者は、取引先の配送先住所が変更されたときに、取引先に関連付けられた選択した注文の配送先住所を更新するための合理化されたソリューションを持つ必要があります。管理者はこの要件をどのように提供する必要がありますか？","o":[{"k":"A","t":"取引先の配送先住所が変更されるたびに、すべての未処理の注文の配送先住所を更新する、注文ページの自動起動フロー。","e":"注文ページに配置された自動起動フローは、この要件には適していません。要件では担当者が「選択した注文」を更新することが求められていますが、自動化されたフローではユーザーが対象を選択する対話的なプロセスが含まれません。"},{"k":"B","t":"取引先の配送先住所が変更されるたびに、すべての未処理の注文の配送先住所を更新する、取引先ページの自動起動フロー。","e":"自動起動フローやレコードトリガフローによってすべての注文を背後で強制的に更新することは可能ですが、担当者が状況に応じて更新する注文を「選択」するという要件を満たすことができません。"},{"k":"C","t":"担当者が関連付けられたすべての未処理の注文で更新された取引先の配送先住所を選択できるようにする、注文ページの画面フロー。","e":"注文ページに画面フローを配置すると、現在開いている単一の注文のコンテキストで実行されてしまうため、取引先に関連付けられた複数の注文を一覧表示して選択するという一括処理には適していません。"},{"k":"D","t":"担当者が関連付けられたすべての未処理の注文で更新された取引先の配送先住所を選択できるようにする、取引先ページの画面フロー。","e":"正解です。取引先ページから画面フローを起動することで、担当者にその取引先に関連する未処理の注文の一覧を画面上に提示し、配送先住所を更新したい注文だけをチェックボックス等で選択させる合理的なプロセスを提供できます。これにより要件を完全に満たします。"}],"a":["D"]},{"n":18,"q":"Northern Trail Outfittersの管理者は、salesforceで新しいユーザーを追加できません。この問題の原因は何ですか？","o":[{"k":"A","t":"ユーザー名が企業のメールアドレスではありません。","e":"ユーザー名はメールアドレスの形式である必要がありますが、実在する企業ドメインのメールアドレスである必要はありません。これが原因で作成できないわけではありません。"},{"k":"B","t":"ユーザー名が80文字未満です。","e":"ユーザー名の長さは最大80文字まで許容されています。80文字未満であることが作成エラーの原因になることはありません。"},{"k":"C","t":"ユーザー名が偽のメールアドレスです。","e":"ユーザー名はメールアドレスの形式を満たしている必要はありますが、実際に受信可能なメールアドレスである必要はありません。ダミーのドメインでも形式が合っていれば保存可能です。"},{"k":"D","t":"ユーザー名がすでに使用されています。","e":"正解です。Salesforceにおけるユーザー名は、すべてのSalesforce組織を通じてグローバルに一意である必要があります。そのため、他の組織（他の会社の環境やSandboxなど）で既に同じユーザー名が登録されている場合、新しいユーザーとして保存できずにエラーとなります。"}],"a":["D"]},{"n":19,"q":"Ursa Major Solarの管理者は、カスタムレポートタイプを作成し、営業業務チーム向けのレポートを作成しました。しかし、ユーザーは誰もそのレポートにアクセスできません。この問題の原因として考えられる2つのオプションはどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"カスタムレポートタイプが開発中である。","e":"正解です。カスタムレポートタイプの状況が「開発中」に設定されている場合、システム管理者および「カスタムレポートタイプの管理」権限を持つユーザーのみが使用できます。他のユーザーがアクセスできるようにするには、状況を「リリース済」に変更する必要があります。"},{"k":"B","t":"ユーザーのプロファイルに参照アクセス権が欠落している。","e":"レポートやダッシュボードへのアクセス権は、プロファイルではなく、レポートが保存されているフォルダの共有設定によって制御されます。プロファイルに個々のレポートへの参照権限を設定する項目はありません。"},{"k":"C","t":"組織がカスタムレポートタイプの制限に達している。","e":"制限に達すると新しいカスタムレポートタイプを作成できなくなりますが、作成済みのレポートにユーザーがアクセスできない理由にはなりません。"},{"k":"D","t":"レポートが非公開フォルダに保存されている。","e":"正解です。レポートが作成者の個人の非公開フォルダに保存されている場合、他のユーザーはそのレポートを表示したりアクセスしたりすることができません。アクセスを許可するには、適切な権限を持つ公開フォルダまたは共有フォルダに保存する必要があります。"}],"a":["A","D"]},{"n":20,"q":"Ursa Major Solarは、太平洋時間の担当者向けに営業時間を午前9時から午後5時に設定しています。東部時間の担当者は、サポートをカバーするために営業時間を3時間早く開始するように設定する必要があります。管理者はこの問題をどのように解決すべきですか？","o":[{"k":"A","t":"各タイムゾーンの臨時営業時間を設定する。","e":"臨時営業時間や休日の設定は、特定の日の営業時間を一時的に変更するためのものであり、恒常的なタイムゾーンの違いに対処するための設定ではありません。"},{"k":"B","t":"現在の営業時間を調整して東部タイムゾーンに対応する。","e":"既存の営業時間を東部時間に合わせて変更してしまうと、太平洋時間の担当者の基準がずれてしまい、両方の地域の要件を同時に満たすことができなくなります。"},{"k":"C","t":"タイムゾーンごとに1つの営業時間セットを作成する。","e":"正解です。Salesforceでは複数の営業時間を設定でき、それぞれに異なるタイムゾーンを割り当てることができます。地域の担当者ごとに適切な営業時間を適用し、ケースのエスカレーションなどを正確に機能させるためには、タイムゾーンごとに個別の営業時間を作成する必要があります。"},{"k":"D","t":"担当者が手動で営業時間を設定できるようにする。","e":"営業時間は組織のサポートプロセス全体に影響を与えるため、管理者がシステム設定として定義するものです。各担当者が個別に手動で設定や変更を行うための機能ではありません。"}],"a":["C"]},{"n":21,"q":"Cloud Kicksは、営業ユーザーとマーケティングユーザーに異なる選択リスト値を表示できるようにする必要があります。この要件を満たす2つのオプションはどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"1つのページレイアウト、2つのレコードタイプ、1つの選択リスト","e":"正解です。レコードタイプを使用すると、1つの選択リスト項目に対して異なる値を割り当てることができます。営業用とマーケティング用に2つのレコードタイプを用意し、プロファイルごとに割り当てることで、ページレイアウトが1つであってもユーザーごとに異なる選択リスト値を表示するという要件を満たすことができます。"},{"k":"B","t":"2つのページレイアウト、1つのレコードタイプ、2つの選択リスト","e":"営業用とマーケティング用に別々の選択リスト項目を2つ作成し、それぞれ異なるページレイアウトに配置して表示を分けることは物理的には可能ですが、同じ目的の項目が複数存在することになり、データの集計や管理が複雑になるため適切な解決策ではありません。"},{"k":"C","t":"2つの権限セット、1つのレコードタイプ、1つの選択リスト","e":"権限セットはオブジェクトや項目レベルのアクセス権を追加で付与するために使用されるものであり、選択リスト内で利用可能な値そのものをユーザーごとに制御したり切り替えたりする機能は持っていません。"},{"k":"D","t":"1つのレコードタイプ、2つのプロファイル、1つの選択リスト","e":"正解です。プロファイルはユーザーの基本的なアクセス権や割り当てられる設定を制御する基盤となります。営業とマーケティングという2つの異なるプロファイルが存在することで、システム側でそれぞれのユーザー群を識別し、適切なレコードタイプやレイアウトの割り当てを管理して異なる選択リスト値を表示する制御が可能になります。"}],"a":["A","D"]},{"n":22,"q":"Dream House Realtyは、取引先とケースのカテゴリ項目で一貫した選択リスト値を使用し、レコードタイプに応じた値を使用する必要があります。2つ選択してください。","o":[{"k":"A","t":"複数選択リスト","e":"ユーザーが複数の値を選択できる項目です。複数のオブジェクト間（取引先とケースなど）で一貫した値を共有したり、レコードタイプに基づいて値を制御したりするための主な機能ではありません。"},{"k":"B","t":"連動選択リスト","e":"正解です。Salesforceでは、レコードタイプごとに選択リストで利用可能な値を制御することができます。これにより、レコードタイプに応じた固有の値を使用するという要件を満たすことができます。"},{"k":"C","t":"グローバル選択リスト","e":"正解です。グローバル選択リスト（グローバル値セット）を使用すると、複数のオブジェクトや項目間で共通の選択リスト値のセットを共有できます。これにより、取引先とケースのカテゴリ項目で一貫した選択リスト値を使用するという要件を満たします。"},{"k":"D","t":"カスタム選択リスト","e":"単一のオブジェクト内の特定の項目に対して作成される標準的な選択リストです。これ単体では、取引先とケースのような複数のオブジェクト間で一貫した値のセットを共有し、一元管理することはできません。"}],"a":["B","C"]},{"n":23,"q":"Cloud KicksのユーザーがSalesforceへのログインで問題を抱えています。ユーザーは管理者にパスワードのリセットを依頼しました。管理者がユーザーのパスワードをリセットする際に考慮すべき2つの事項はどれですか？2つ選択してください。","o":[{"k":"A","t":"パスワードをリセットすると、ユーザーのパスワードポリシーが変更されます。","e":"パスワードをリセットしても、パスワードポリシーは変更されません。パスワードの長さや有効期限などのパスワードポリシーは、ユーザーのプロファイルレベルで設定および管理されます。"},{"k":"B","t":"シングルサインオンユーザーは、パスワードを忘れた場合のリンクを使用して自分のパスワードをリセットできます。","e":"シングルサインオン（SSO）を使用しているユーザーは、Salesforceのログイン画面にあるパスワードを忘れた場合のリンクを使用してパスワードをリセットすることはできません。SSOユーザーのパスワードや認証は、企業のアイデンティティプロバイダー（IdP）側で一元管理されます。"},{"k":"C","t":"ロックアウトされたユーザーのパスワードをリセットすると、ユーザーのアカウントのロックが自動的に解除されます。","e":"正解です。ログイン試行の失敗回数の上限を超えてアカウントがロックアウトされた場合、管理者がパスワードをリセットすることで、パスワードが再設定されると同時にアカウントのロックも自動的に解除されます。"},{"k":"D","t":"パスワードをリセットした後、ユーザーがSalesforceに正常にログインするためにデバイスの有効化が求められる場合があります。","e":"正解です。パスワードをリセットした後でも、ユーザーが未知のブラウザやデバイス、または指定された信頼済みIP範囲外からログインを試みる場合、セキュリティのためにID検証（デバイスの有効化）が要求されることがあります。"}],"a":["C","D"]},{"n":24,"q":"Cloud Kicks (CK) は、中古靴店および中古自転車専門店と提携しています。CKには、取引先に関連するオープンなケースの数を数えるために週に1回実行したい自動化されたビジネスプロセスがあります。管理者はこのビジネスプロセスを自動化するために何を推奨すべきでしょうか？","o":[{"k":"A","t":"アウトバウンドメッセージを使用したワークフロールールを作成する。","e":"ワークフロールールはレコードの作成や編集時などをトリガーとして実行されるため、特定のスケジュール（週に1回など）で自律的かつ定期的に実行することはできません。また、アウトバウンドメッセージは外部システムへのXMLメッセージ送信に使用される機能であり、Salesforce内でのレコードの集計（ケースのカウント）には適していません。"},{"k":"B","t":"プロセスビルダーでスケジュール済みプロセスを設定する。","e":"プロセスビルダーはレコードの変更やプラットフォームイベントなどをトリガーとして起動するため、週に1回などの指定したスケジュールで定期的にバッチ処理のように実行させることはできません。また、Salesforceはプロセスビルダーを非推奨としており、新規の自動化にはフローを使用することが強く推奨されています。"},{"k":"C","t":"フロービルダーでスケジュール済みフローを設定する。","e":"正解です。フロービルダーのスケジュールトリガーフロー（スケジュール済みフロー）を使用すると、指定した頻度（毎日、毎週など）や特定の時間で自動的にバックグラウンド処理を実行させることができます。これにより、週に1回取引先に関連するケースをカウントするという自動化の要件を完全に満たすことができます。"},{"k":"D","t":"編集時に取引先を更新するプロセスを使用する。","e":"この方法では、取引先レコードがユーザーやシステムによって編集されたタイミングでしかプロセスが実行されません。「週に1回実行する」という定期的なスケジュールの要件を満たすことができないため不適切です。"}],"a":["C"]},{"n":25,"q":"Cloud Kicksは、商品ごとに靴のデザインを追跡したいと考えています。靴のデザインは削除できないようにする必要があり、1つの商品に対して様々なフェーズにわたって複数のデザインが存在する可能性があります。この要件を満たすために、管理者はどの2つのステップを設定する必要がありますか？2つ選択してください。","o":[{"k":"A","t":"靴のデザイン用のカスタムオブジェクトを作成する。","e":"正解です。Salesforceには靴のデザインを管理するための専用の標準オブジェクトは存在しないため、要件を満たすデータを格納するためのカスタムオブジェクトを新規作成する必要があります。"},{"k":"B","t":"商品オブジェクトに靴のデザイン用のカスタム参照項目を設定する。","e":"参照関係では親レコード（商品）と子レコード（靴のデザイン）の結びつきが弱く、親レコードとの連動したアクセス制御や削除に関する厳密な制限要件をネイティブに満たすのには適していません。"},{"k":"C","t":"商品オブジェクトに靴のデザイン用のカスタム主従関係項目を追加する。","e":"正解です。1つの商品に対して複数のデザインが存在するという要件（1対多の関係）を満たし、さらにデザインレコードの削除制限などの詳細な制御を親レコード（商品）側と強固に結びつけるためには、主従関係を構築することが最適です。"},{"k":"D","t":"デザイン用の標準オブジェクトを使用する。","e":"Salesforceには、特定の商品のデザインを管理するための標準オブジェクトは用意されていません。独自の要件を満たすにはカスタムオブジェクトを使用する必要があります。"}],"a":["A","C"]},{"n":26,"q":"Northern Trail Outfittersは、従業員がSalesforceアカウントに対して安全で適切なパスワードを選択することを推奨したいと考えています。管理者が設定すべき3つのパスワードポリシーはどれですか？3つ選択してください。","o":[{"k":"A","t":"無効なログインの最大試行回数","e":"正解です。無効なログイン試行の最大回数を設定することで、パスワードの推測による不正アクセスやブルートフォース攻撃を防ぎ、アカウントのセキュリティを高めることができます。"},{"k":"B","t":"禁止されたパスワード値","e":"Salesforceの標準のパスワードポリシー設定には、特定の単語や値を禁止パスワードとして直接指定する機能は用意されていません。"},{"k":"C","t":"パスワードマネージャーアプリの使用の要求","e":"Salesforceの標準機能では、ユーザーに対して特定のサードパーティ製パスワードマネージャーアプリの使用を強制する設定項目はありません。"},{"k":"D","t":"パスワードの複雑さの要件","e":"正解です。アルファベットと数字、あるいは特殊文字を組み合わせるなどの要件を設定することで、推測されにくい強力なパスワードの作成をユーザーに促すことができます。"},{"k":"E","t":"パスワードの有効期限が切れるまでの日数","e":"正解です。パスワードに有効期限（90日など）を設定することで、定期的なパスワード変更を強制し、長期間同じパスワードを使用することによるセキュリティリスクを軽減できます。"}],"a":["A","D","E"]},{"n":27,"q":"Universal Containersは、販売代理店パートナーが購入する商品に割引価格を提供したいと考えています。管理者はこの要件をどのように設定すべきですか？","o":[{"k":"A","t":"商談にPartner_Discount__c項目を追加する。","e":"カスタム項目を追加して商談全体で割引を計算することは可能ですが、複数の商品に対してそれぞれ異なる割引価格を適用するような複雑な価格管理を行うための標準的なベストプラクティスではありません。"},{"k":"B","t":"販売代理店パートナー用の別個の商品を構築する。","e":"同じ商品に対して対象者別に異なる商品レコードを作成してしまうと、商品マスタが重複し、在庫管理やレポート作成が非常に複雑になるため推奨されません。"},{"k":"C","t":"別の商談レコードタイプを使用する。","e":"レコードタイプは、ユーザーのプロファイルに応じてページレイアウトや選択リストの表示値を制御するための機能であり、商品ごとの価格を直接設定または変更するものではありません。"},{"k":"D","t":"販売代理店パートナー用に別個の価格ブックを作成する。","e":"正解です。Salesforceの標準機能である価格ブックを使用することで、同一の商品に対して顧客セグメント（この場合は販売代理店パートナー）ごとに異なる価格リストを作成し、適切な割引価格を柔軟に管理することができます。"}],"a":["D"]},{"n":28,"q":"Cloud Kicks (CK) のサポート担当者は、ケースをクローズしようとすると、ケース状況の選択リストに「クローズ」オプションが表示されないと報告しています。CKは管理者に解決策を見つけるよう依頼しました。サポート担当者が指定された選択リストに「クローズ」オプションを表示できないのはなぜですか？","o":[{"k":"A","t":"ケースのレコードタイプで、選択リスト値として「クローズ」が欠落している。","e":"レコードタイプは多くの選択リスト値を制御しますが、ケースの「状況」項目は例外であり、レコードタイプではなくサポートプロセスによって直接制御されます。"},{"k":"B","t":"ケースをクローズするには、ケースのクローズページレイアウトを使用する必要がある。","e":"クローズページレイアウトはケースをクローズする際のアクションや画面表示を制御するために使用されますが、状況選択リストに特定の値（クローズなど）が表示されるかどうかを決定する根本的な設定ではありません。"},{"k":"C","t":"ケース状況項目のクローズ済みの状況を表示するチェックボックスがデフォルトに設定されている。","e":"サポート設定にあるクローズされた状況をケース状況項目に表示する設定は、主にセルフサービスポータルなどの特定の表示に影響を与えるものであり、社内ユーザーのレコード編集時の状況選択リストの値を制御するものではありません。"},{"k":"D","t":"使用されているサポートプロセスで、状況の選択肢から「クローズ」が省略されている。","e":"正解です。ケースオブジェクトの「状況」項目の選択リストに表示される値は、サポートプロセスによって制御されます。サポートプロセス内で「クローズ」の値が選択済みの値として追加されていない場合、ユーザーはそのサポートプロセスに関連付けられたレコードタイプを使用してケースをクローズすることができません。"}],"a":["D"]},{"n":29,"q":"Ursa Major Solarは、ユーザーの経費精算プロセスをガイドし、提出、ルーティング、および承認を簡素化したいと考えています。管理者はこのソリューションを構築するために、どの2つのツールを使用するべきですか？2つ選択してください。","o":[{"k":"A","t":"入力規則","e":"入力規則は、ユーザーが入力したデータが特定の条件を満たしているか、レコードを保存する前に確認する機能です。経費精算のような複数ステップのプロセスをガイドしたり、レコードを特定の担当者にルーティングしたりすることはできません。"},{"k":"B","t":"フロービルダー","e":"正解です。フロービルダーの画面フローを使用することで、ユーザーに対してウィザード形式のガイド付き入力画面を提供し、必要な情報の入力と提出のプロセスを簡素化することができます。"},{"k":"C","t":"承認プロセス","e":"正解です。承認プロセスを使用することで、提出された経費精算レコードを適切な承認者（マネージャーなど）に自動的にルーティングし、承認または却下の一連の手順を管理・自動化する要件を満たすことができます。"},{"k":"D","t":"クイックアクション","e":"クイックアクションは、レコードの作成や更新、活動の記録などを素早く行うための機能です。単一のステップでアクションを完了させるのには便利ですが、画面フローのような複数ステップのガイド付きプロセスを構築したり、承認のためのルーティングを行ったりすることには適していません。"}],"a":["B","C"]},{"n":30,"q":"DreamHouse Realtyには承認プロセスがあります。マネージャーがレコードを承認しようとしましたが、エラーが発生しました。この問題をトラブルシューティングするために、管理者は何を確認すべきですか？","o":[{"k":"A","t":"プロセス内の次の承認者に対して代理承認者を追加する。","e":"代理承認者を追加することは、承認者が休暇などで不在の場合の運用上の対応としては有効ですが、マネージャーが現在直面している承認エラーの根本原因を調査および解決するための手順ではありません。"},{"k":"B","t":"プロセスで更新される項目の参照アクセス権を付与するために、項目レベルセキュリティを更新する。","e":"承認プロセスにおける自動的な項目更新アクションはシステムコンテキストで実行されます。そのため、承認を実行するユーザー自身の項目レベルセキュリティの設定が、承認エラーの直接的な原因になることはありません。"},{"k":"C","t":"次の承認者に指定されているユーザーが無効化されているか、欠落しているかを確認する。","e":"正解です。承認プロセスで次のステップに進む際、指定されている次回の承認者（ユーザー）がシステム上で無効化されていたり、指定されたマネージャー項目が空白（欠落）であったりすると、適切なルーティング先が見つからずにエラーが発生します。"},{"k":"D","t":"プロセスで更新される項目が表示されていることを確認するために、ページレイアウトを確認する。","e":"ページレイアウト上の項目の表示有無は、画面上の見え方を制御するものであり、承認プロセスのバックグラウンド処理や承認時のエラーの発生には影響を与えません。"}],"a":["C"]},{"n":31,"q":"管理者は、組織で行われた最近の設定変更を確認するためにどのツールを使用するべきですか？","o":[{"k":"A","t":"重要な更新","e":"重要な更新（現在はリリース更新と呼ばれています）は、Salesforceの新しいリリースに伴うシステムの動作変更やセキュリティの改善などを管理・適用する場所であり、管理者が行った最近の設定変更を確認するためのツールではありません。"},{"k":"B","t":"デバッグログ","e":"デバッグログは、データベースの操作、システムプロセス、Apexコードの実行時に発生するエラーのトラブルシューティングに使用されます。組織の設定変更の履歴を確認するためのものではありません。"},{"k":"C","t":"設定変更履歴","e":"正解です。設定変更履歴は、自分または他の管理者が組織の設定に対して行った最近の変更を追跡し、誰が、いつ、何を変更したかを確認するために使用される最適なツールです。"},{"k":"D","t":"項目履歴管理","e":"項目履歴管理は、特定のオブジェクトのレコード内の項目の値がいつ、誰によってどのように変更されたかを追跡する機能であり、組織全体の設定や構造の変更を追跡するものではありません。"}],"a":["C"]},{"n":32,"q":"DreamHouse Realtyの管理者は、エージェントの能力とスキルセットを割り当てる簡単な方法を求めています。この要件を満たすために、管理者はどの機能を有効にするべきでしょうか？","o":[{"k":"A","t":"ナレッジ管理","e":"ナレッジ管理は、ナレッジ記事（解決策、FAQなど）の作成、共有、管理を容易にする機能です。この機能は主にナレッジベースの管理に関連しており、エージェントの能力やスキルセットの割り当てには直接関連していません。"},{"k":"B","t":"オムニチャネル","e":"正解です。オムニチャネルは、作業を適切なエージェントに自動的にルーティングするSalesforceの機能です。この機能を使用することで、エージェントのスキルセットや能力に基づいて作業を割り当てることが可能になります。これにより、エージェントの技能を適切に活用し、顧客サービスの効率性を向上させることができます。"},{"k":"C","t":"エスカレーションルール","e":"エスカレーションルールは、特定の条件を満たしたケースを自動的にエスカレートするために使用されます。この機能もエージェントのスキルセットの割り当てとは直接関係ありません。"},{"k":"D","t":"テリトリーマネジメント","e":"テリトリーマネジメントは、企業の販売地域や顧客セグメントに基づいて取引先責任者や商談を管理する機能です。これもエージェントの能力やスキルセットの管理には適していません。"}],"a":["B"]},{"n":33,"q":"Universal Containersは、サービスチームが商談レコードにアクセスするのを防ぎたいと考えています。サービスユーザーは商談のリストビューにはアクセスできませんが、検索を通じて商談レコードを見つけることができます。アクセスを完全に制限するために、管理者はどのオプションを調整する必要がありますか？","o":[{"k":"A","t":"レコード設定と検索インデックス","e":"Salesforceにはユーザーのアクセスを直接制御するレコード設定と検索インデックスという標準的なアクセス制御の組み合わせは存在しません。検索インデックスを直接変更して特定のユーザーのアクセス制限を行うことはできません。"},{"k":"B","t":"権限とタブの表示設定","e":"正解です。リストビューにアクセスできないのに検索でレコードが見つかる場合、ユーザーはオブジェクトへの参照権限を持っているものの、タブが非表示に設定されている状態と考えられます。レコードへのアクセスを完全に制限するには、プロファイルまたは権限セットで該当オブジェクトに対する権限そのものを取り消す必要があります。"},{"k":"C","t":"アプリケーション権限と検索語","e":"アプリケーション権限は特定のアプリケーションへのアクセスを制御するものであり、オブジェクト単位のレコードアクセスを完全に防ぐものではありません。また、管理者が検索語を調整することでユーザーのアクセスを制限するような機能はありません。"},{"k":"D","t":"ページレイアウトと項目レベルセキュリティ","e":"ページレイアウトや項目レベルセキュリティは、ユーザーがレコードにアクセスした後に表示される特定の項目や画面レイアウトを制御するものです。レコードそのものへのアクセスや、検索結果への表示を根本的に制限するための設定ではありません。"}],"a":["B"]},{"n":34,"q":"プロファイルのどの設定を使用すると、すべてのアプリケーションランチャーでタブを非表示にしたり、任意のアプリケーションで表示可能にしたりしつつ、通常はこのタブの下にあるレコードを引き続きユーザーに表示させることができますか？","o":[{"k":"A","t":"オブジェクト権限","e":"オブジェクト権限は、ユーザーがレコードに対して実行できるアクション（参照、作成、編集、削除など）を制御するものです。タブ自体の表示や非表示を制御する機能ではありません。"},{"k":"B","t":"アプリケーション権限","e":"アプリケーション権限は、システム機能や特定のアプリケーション全体へのアクセスを制御するものです。個別のオブジェクトタブの表示設定を直接制御するものではありません。"},{"k":"C","t":"組織の共有設定","e":"組織の共有設定は、ユーザーが所有していないレコードに対するベースラインのアクセスレベルを定義するものです。タブの表示を制御する設定ではありません。"},{"k":"D","t":"タブの設定","e":"正解です。プロファイルのタブの設定を「タブを隠す」にすると、アプリケーションランチャーやナビゲーションバーからそのタブは非表示になります。しかし、オブジェクトに対する「参照」権限が残っていれば、ユーザーは検索や他のレコードの関連リストなどを通じて引き続きレコードを表示することができます。"}],"a":["D"]},{"n":35,"q":"Universal Containers (UC) の顧客から、サポートケースへの対応が遅すぎるというフィードバックが寄せられました。UCは、未割り当てのまま2時間以上経過したすべてのケースを緊急ケースキューに送信し、サポートマネージャーにアラートを送信したいと考えています。この要件を満たすために、管理者はどの機能を設定する必要がありますか？","o":[{"k":"A","t":"ケースのスケジュール済みレポート。","e":"レポートを定期的にスケジュールしてメールなどで送信することは可能ですが、未割り当てのまま特定の時間が経過したレコードを自動的に別のキューに再割り当てしたり、アラートをリアルタイムで送信したりするアクションやルーティングの機能ではありません。"},{"k":"B","t":"ケースダッシュボードの更新。","e":"ダッシュボードのスケジュール済み更新は、定義された間隔で最新のデータを視覚化するための機能です。特定の条件を満たしたケースの所有権の変更や特定ユーザーへのアラート送信といった、レコードに対する自動化アクションを実行するものではありません。"},{"k":"C","t":"ケースのエスカレーションルール。","e":"正解です。エスカレーションルールを使用すると、ケースが作成されてから一定時間（この場合は2時間）経過しても特定の条件（未割り当てなど）を満たしている場合に、ケースを別のユーザーや緊急ケースキューに自動的に再割り当てし、同時にマネージャーにメールアラートを送信するように設定することができます。"},{"k":"D","t":"ケースの割り当てルール。","e":"割り当てルールは、ケースが手動で作成された時点、またはWeb-to-ケースやメール-to-ケースなどのチャネルから自動生成された直後に、特定の条件に基づいて所有者をキューやユーザーに割り当てるための機能です。作成から「2時間経過後」といった時間ベースの遅延アクションを実行することはできません。"}],"a":["C"]},{"n":36,"q":"Northern Trail Outfittersは、各マーケティングキャンペーンからどれだけの収益が創出されたかを計算したいと考えています。管理者はこの情報をどのように提供するべきですか？","o":[{"k":"A","t":"標準のキャンペーンレポートを設計し、キャンペーン項目の成約した商談の値を追加する。","e":"レポート上で数値を集計して表示することは可能ですが、キャンペーンレコードの画面上で直接、各キャンペーンの収益を確認できるようにする方がユーザーにとって直感的です。システム内で自動計算できる標準機能があるため、レポートのみで解決するアプローチは最適ではありません。"},{"k":"B","t":"キャンペーンレコードを更新するために定期的なデータジョブを実行する。","e":"データジョブを定期的に実行して数値を更新する方法は、データがリアルタイムで反映されないという欠点があります。また、不要なメンテナンスの手間やシステム負荷がかかるため、標準の自動化機能を使用するべきです。"},{"k":"C","t":"キャンペーンに商談の積み上げ集計項目を作成する。","e":"正解です。キャンペーンと商談の間には標準でリレーションがあり、キャンペーンオブジェクトには関連付けられた商談の金額（成約した商談の総額など）を自動的に合計するための積み上げ集計項目が存在します。これを使用することで、キャンペーンから生み出された収益をリアルタイムかつ正確に計算し、表示することができます。"},{"k":"D","t":"キャンペーンに合計値項目を追加し、商談が成約したときに値を更新するワークフロールールを使用する。","e":"ワークフロールールは、子レコード（この場合は商談）の金額を合計して親レコード（キャンペーン）に反映させるといった、複数レコードをまたぐ集計処理を行う機能を持っていません。このような集計要件には積み上げ集計項目を使用するのが適切な方法です。"}],"a":["C"]},{"n":37,"q":"Ursa Major Solarは、どのマーケティング活動がチームの商談獲得に役立っているかを知りたいと考えています。これらのインサイトを提供するために、管理者は何を設定するべきですか？","o":[{"k":"A","t":"キャンペーン階層","e":"キャンペーン階層は、関連するキャンペーンをグループ化し、親キャンペーンと子キャンペーンの関係を構築して全体的な成果を集計するための機能です。特定の商談の成約にどのキャンペーンが直接的に貢献したかを追跡する機能ではありません。"},{"k":"B","t":"キャンペーンインフルエンス","e":"正解です。キャンペーンインフルエンス機能を使用すると、商談を1つまたは複数のキャンペーンに関連付け、どのマーケティング活動（キャンペーン）がその商談の成約に影響を与え、収益を生み出したかを追跡および分析することができます。"},{"k":"C","t":"カスタムリード項目の対応付け","e":"リードのカスタム項目を、リードの取引開始時に取引先、取引先責任者、または商談の項目に対応付けるための機能です。マーケティング活動が商談獲得にどのように影響したかを分析するための機能ではありません。"},{"k":"D","t":"リストメール活動","e":"リストメール活動は、取引先責任者やリードのリストに対して一括メールを送信し、その活動履歴を追跡する機能です。個別のメール送信履歴は確認できますが、商談の成約に寄与したマーケティング活動全体のインサイトを提供する直接的な機能ではありません。"}],"a":["B"]},{"n":38,"q":"Ursa Major Solarの管理者は、作業項目とプロジェクトのカスタムオブジェクトのリレーションを主従関係から参照関係に変更するよう求められました。この要件を満たす上で、管理者の妨げとなる可能性があるシナリオはどれですか？","o":[{"k":"A","t":"参照をサポートするには連結オブジェクトが必要です。","e":"連結オブジェクトは多対多のリレーションを作成するために使用されるものであり、主従関係から参照関係への変更を直接妨げるシステム上の要因にはなりません。"},{"k":"B","t":"すべてのレコードの参照項目に値が含まれています。","e":"すべてのレコードの対象項目に値が入っていることは、主従関係から参照関係への変更を妨げるものではありません。逆に、参照関係から主従関係へ変更する場合には、既存のすべてのレコードに値が含まれている必要があります。"},{"k":"C","t":"レコードを保存するには参照項目が必要です。","e":"ページレイアウトや入力規則などで項目が必須設定になっていること自体は、データ型を主従関係から参照関係に変更することを防ぐ根本的な制限にはなりません。"},{"k":"D","t":"主オブジェクトに積み上げ集計項目が存在します。","e":"正解です。親オブジェクト（主オブジェクト）側に子レコードの値を計算するための積み上げ集計項目が存在する場合、その基となっている主従関係を参照関係に変更することはできません。変更を行うには、事前に対象の積み上げ集計項目を削除する必要があります。"}],"a":["D"]},{"n":39,"q":"Ursa Major Solarは、すべての従業員に素晴らしい体験を提供しています。従業員エンゲージメント委員会は、他の従業員の投稿を制限しつつ、更新情報を投稿したいと考えています。この要求を満たすために、管理者は何を作成するべきですか？","o":[{"k":"A","t":"Chatter ストリーム","e":"Chatter ストリームは、異なるプロファイル、グループ、またはレコードからのフィードを1つのカスタムビューにまとめる機能です。他のユーザーの投稿を制限する機能ではありません。"},{"k":"B","t":"Chatter ブロードキャストグループ","e":"正解です。Chatter ブロードキャストグループは、グループの所有者とマネージャーのみが新規投稿を作成でき、一般メンバーの投稿を制限できるグループです。これにより、委員会のみが情報を発信し、他の従業員の投稿を制限するという要件を満たすことができます。"},{"k":"C","t":"Chatter お勧め","e":"Chatter お勧めは、ユーザーの関心に基づいてフォローすべき人やグループをシステムが提案する機能です。投稿の権限やアクセス制御を行うものではありません。"},{"k":"D","t":"Chatter リストに記載しないグループ","e":"Chatter リストに記載しないグループは、検索結果や全グループのリストに表示されず、招待されたメンバーのみが参加できる機密性の高いグループです。参加メンバーの投稿権限自体を制限する機能ではないため、今回の要件には適していません。"}],"a":["B"]},{"n":40,"q":"管理者は、ユーザーが顧客を失ったときに入力するフォームをSalesforceで作成したいと考えています。この目標を達成するためのウィザードの作成をサポートする自動化ツールはどれですか？","o":[{"k":"A","t":"プロセスビルダー","e":"プロセスビルダーはレコードの作成や更新をトリガーとしてバックグラウンドで自動化処理を行うツールであり、ユーザーがデータを入力するための画面（ウィザードやフォーム）を作成する機能は備えていません。"},{"k":"B","t":"承認プロセス","e":"承認プロセスは、レコードを適切な担当者に転送し、承認または却下の一連の手順を管理・自動化するための機能です。ユーザーが情報を入力するカスタムフォームやウィザードを作成するためのツールではありません。"},{"k":"C","t":"アウトバウンドメッセージ","e":"アウトバウンドメッセージは、ワークフロールールや承認プロセスなどからトリガーされ、外部システムに指定した情報をXMLメッセージとして送信するための機能です。画面作成やウィザード作成の機能はありません。"},{"k":"D","t":"フロービルダー","e":"正解です。フロービルダーの画面フローを使用することで、ユーザーにステップバイステップで情報を入力させるカスタム画面（ウィザードやフォーム）を作成し、入力されたデータに基づいてSalesforce内のレコード処理を自動化することができます。"}],"a":["D"]},{"n":41,"q":"DreamHouse Realtyは、戸建てとマンションの両方の販売のために定期的にオープンハウスを開催しています。マンションのオープンハウスの場合、いくつか追加のステップを踏む必要があります。エージェントは、管理組合に申請を提出し、承認を得ることができるようにする必要があります。管理者は、マンションのオープンハウスレコードを作成する際にのみ、これらの追加ステップが表示されるようにするにはどうすればよいですか？","o":[{"k":"A","t":"1つのページレイアウトを作成する。レコードタイプを使用して、適切な状況の選択リスト値が表示されるようにする。","e":"レコードタイプを使用して選択リストの値を制御することは可能ですが、ページレイアウトが1つしかない場合、マンション固有の追加ステップに必要な項目や関連リストなどを、戸建てとマンションで出し分けることができません。"},{"k":"B","t":"2つのページレイアウトを作成する。ビジネスプロセスとレコードタイプを使用して、適切な選択リスト値を表示する。","e":"正解です。戸建て用とマンション用の2つのページレイアウトを作成することで、マンションのレコードタイプが選択された場合にのみ追加のステップに関する項目を表示させることができます。さらに、レコードタイプを割り当てることで、それぞれに適した選択リストの値を制御することが可能になります。"},{"k":"C","t":"1つのページレイアウトを作成する。ビジネスプロセスを使用して、適切な状況の選択リスト値が表示されるようにする。","e":"ビジネスプロセスは特定のオブジェクトのライフサイクルを管理するために使用されますが、Aの選択肢と同様に、ページレイアウトが1つではレコード作成時に表示する項目や画面構成を要件に合わせて切り替えることができません。"},{"k":"D","t":"2つのページレイアウトを作成する。1つには戸建て状況項目、もう1つにはマンション状況項目を含める。","e":"2つのページレイアウトを作成する点は適切ですが、類似の目的を持つ別々のカスタム項目（状況項目）を作成することはデータ構造上推奨されません。同じ状況項目を共有し、レコードタイプによって選択可能な値を制御するのがベストプラクティスです。"}],"a":["B"]},{"n":42,"q":"Ursa Major Solarはケースにパスを設定しています。同社は、ユーザーがパス上にある状況の値に沿って進めることを義務付けたいと考えています。エージェントがケースを以前の状況に戻すことを禁止する必要があります。管理者はこの要求を満たすためにどの機能を使用するべきですか？","o":[{"k":"A","t":"入力規則","e":"正解です。入力規則を使用すると、数式を評価してレコードの保存を防ぐことができます。前の状況の値をチェックし、ユーザーがパスを逆戻りして以前の状況に変更しようとした場合にエラーメッセージを表示し、保存をブロックするという要件を満たすことができます。"},{"k":"B","t":"グローバル選択リスト","e":"グローバル選択リストは、複数の項目やオブジェクト間で選択リストの値を共有するための機能です。ユーザーによる状況項目の変更方向（後戻りの禁止）を制御する制限機能は持っていません。"},{"k":"C","t":"事前定義済み項目値","e":"事前定義済み項目値は、クイックアクションなどでレコードを作成または更新する際に、特定の項目に自動的にデフォルトの値を入力するための機能です。ユーザーが誤った状況に変更するのを防ぐような検証や制限を行う機能ではありません。"},{"k":"D","t":"連動選択リスト","e":"連動選択リストは、ある項目の選択値（制御項目）に応じて、別の項目（連動項目）で選択できる値を制限する機能です。単一の状況項目内で特定の順序でのみ値の変更を許可し、逆戻りをシステム的に完全に禁止するという要件には、入力規則を使用する必要があります。"}],"a":["A"]},{"n":43,"q":"管理者は、予定されている重要な更新を確認しました。管理者はこの重要な更新の有効化をどのように進めるべきですか？","o":[{"k":"A","t":"Sandboxで重要な更新を有効化する。","e":"正解です。重要な更新（リリース更新）はシステムの動作やセキュリティに大きな変更をもたらす可能性があるため、本番環境に適用する前に、まずSandbox環境で手動で有効化し、既存のカスタマイズや業務プロセスに影響がないかを徹底的にテストすることが推奨されるベストプラクティスです。"},{"k":"B","t":"重要な更新が自動的に有効化されるのを待つ。","e":"自動有効化の期日まで待つと、事前のテストが行われないまま本番環境に変更が直接適用されてしまい、既存の機能が予期せず動作しなくなるリスクがあるため推奨されません。"},{"k":"C","t":"本番環境で重要な更新を有効化する。","e":"Sandboxなどのテスト環境での事前検証なしに、直接本番環境で重要な更新を有効化すると、ユーザーの日常業務に重大な障害を引き起こす危険性があります。"},{"k":"D","t":"Sandboxで重要な更新が自動的に有効化されるのを待つ。","e":"Sandboxでテストを行うこと自体は正しいですが、自動有効化を待つのではなく、管理者が検証スケジュールに合わせて主体的に手動で有効化し、十分なテスト期間を確保するべきです。"}],"a":["A"]},{"n":44,"q":"DreamHouse Realtyは、保証作業に関する顧客からのリクエストを定期的に処理しており、顧客にケースを生成するためのセルフサービスオプションを提供したいと考えています。管理者はこの要件を満たすために、どの2つのソリューションを使用するべきですか？2つ選択してください。","o":[{"k":"A","t":"Web-to-ケース","e":"正解です。Web-to-ケースを使用すると、自社のWebサイトにカスタマイズ可能なフォームを埋め込み、顧客が自らフォームに入力して送信することで、直接Salesforce内にケースレコードを自動生成するセルフサービスチャネルを提供できます。"},{"k":"B","t":"ケースのエスカレーション","e":"ケースのエスカレーション（エスカレーションルール）は、ケースが一定時間解決されない場合に、指定されたユーザーやキューにケースを自動的に再割り当てし、通知するための内部的なサポートプロセスを管理する機能です。顧客向けのセルフサービスによるケース生成手段ではありません。"},{"k":"C","t":"ケースキュー","e":"ケースキューは、担当者が割り当てられる前のケースを一時的に保持し、チームで作業を共有するための機能です。レコードのルーティングや管理には役立ちますが、顧客が自身でケースを作成するための手段を提供するものではありません。"},{"k":"D","t":"メール-to-ケース","e":"正解です。メール-to-ケースを設定することで、顧客が指定されたサポート用のメールアドレスにメールを送信するだけで、その内容がSalesforce上で自動的にケースとして登録されます。これにより、顧客に使いやすいセルフサービス型のケース生成手段を提供できます。"}],"a":["A","D"]},{"n":45,"q":"別の財務システムからレコードをインポートして更新する際、管理者は識別子として何を使用するべきですか？","o":[{"k":"A","t":"自動採番項目","e":"自動採番項目は、Salesforce内でレコードが作成されるたびに自動的に一意の番号を割り当てる読み取り専用の項目です。データインポート時に外部システムのレコードとマッチングするための識別子として使用することはできません。"},{"k":"B","t":"外部ID","e":"正解です。外部ID属性を持つカスタム項目を作成することで、外部システム（別の財務システムなど）の一意の識別子をSalesforceに保存できます。データインポートウィザードやデータローダを使用してレコードをインポートおよび更新（Upsert）する際、この外部IDを照合キーとして使用し、既存のレコードを正確に特定して更新することができます。"},{"k":"C","t":"リッチテキスト項目","e":"リッチテキスト項目は、書式設定されたテキストや画像などを保存するための項目です。データのインポートや更新時にレコードを特定するための一意の識別子として設定することはできません。"},{"k":"D","t":"レコードID","e":"レコードIDはSalesforceが各レコードに自動的に割り当てる内部的な一意の識別子です。Salesforceから一度エクスポートしたデータを更新（Update）して戻す際には使用できますが、別の外部システムからデータを連携してインポートする際の外部用の識別子としては適していません。"}],"a":["B"]},{"n":46,"q":"管理者は、フローで後で使用するためにレコードタイプのIDを保存する必要があります。管理者はどの種類の変数を使用するべきですか？","o":[{"k":"A","t":"ブール変数","e":"TrueまたはFalseの値を保存するための変数です。文字や数字の組み合わせであるレコードタイプのIDを保存するためには使用できません。"},{"k":"B","t":"テキスト変数","e":"文字列を保存するための変数です。Salesforceの実際の仕様では、レコードIDやレコードタイプID（15桁または18桁の英数字）をフロー内で保存するためには、このテキスト変数を使用します。"},{"k":"C","t":"ID変数","e":"提供された解答では正解となっていますが、Salesforceのフロー機能において「ID」という専用のデータ型の変数は存在しません。実際のシステム設定でIDを保存する場合は、Bのテキスト変数を使用することが正しいアプローチとなります。"},{"k":"D","t":"レコード変数","e":"Salesforceの特定のレコード全体（そのレコードに含まれる複数の項目の値を含む）をまとめて保存するための変数です。レコードタイプのIDという単一の値のみを保存する目的には適していません。"}],"a":["C"]},{"n":47,"q":"管理者は、ユーザーのグループに、ユーザーインターフェースログインの2要素認証権限とAPIログインの2要素認証権限を持つ権限セットグループを割り当てました。ユーザーの1人がデータローダにログインしようとしたとき、どの2つのプロンプトが発生しますか？ 2つ選択してください。","o":[{"k":"A","t":"ユーザーは認証アプリケーションをSalesforceアカウントに接続する必要があります。","e":"正解です。多要素認証（2要素認証）が必須となっている場合、ログインを完了するためにはSalesforce Authenticatorなどの認証アプリケーションをユーザー自身のアカウントに紐づけて接続し、検証プロセスを有効化するためのプロンプトが表示されます。"},{"k":"B","t":"ユーザーは「私のセキュリティトークンのリセット」を使用して、信頼できるネットワークからセキュリティトークンを取得する必要があります。","e":"セキュリティトークンは信頼済みIP範囲外からAPI経由（データローダなど）でアクセスする際にパスワードに付加して使用する場合がありますが、2要素認証の初期設定や接続そのものを完了させるために表示されるプロンプトとは異なります。"},{"k":"C","t":"ユーザーはモバイルデバイスに認証アプリケーションをダウンロードしてインストールする必要があります。","e":"アプリを持っていないユーザーにとっては必要な準備手順となりますが、Salesforceのシステム画面上で直接表示されるプロンプトの主な目的は「アカウントへの接続」であり、アプリのダウンロードやインストールそのものを要求するシステムプロンプトではありません。"},{"k":"D","t":"ユーザーは、優先順位が高い方のメールまたはSMSからの確認コードを入力する必要があります。","e":"正解です。ログインの試行時、特に新しいデバイスや場所からのアクセスで認証プロセスが完全に設定されていない場合、セキュリティ検証の手段として、登録済みのメールアドレスやSMSに送信された確認コード（ワンタイムパスワード）の入力を求めるプロンプトが表示されることがあります。"}],"a":["A","D"]},{"n":48,"q":"営業マネージャーは、商談のフェーズに基づいて重要な値を表示するために実装できる機能を知りたいと考えています。管理者は要件を満たすためにどのツールを使用するべきですか？","o":[{"k":"A","t":"動的フォーム","e":"動的フォームは、Lightningレコードページ上で項目やセクションの表示と非表示を特定の条件に基づいて制御できる機能ですが、商談プロセスの視覚的なガイドとして特定の段階の重要な情報を強調表示する「パス」の目的とは異なります。"},{"k":"B","t":"パスの重要な項目","e":"正解です。パス機能を使用すると、商談の各フェーズにおいて入力や確認が必要な「重要な項目」を最大5つまで指定することができます。これにより、担当者が該当するフェーズに到達した際に、重要な値がパスのすぐ下の画面上に強調して表示されます。"},{"k":"C","t":"商談プロセス","e":"商談プロセスは、特定のレコードタイプに関連付けられる商談フェーズの選択リスト値を定義および制御するための機能です。フェーズに応じて特定の項目値を画面に表面化させる役割は持っていません。"},{"k":"D","t":"ワークフロールール","e":"ワークフロールールは、特定の条件に基づいて項目の自動更新、メールアラート、ToDoの割り当てなどのバックグラウンド処理を実行するための自動化機能です。画面のUI上で重要な項目を目立たせて表示するためのツールではありません。"}],"a":["B"]},{"n":49,"q":"Cloud Kicks (CK) は、商談が製品エンジニアリングの担当者によってレビューされるべきかどうかを、Needs Reviewというチェックボックス項目で取り込みます。CKには、商談にProduct Typeの選択リスト項目もあります。営業担当者が商談を保存するとき、Product Typeを選択するか、Needs Reviewボックスにチェックを入れる必要があります。管理者はこれを達成するために何を使用するべきですか？","o":[{"k":"A","t":"保存前フロー","e":"保存前フローはレコードがデータベースに保存される前に項目値を自動的に更新するためには有用ですが、ユーザーに対して特定の項目の入力を強制したり、条件に応じてエラーメッセージを表示したりするための最適なツールではありません。"},{"k":"B","t":"入力規則","e":"正解です。入力規則を使用すると、ユーザーがレコードを保存する前に特定の条件（この場合は商品タイプの選択、またはレビューが必要チェックボックスのオンのいずれかが満たされているか）を評価する数式を作成できます。条件が満たされていない場合にエラーメッセージを表示して保存をブロックし、ユーザーに適切な入力を促すことができます。"},{"k":"C","t":"ワークフロールール","e":"ワークフロールールは、特定の条件を満たしたときに項目の自動更新やメールアラートなどのアクションを実行する機能です。ユーザーの入力を検証してレコードの保存をブロックする機能は持っていません。"},{"k":"D","t":"必須項目","e":"ページレイアウトや項目レベルで項目を必須に設定すると、レコード保存時に常にその項目への入力が求められます。今回のような、どちらか一方が入力されていればよいという条件付きの必須ロジックを実装することはできません。"}],"a":["B"]},{"n":50,"q":"cloud kicksの商談が成約したときに、会社は更新商談を自動的に作成したいと考えています。管理者がこの要請を達成するために使用すべき2つの自動化ツールはどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"承認プロセス","e":"承認プロセスは、特定のレコードに対する承認申請の経路やステップを自動化するための機能です。新しい商談レコードを自動的に作成する機能は持っていません。"},{"k":"B","t":"Flow Builder","e":"正解です。フロービルダーはSalesforce内で複雑なビジネスプロセスを自動化するための強力なツールです。商談が成約したタイミングでトリガーされるフローを作成し、新しい更新商談レコードを自動的に作成することができます。"},{"k":"C","t":"ワークフロールール","e":"ワークフロールールは、特定の条件を満たしたときに項目の自動更新、メールアラート、ToDoの割り当て、アウトバウンドメッセージなどのアクションを実行するための機能です。新しいレコードを作成することはできません。"},{"k":"D","t":"プロセスビルダー","e":"正解です。プロセスビルダーは、レコードが作成または編集されたときに自動的に特定のアクションをトリガーできるツールです。商談が成約したという条件に基づいて、新しいレコードを作成するアクションを設定することができるため、この要件を満たすことができます。"}],"a":["B","D"]},{"n":51,"q":"Cloud Kicksのサポートエージェントは、ケースを解決するためのリソースを見つけるのに時間をかけすぎています。エージェントは、ケースのページレイアウトからドキュメントや類似のケースを見つけるための、より効率的な方法を必要としています。管理者はこの要件を満たすためにどうすればよいですか？","o":[{"k":"A","t":"一般的なケースの解決策を記録するためのカスタムオブジェクトを作成する。","e":"一般的なケースの解決策を記録するためにカスタムオブジェクトを作成することは可能ですが、エージェントがケースのページレイアウトから直接類似のケースやドキュメントを検索して参照するという、効率的な情報検索の要件を満たすための標準的なベストプラクティスではありません。"},{"k":"B","t":"インタビューフローを使用してケースの詳細を記録する。","e":"フローはユーザーからデータを収集したりビジネスプロセスを自動化したりするのには役立ちますが、過去の解決策やドキュメントを検索してエージェントに提示するためのデータベースとしての機能は提供しません。"},{"k":"C","t":"類似のケースを探すために、ユーザーをグローバル検索に誘導する。","e":"グローバル検索を使用すると組織全体のデータを検索できますが、ケースのページレイアウト内で現在のレコードに関連するドキュメントや類似ケースを直接かつ自動的に提示する機能ではないため、エージェントの作業効率を最大化するソリューションとしては不十分です。"},{"k":"D","t":"記事とデータカテゴリを使用してナレッジを設定する。","e":"正解です。Salesforceナレッジを有効にし、記事とデータカテゴリを適切に設定することで、エージェントはケースのページレイアウトに配置されたナレッジコンポーネントから直接、関連するドキュメントや過去の解決策をすばやく検索して参照できるようになります。これによりケース解決の効率が大幅に向上します。"}],"a":["D"]},{"n":52,"q":"Universal Containersは、取引先がセールスコンソールとサービスコンソールで表示されるときに、異なるLightningページが表示されることを必要としています。管理者はこの要件をどのように満たすべきですか？","o":[{"k":"A","t":"ページレイアウトの割り当てを更新する。","e":"ページレイアウトは、レコードの詳細や関連リストの項目配置を制御する機能ですが、Lightningページ全体の表示をアプリケーションごとに切り替えるための設定ではありません。"},{"k":"B","t":"複数のレコードタイプを定義する。","e":"レコードタイプは、異なるビジネスプロセスや選択リスト値、ページレイアウトを提供するために使用されますが、アプリケーションに基づいてLightningページを動的に切り替える要件を満たすための直接的な設定ではありません。"},{"k":"C","t":"Lightningページをアプリケーションのデフォルトとして割り当てる。","e":"正解です。LightningアプリケーションビルダーでLightningページを有効化する際、アプリケーションのデフォルトとしてページを割り当てることで、特定のアプリケーション（この場合はセールスコンソールやサービスコンソール）を使用しているときに専用のLightningレコードページを表示させることができます。"},{"k":"D","t":"異なるユーザープロファイルを作成する。","e":"プロファイルはユーザーのアクセス権や権限を制御するものです。プロファイルごとにLightningページを割り当てることは可能ですが、同一ユーザーが異なるコンソールを開いた際に表示を切り替えるという今回の要件には、アプリケーションのデフォルト割り当てを使用するのが適切です。"}],"a":["C"]},{"n":53,"q":"Aw Computingは、商談が失注したときに、リッチテキスト項目で失注理由を取り込む必要があります。管理者はこの要件をどのように設定する必要がありますか？","o":[{"k":"A","t":"ページレイアウトで失注理由項目の横にある必須チェックボックスを選択する。","e":"ページレイアウトで項目を必須にすると、レコードを保存するたびに常にその項目への入力が求められるようになります。今回のように商談が「失注」フェーズになったときのみ必須にするという条件付きの要件は満たせません。"},{"k":"B","t":"フェーズが失注で失注理由が空白の場合にエラーを表示する入力規則を作成する。","e":"正解です。入力規則を使用すると、特定の条件（フェーズが失注かつ失注理由項目が空白）を満たしたときにエラーメッセージを表示し、レコードの保存を防ぐことができます。これにより、特定のフェーズでのみ項目の入力を強制することができます。"},{"k":"C","t":"オブジェクトマネージャーで失注理由項目の必須チェックボックスをオンにする。","e":"オブジェクトレベル（項目定義）で項目を必須に設定すると、システム全体で常にその項目の入力が必須になります。特定のフェーズに基づいた条件付きの必須化はできません。"},{"k":"D","t":"失注理由が空白の場合にエラーを表示するワークフロールールを設定する。","e":"ワークフロールールは、レコードが特定の条件を満たしたときにメールアラートやToDoの作成などのアクションを自動化する機能であり、ユーザーに対してエラーメッセージを表示して入力チェックを行う機能ではありません。"}],"a":["B"]},{"n":54,"q":"Universal Containerの管理者は、salesforceにブランディングを追加したいと考えています。管理者が留意すべき2つの考慮事項はどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"一度に有効にできるテーマは1つだけであり、テーマは組織全体に適用されます。","e":"正解です。組織で一度に有効にできるテーマは1つのみで、そのテーマは組織全体のユーザーに適用されます。プロファイルやユーザーごとに異なるテーマを割り当てることはできません。"},{"k":"B","t":"テーマはsalesforce classicおよびsalesforceモバイルアプリケーションに適用されます。","e":"組織のテーマおよびブランド設定はLightning Experienceにのみ適用されます。Salesforce Classicやモバイルアプリケーションの画面には適用されません。"},{"k":"C","t":"組み込みのテーマから、最大150のカスタムテーマを作成、変更、またはコピーできます。","e":"カスタムテーマは組織につき最大300個まで作成、変更、またはコピーすることができます。150個ではありません。"},{"k":"D","t":"Chatter外部ユーザーには、組み込みのLightningテーマのみが表示されます。","e":"正解です。Chatter外部ユーザーがログインした場合、組織で設定されたカスタムテーマは適用されず、常にデフォルトの組み込みのLightningテーマが表示されます。"}],"a":["A","D"]},{"n":55,"q":"Ursa Major Solarの管理者は、顧客の保証ケース用に新しいレコードタイプを作成しました。ユーザーに新しいレコードタイプを表示するために、管理者が使用すべき2つの割り当てはどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"プロファイルの割り当て","e":"正解です。ユーザーが新しいレコードタイプを選択して使用できるようにするには、そのレコードタイプをユーザーのプロファイルに割り当てる必要があります。これにより、特定のプロファイルを持つユーザーに対してレコードタイプへのアクセス権を付与し、表示させることができます。"},{"k":"B","t":"ロールの割り当て","e":"ロール階層は他のユーザーが所有するレコードへのアクセス権を広げるため（レコードレベルのセキュリティ）に使用するものであり、レコードタイプを利用可能にするための割り当て機能ではありません。"},{"k":"C","t":"アプリケーションマネージャーの割り当て","e":"アプリケーションマネージャーは、アプリケーションに含まれるタブや、どのプロファイルにアプリケーションを割り当てるかを制御するための機能です。特定のレコードタイプをユーザーに表示させるための割り当て設定を行う場所ではありません。"},{"k":"D","t":"ページレイアウトの割り当て","e":"正解です。プロファイルにレコードタイプを割り当てることに加えて、そのレコードタイプが選択されたときにどのページレイアウトを表示するかを、プロファイルとレコードタイプの組み合わせごとに割り当てる必要があります。これにより、対象のレコードタイプに応じた適切な画面が表示されます。"}],"a":["A","D"]},{"n":56,"q":"Cloud Kicksのサポートマネージャーは、顧客にできるだけ早く対応したいと考えています。マネージャーは、顧客の問題解決に役立つ可能性のあるトラブルシューティングのヒントの上位5つを返信に含めるよう要求しました。この要件を満たすために、管理者は何を提案するべきですか？","o":[{"k":"A","t":"自動レスポンスルール","e":"自動レスポンスルールは、Web-to-ケースやEmail-to-ケースなどからケースが作成された際に、顧客に自動的に初期応答メールを送信する機能です。用意された静的なテンプレートを送信するため、顧客の個別の問題に応じたトラブルシューティング手順を動的に含めるという要件には適していません。"},{"k":"B","t":"メールアラート","e":"メールアラートは、レコードが特定の条件を満たしたときにメールを自動送信するアクションです。自動レスポンスルールと同様に固定のメールテンプレートを使用するため、サポートエージェントが状況に合わせて具体的なトラブルシューティングのヒントを選択して提供する用途には向いていません。"},{"k":"C","t":"ナレッジ記事","e":"正解です。ナレッジ記事としてトラブルシューティングのヒントを作成および管理することで、サポートエージェントはケースの対応中に適切な記事を検索し、その内容を顧客への返信に直接かつ迅速に挿入できます。これにより、顧客へ効率的に解決策を提示することが可能になります。"},{"k":"D","t":"割り当てルール","e":"割り当てルールは、特定の条件に基づいて新しく作成されたケースやリードを適切な担当者またはキューに自動的に振り分けるための機能です。顧客への返信内容を作成したり、トラブルシューティングの情報を提供したりする機能ではありません。"}],"a":["C"]},{"n":57,"q":"Northern Trail Outfittersは、すべてのマーケティングユーザーに1つのプロファイルを使用しており、キャンペーンオブジェクトへの参照のみのアクセス権を提供しています。現在、一部のマーケティングユーザーがキャンペーンに関する包括的な編集アクセス権を必要としています。管理者はこの要請をどのように満たすべきですか？","o":[{"k":"A","t":"権限セット","e":"正解です。権限セットは、ユーザーのベースとなるプロファイルにアクセス権や権限を追加するために使用されます。プロファイル全体を変更して全員に権限を与えてしまうことなく、プロファイルを共有している一部の特定のユーザーにのみオブジェクトへの追加の編集アクセス権を付与するための最適なソリューションです。"},{"k":"B","t":"組織の共有直接設定","e":"組織の共有直接設定は、組織内のすべてのユーザーに対してレコードに対する基本レベルのアクセス権(公開、非公開など)を定義するものです。特定のユーザーにオブジェクト自体の編集権限を付与するための機能ではありません。"},{"k":"C","t":"マーケティングユーザーチェックボックス","e":"マーケティングユーザーチェックボックスは、ユーザーがキャンペーンレコードを作成、削除、および管理するための機能ライセンスを付与するものですが、ユーザーにオブジェクトへの「編集」権限を直接付与するものではありません。ユーザーがキャンペーンを編集するには、チェックボックスの有効化に加えて、プロファイルまたは権限セットでのオブジェクトアクセス権(作成、編集など)が必要です。今回の要件のように一部のユーザーに追加のオブジェクトアクセス権を付与する場合は、権限セットを使用します。"},{"k":"D","t":"項目レベルセキュリティ","e":"項目レベルセキュリティは、特定のプロファイルや権限セットに対して、レコード内の個々の特定の項目(フィールド)の表示や編集を制御する機能です。キャンペーンオブジェクト全体に対する包括的なアクセス権を付与するための機能ではありません。"}],"a":["A"]},{"n":58,"q":"Northern Trail Outfittersには2つの異なるセールスプロセスがあります。1つは4つのフェーズを持つビジネス商談用、もう1つは8つのフェーズを持つパートナー商談用です。両方のプロセスは、ページレイアウトと選択リスト値のオプションが異なります。管理者はこれらの要件を満たすために何を設定する必要がありますか？","o":[{"k":"A","t":"ユーザーが正確な商談フェーズ情報を入力していることを確認する入力規則。","e":"入力規則は、ユーザーがレコードを保存する前にデータが特定の条件を満たしているかを検証するものです。複数のフェーズ、ページレイアウト、および選択リスト値を商談のタイプごとに管理および制御するための機能ではありません。"},{"k":"B","t":"商談タイプの選択リスト値を制御する異なるページレイアウト。","e":"ページレイアウトはレコードの詳細画面や項目の配置を制御しますが、選択リストで利用可能な値そのものを制御したり、商談のフェーズ群であるセールスプロセスを定義したりすることはできません。選択リスト値の制御にはレコードタイプを使用する必要があります。"},{"k":"C","t":"商談のレコードタイプとセールスプロセスを制限する公開グループ。","e":"公開グループはレコードの共有ルールなどでアクセス権を付与するために使用されるものであり、レコードタイプやセールスプロセスのユーザーへの割り当てを制御する機能ではありません。割り当てはプロファイルなどを通じて行います。"},{"k":"D","t":"異なるタイプの商談用に別々のレコードタイプとセールスプロセス。","e":"正解です。商談オブジェクトにおいて、ビジネスプロセスごとに異なるフェーズセット（セールスプロセス）、異なる選択リスト値、および対応するページレイアウトを提供するには、個別のセールスプロセスを作成し、それらを異なるレコードタイプに関連付ける設定方法が必須となります。"}],"a":["D"]},{"n":59,"q":"管理者がSalesforceオブジェクトを使用する際に留意すべき2つの考慮事項は何ですか？2つの回答を選択してください。","o":[{"k":"A","t":"カスタムオブジェクトと標準オブジェクトには標準項目がある。","e":"正解です。すべてのオブジェクトには、ID、作成日、最終更新日などの標準項目がデフォルトで含まれています。"},{"k":"B","t":"標準オブジェクトはSalesforceに含まれている。","e":"正解です。標準オブジェクト(取引先、取引先責任者、商談など)は、Salesforceのプラットフォームに最初から組み込まれて提供されています。"},{"k":"C","t":"新しい標準オブジェクトを作成できる。","e":"組織の独自の要件に合わせて新しく作成できるのはカスタムオブジェクトのみです。ユーザーが新しい標準オブジェクトを作成することはできません。"},{"k":"D","t":"標準オブジェクトのみが主従関係をサポートする。","e":"カスタムオブジェクトも主従関係をサポートしています。カスタムオブジェクトを主、または従として主従関係を構築することが可能です。"}],"a":["A","B"]},{"n":60,"q":"AW Computingの管理者は、Salesforceへのログインに問題があるユーザーの対応をしています。ユーザーがログインできない理由を特定するために、管理者は何を行うべきですか？","o":[{"k":"A","t":"セキュリティトークンを確認する。","e":"セキュリティトークンはAPIアクセスや信頼されていないネットワークからのログイン時に使用されますが、ユーザーが通常のユーザーインターフェースからログインできない具体的な理由（パスワード間違い、アカウントのロックアウトなど）を直接特定するためのログや機能ではありません。"},{"k":"B","t":"パスワード履歴を確認する。","e":"パスワード履歴は、ユーザーが過去に使用したパスワードを再利用できないように制限するための設定に関するものであり、現在のログイン失敗のステータスや理由を確認するための機能ではありません。"},{"k":"C","t":"パスワードポリシーを確認する。","e":"パスワードポリシーはパスワードの長さや有効期限などの組織全体のルールを定義する設定です。設定内容がログイン問題の背景となることはありますが、個別のユーザーがいつ、なぜログインに失敗したのかという具体的な記録を確認できる場所ではありません。"},{"k":"D","t":"ログイン履歴を確認する。","e":"正解です。ユーザーレコードの関連リスト、または設定のログイン履歴を確認することで、ユーザーのログイン試行のステータス（成功、無効なパスワード、ロックアウトなど）やアクセス元のIPアドレスなどを正確に把握し、トラブルシューティングを行うことができます。"}],"a":["D"]},{"n":61,"q":"Universal Containers (UC) には、UCカスタマーサポートチームが作業する必要があるToDoを管理するために使用されるキューがあります。同じチームが今後、UCのケースのいくつかを作業することになります。管理者はサポートチームを支援するためにどの2つのオプションを使用するべきですか？2つの回答を選択してください。","o":[{"k":"A","t":"フローを設定して、ケースをキューに割り当てる。","e":"フローを使用してレコードの所有者をキューに変更することは技術的に可能ですが、ケースのルーティングやキューへの割り当てを行うための標準的なベストプラクティスとしては、専用の機能である割り当てルールを使用する方が適しています。"},{"k":"B","t":"割り当てルールを使用して、キューをケースの所有者として設定する。","e":"正解です。割り当てルールは、特定の条件に基づいて新しく作成されたケースの所有者を適切なユーザーまたはキューに自動的に割り当てるための標準機能であり、この要件に最適です。"},{"k":"C","t":"既存のキューに利用可能なオブジェクトとしてケースを追加する。","e":"正解です。既存のカスタマーサポートチーム用のキューは現在ToDoを管理するように設定されているため、ケースもそのキューに割り当て可能にするには、キューのサポートされるオブジェクトのリストにケースオブジェクトを追加する必要があります。"},{"k":"D","t":"新しいキューを作成し、利用可能なオブジェクトとしてケースを追加する。","e":"要件では同じチームが対応すると指定されているため、既存のチームのキューのサポートオブジェクトを編集してケースを追加するアプローチの方が、新しいキューを作成するよりも管理が簡素化され適切です。"}],"a":["B","C"]},{"n":62,"q":"Cloud Kicksは、アプリが自社のニーズを満たしているか確認するために、AppExchangeからアプリを試用したいと考えています。管理者が提案すべき2つのオプションはどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"本番組織でテストドライブする。","e":"テストドライブは、アプリケーションの機能を確認するためにプロバイダーが用意した読み取り専用の環境を使用するものであり、自社の本番組織で試用するものではありません。本番環境に直接テスト用のアプリをインストールすることはシステムの安定性を損なうリスクがあります。"},{"k":"B","t":"Trailhead Playgroundにダウンロードする。","e":"正解です。Trailhead Playgroundは無料の開発環境として機能するため、自社の本番環境に影響を与えることなくAppExchangeのアプリをインストールし、安全に動作検証やテストを行うための独立した環境として利用できます。"},{"k":"C","t":"Sandboxにインストールする。","e":"正解です。Sandboxは本番組織のコピー環境であるため、自社の実際のデータモデルや既存のカスタマイズ設定の中でアプリがどのように機能するかを、本番環境にリスクを与えることなく安全かつ正確にテストすることができます。"},{"k":"D","t":"エディションの互換性を確認する。","e":"エディションの互換性を確認することはアプリを導入する前の重要な事前確認ステップですが、アプリを実際に試用してニーズを満たしているかを確認するためのテスト環境や具体的な試用手段を提供するものではありません。"}],"a":["B","C"]},{"n":63,"q":"AW ComputingのCTOは、顧客満足度を向上させるためのケースに関する新しいポリシーを定義しました。ケース理由が「インストール」で送信されたすべてのケースは、メールですぐに受付確認され、適切なエージェントに割り当てられる必要があります。4時間経過しても「新規」ステータスのままであるケースは、サポート管理チームにエスカレーションされる必要があります。この要件のために利用する必要があるケース管理ツールはどれですか？","o":[{"k":"A","t":"自動レスポンスルール、マクロ、エンタイトルメント","e":"マクロはユーザーが手動でトリガーして反復的な操作を自動化する機能であり、時間が経過した際に自動でアクションを起こすエスカレーションの要件には対応できません。"},{"k":"B","t":"自動レスポンスルール、キュー、マクロ","e":"提供された問題の解答はBとなっていますが、マクロでは4時間後にステータスが「新規」のままである場合に自動的にエスカレーションするという、システム主導の時間ベースの要件を満たすことができません。"},{"k":"C","t":"自動レスポンスルール、キュー、エスカレーションルール","e":"正解です。メールでの即時の受付確認には自動レスポンスルール、適切な担当者への初期割り当て先としてはキュー、4時間後のサポート管理チームへの自動ルーティングにはエスカレーションルールがそれぞれ使用されます。これが要件を完全に満たす正しい機能の組み合わせです。"},{"k":"D","t":"自動レスポンスルール、エンタイトルメント、エスカレーションルール","e":"エンタイトルメントはカスタマーサポートのSLAなどを定義・管理するために使用されますが、今回の要件である「適切なエージェントに割り当てる」ためのキューが含まれていないため、最適な組み合わせではありません。"}],"a":["C"]},{"n":64,"q":"オブジェクトマネージャーで項目を必須としてマークする際の考慮事項となる2つの機能はどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"そのオブジェクトでAPIを介してレコードを保存する場合、その項目は必須ではありません。","e":"オブジェクトマネージャーで項目を必須（普遍的に必須）に設定した場合、ユーザーインターフェースからだけでなく、データローダなどのAPIを介したレコードの保存時にも必ずその項目の値が必要になります。したがって、必須ではないとするこの記述は誤りとなります。"},{"k":"B","t":"そのオブジェクトでレコードを保存する場合、その項目は全体で必須になります。","e":"この記述は正しいです。オブジェクトマネージャー（項目レベル）で必須チェックボックスをオンにすると、ページレイアウト、API、Web-to-リードなど、レコードが作成または保存されるすべての経路でその項目が普遍的に必須となります。"},{"k":"C","t":"その項目は、そのオブジェクトのすべてのページレイアウトに追加されます。","e":"この記述は正しいです。項目が全体で必須として設定されると、Salesforceは自動的にそのオブジェクトのすべてのページレイアウトにその項目を追加し、ページレイアウト上から削除できないようにします。"},{"k":"D","t":"Web-to-リードおよびWeb-to-ケースを介してレコードを保存する場合、その項目はオプションです。","e":"項目が全体で必須に設定されている場合、Web-to-リードやWeb-to-ケースのフォーム経由であってもその項目の入力は必須要件となり、オプションとして扱うことはできません。"}],"a":["B","C"]},{"n":65,"q":"ユーザーがユーザーインターフェースを介してSalesforceにログインするとき、システムは認証のためにどの2つの設定をチェックしますか？2つの回答を選択してください。","o":[{"k":"A","t":"ユーザーのAPIログインの2要素認証権限","e":"この権限はデータローダや外部連携システムからのAPIアクセス時の認証プロセスを制御するものであり、ユーザーインターフェースからのログイン時の認証チェックには適用されません。"},{"k":"B","t":"ロールのIPアドレス制限","e":"SalesforceのIPアドレス制限は、プロファイルレベルでのログインIP制限、または組織全体のネットワークアクセス設定で定義されます。ロールに基づいてIPアドレス制限を設定することはできません。"},{"k":"C","t":"ユーザーのプロファイルのログイン時間制限","e":"正解です。ユーザーがログインを試みると、システムはまずそのユーザーのプロファイルに設定されているログイン時間の制限をチェックし、現在が許可された時間帯であるかを確認します。"},{"k":"D","t":"ユーザーのユーザーインターフェースログインの2要素認証権限","e":"正解です。システムはユーザーインターフェースを介したログイン時に、プロファイルや権限セットで多要素認証（2要素認証）が要求されているかをチェックし、設定されている場合は追加の認証を求めます。"}],"a":["C","D"]},{"n":66,"q":"Cloud Kicksの管理者は、新しいクラウドシューズの返品を追跡するための新しい項目を作成しました。ユーザーは、新しい項目が利用できないことを示すケースを管理者に送信しました。この問題をトラブルシューティングするために、管理者が行うべき2つのステップはどれですか？2つの回答を選択してください。","o":[{"k":"A","t":"ユーザーのプロファイルのページレイアウトが更新されていることを確認する。","e":"正解です。項目が作成されていても、ユーザーに割り当てられているページレイアウトにその項目が配置されていない場合、ユーザーはその項目を表示したり入力したりすることができません。そのため、ページレイアウトの確認がトラブルシューティングの重要な最初のステップとなります。"},{"k":"B","t":"組織の設定変更履歴を実行する。","e":"設定変更履歴は、過去に行われた設定の変更内容（誰がいつ項目を作成したかなど）を監査するための機能であり、現在ユーザーが項目を利用できない直接的な原因を特定して解決するためのトラブルシューティングの手順ではありません。"},{"k":"C","t":"オブジェクトの組織の共有直接設定を更新する。","e":"組織の共有直接設定は、ユーザーが他のユーザーのレコード自体にアクセスできるかどうか（レコードレベルのアクセス権）を制御するものです。レコード内の特定の項目の表示・非表示（項目レベルのアクセス権）を制御するものではありません。"},{"k":"D","t":"ユーザープロファイルに対する項目の項目レベルセキュリティを確認する。","e":"正解です。項目レベルセキュリティによって、特定のユーザープロファイルに対してその項目の参照アクセス権や編集アクセス権が付与されていない場合、ページレイアウトに項目が存在していても画面には表示されません。プロファイルの項目権限を確認することが必須のステップです。"}],"a":["A","D"]},{"n":67,"q":"Northern Trail Outfittersは、商談の主要な利害関係者である取引先責任者のROIを追跡したいと考えています。営業担当副社長は、この情報が商談上でアクセス可能であり、レポートで利用できるように要求しました。管理者はこれらの要件を満たすためにどの2つのオプションを設定するべきですか？2つの回答を選択してください。","o":[{"k":"A","t":"キャンペーンメンバーの役割をカスタマイズする。","e":"キャンペーンメンバーの役割は、取引先責任者やリードが特定のキャンペーンにどのように関与しているか（送信済み、レスポンスありなど）の状況を定義するものです。商談における主要な利害関係者を追跡する要件には適していません。"},{"k":"B","t":"商談ページレイアウトにキャンペーンメンバー関連リストを追加する。","e":"キャンペーンメンバーはキャンペーンオブジェクトに関連付けられるレコードです。商談オブジェクトのページレイアウトに直接追加して、商談に対する取引先責任者の関与を追跡するための関連リストとしては機能しません。"},{"k":"C","t":"キャンペーンの役割をカスタマイズする。","e":"キャンペーンの役割という設定は存在せず、また、今回の要件はキャンペーンではなく商談に対する取引先責任者の役割を追跡することであるため、このアプローチは誤りです。"},{"k":"D","t":"商談の取引先責任者の役割をカスタマイズする。","e":"正解です。商談の取引先責任者の役割（Opportunity Contact Role）の選択リスト値をカスタマイズして、ビジネス要件に合った役割（意思決定者、エグゼクティブスポンサーなど）を追加することで、特定の取引先責任者が商談にどのように関与しているかを正確に追跡し、レポートで分析できるようになります。"},{"k":"E","t":"商談ページレイアウトに商談の取引先責任者の役割関連リストを追加する。","e":"正解です。ユーザーが商談レコードの画面上で、利害関係者である取引先責任者とその役割を簡単に確認および追加できるようにするには、商談のページレイアウトに「取引先責任者の役割」関連リストを追加して表示させる必要があります。"}],"a":["D","E"]},{"n":68,"q":"Northern Trail Outfittersには、新しい取引先が作成されたときに項目値を自動的に設定する新しいフローがあります。そのフローはプロセスによって起動されますが、適切に機能していません。管理者は問題を特定するために何をするべきですか？","o":[{"k":"A","t":"Flow Builderのネイティブデバッグ機能を使用する。","e":"正解です。フロービルダーには、フローの実行経路や変数の値、エラーの詳細をステップごとに視覚的に確認できる強力なデバッグ機能が標準で備わっています。プロセスから起動されるフローのトラブルシューティングにおいて、入力変数を指定してこのデバッグ機能を使用することで、どこで問題が発生しているかを最も効率的に特定できます。"},{"k":"B","t":"ログインレベルでデバッグログを確認する。","e":"デバッグログはシステム全体の詳細な処理プロセスを追跡するために役立ちますが、フロー内の特定のエラーや変数の状態を視覚的かつ直感的にトラブルシューティングするためには、Flow Builder内のネイティブデバッグ機能を使用する方がはるかに効率的かつ推奨されるアプローチです。"},{"k":"C","t":"設定変更履歴を表示してエラーを確認する。","e":"設定変更履歴は、組織の設定変更（誰がいつどの設定を変更したか）を追跡するための監査ログです。フローの実行時エラーや動作不良の技術的な原因を特定するためのツールではありません。"},{"k":"D","t":"メールログを設定して送信エラーログを確認する。","e":"メールログは、Salesforce組織から送信されたメールの配信ステータスを追跡するための機能です。今回の要件はレコードの項目値を更新するフローの問題特定であるため、メールログを確認してもフローのトラブルシューティングには役立ちません。"}],"a":["A"]},{"n":69,"q":"Cloud Kicksは、リードソースが選択されている場合にのみ、ユーザーが商談のフェーズで成約を選択できるようにしたいと考えています。管理者はこの目標をどのように達成するべきですか？","o":[{"k":"A","t":"リードソースを商談のフェーズ項目の連動選択リストにする。","e":"連動選択リストは、制御項目の値に基づいて連動項目の選択肢を絞り込む機能です。特定のフェーズの時に別の項目の入力を必須にするという要件を満たすための機能ではありません。"},{"k":"B","t":"フェーズが成約に設定されている場合、リードソースを必要とする入力規則を設定する。","e":"正解です。入力規則を使用すると、ユーザーがレコードを保存する前にデータが特定の条件を満たしているかを評価できます。フェーズが成約で、かつリードソースが空白の場合にエラーを表示させる数式を作成することで、この要件を正確に満たすことができます。"},{"k":"C","t":"ページレイアウト上で商談のフェーズ項目を参照のみに変更する。","e":"フェーズ項目を参照のみにしてしまうと、ユーザーは商談の進行に合わせてフェーズを一切更新できなくなってしまいます。条件付きで特定の項目の入力を必須にする要件には適していません。"},{"k":"D","t":"商談のフェーズをリードソース項目の連動選択リストに変更する。","e":"連動選択リストは選択肢の表示を制御するものであり、入力必須化を行うためのツールではありません。さらに、標準の商談のフェーズ項目は制御項目として機能することはできますが、連動項目として設定することはできません。"}],"a":["B"]},{"n":70,"q":"Cloud Kicks (CK) は、特定の顧客に関する情報を取引先責任者に保存し、靴やアクセサリーに関する情報をカスタムのMerchandiseオブジェクトに保存します。CKの管理者は、取引先責任者が複数のMerchandiseに関心を持つことができることを表すために何を使用するべきですか？","o":[{"k":"A","t":"階層列","e":"階層列（階層カスタム項目）はユーザーオブジェクトに特有の機能であり、ユーザー同士の階層関係を関連付けるために使用されます。取引先責任者とカスタムオブジェクトを関連付けるためには使用できません。"},{"k":"B","t":"参照フィルター","e":"参照フィルターは、参照関係で選択できるレコードを特定の条件で制限するための機能です。これ自体が多対多の関係を作成するものではありません。"},{"k":"C","t":"数式項目","e":"数式項目は、他の項目の値や関数を使用して値を自動計算するための機能です。異なるオブジェクト間のレコードを関連付けるデータベースのリレーションシップを構築する機能ではありません。"},{"k":"D","t":"連結オブジェクト","e":"正解です。取引先責任者とMerchandiseオブジェクトの間に連結オブジェクトを作成することで、多対多の関係を構築できます。これにより、1人の取引先責任者が複数のMerchandiseに関心を持ち、1つのMerchandiseが複数の取引先責任者に関連付けられることを表現できます。"}],"a":["D"]},{"n":71,"q":"Northern Trail Outfittersは、カスタムオブジェクトReferral SourceのReferral Date項目が更新されたときに、親オブジェクトReferralも更新する必要があると要求しています。管理者はこの要求を満たすためにどの自動化ソリューションを使用するべきですか？","o":[{"k":"A","t":"Lightning Webコンポーネント","e":"Lightning Webコンポーネントはカスタムユーザーインターフェースを構築するためのプログラミングフレームワークであり、データベースの変更をトリガーとして関連レコードを自動的に更新するための宣言的な自動化ツールではありません。"},{"k":"B","t":"承認プロセス","e":"承認プロセスは、ユーザーにレコードの承認を求めるためのビジネスプロセスを自動化する機能です。特定の項目の更新をトリガーとして親オブジェクトを自動更新する要件を満たすためのツールではありません。"},{"k":"C","t":"ワークフロー項目自動更新","e":"ワークフロー項目自動更新は主従関係にある親レコードを更新することは可能ですが、参照関係の親レコードなど任意の関連レコードを柔軟に更新することはできません。関連レコードの更新には、プロセスビルダーやフローを使用するのが標準的な機能となります。"},{"k":"D","t":"プロセスビルダー","e":"正解です。プロセスビルダーは、レコードが作成または編集されたときにトリガーされ、そのレコードに関連する親レコードなどの項目を自動的に更新するアクションを簡単に設定できます。したがって、この要件を満たすための適切な自動化ソリューションです。"}],"a":["D"]},{"n":72,"q":"Universal Containers (UC) は、各取引先に関連付けられたオープンなケースの数を数え、毎週金曜日の夕方にこの値で取引先を更新したいと考えています。UCは常に数百のオープンなケースを抱えています。管理者はこの要求を完了するために何を使用するべきですか？","o":[{"k":"A","t":"レコードトリガーフローを使用する。","e":"レコードトリガーフローはレコードが作成、更新、または削除されたときに実行されます。毎週金曜日の夕方などの特定のスケジュールで定期的に実行するという今回の要件には適していません。"},{"k":"B","t":"スケジュールされたプロセスビルダーを使用する。","e":"プロセスビルダーにはレコードの変更をトリガーとしたスケジュール済みアクションがありますが、毎週特定の曜日や時間に一括で処理を自動実行するための機能ではありません。"},{"k":"C","t":"積み上げ集計項目を使用する。","e":"積み上げ集計項目は主従関係にある関連レコードの数を計算しますが、取引先とケースは標準の参照関係であるため、積み上げ集計項目を使用してケースの数をカウントすることはできません。"},{"k":"D","t":"スケジュールされたフローを使用する。","e":"正解です。スケジュールトリガーフロー（スケジュールされたフロー）を使用することで、毎週金曜日の夕方という指定したスケジュールでフローを定期実行できます。これにより、関連するオープンなケースの数を取得して取引先の項目を一括更新する要件を満たすことができます。"}],"a":["D"]},{"n":73,"q":"Northern Trail Outfittersは、組織内で取引先責任者階層を使用して、取引先責任者の関連付けを表示したいと考えています。取引先責任者階層に関して、管理者はどのようなことを考慮するべきでしょうか？","o":[{"k":"A","t":"取引先責任者階層に表示される取引先責任者は、ユーザーのレコードレベルのアクセス権に制限されます。","e":"正解です。取引先責任者階層はSalesforceのセキュリティモデル（共有設定など）を尊重するため、ユーザーは自身がアクセス権を持っている取引先責任者レコードのみを階層内で参照することができます。"},{"k":"B","t":"取引先責任者階層は、一度に3,000件の取引先責任者のみに制限されます。","e":"取引先責任者階層の表示において、一度に3,000件という制限は存在しません。そのため、管理者が考慮すべき事項ではありません。"},{"k":"C","t":"階層の列をカスタマイズすると、最近参照した取引先責任者のリストビューが変更されます。","e":"階層の列のカスタマイズはオブジェクトマネージャの「階層の列」という専用の設定項目から独立して行われます。そのため、設定を変更しても最近参照したリストビューには影響しません。"},{"k":"D","t":"取引先責任者階層に表示される取引先責任者では、共有設定は無視されます。","e":"共有設定が無視されることはありません。選択肢Aで説明した通り、取引先責任者階層の表示にはユーザーのレコードレベルのセキュリティと共有設定が厳格に適用されます。"}],"a":["A"]},{"n":74,"q":"Cloud Kicksの管理者は、カスタムオブジェクトの行動を更新し、その行動の主要な取引先責任者への参照項目を含めました。行動レポートを実行する際、関連する取引先責任者レコードの項目を参照したいと考えています。カスタムレポートに取引先責任者の項目を取り込むために、管理者は何をするべきでしょうか？","o":[{"k":"A","t":"行動に数式項目を設定して、取引先責任者の情報を入力する。","e":"レポートに項目を表示するためだけに数式項目を作成することは、システムの保守性を低下させ、項目数の制限に影響を与える可能性があるためベストプラクティスではありません。カスタムレポートタイプの編集機能を使用する方が適切です。"},{"k":"B","t":"カスタムの行動レポートタイプを編集し、参照を介して関連する項目を追加する。","e":"正解です。カスタムレポートタイプを編集する際、参照先の項目を追加する機能を使用することで、参照関係にある親オブジェクト（この場合は取引先責任者）の項目をレポートレイアウトに直接追加できます。これにより、レポート上で関連レコードのデータを簡単に参照できるようになります。"},{"k":"C","t":"行動を主オブジェクト、取引先責任者を関連オブジェクトとして、新しいレポートタイプを作成する。","e":"オブジェクト間に参照関係がある場合、既存のレポートタイプのレイアウトを編集して参照先の項目を追加するだけで要件を満たすことができるため、新しいレポートタイプを新規作成する必要はありません。"},{"k":"D","t":"要求通りに行動と取引先責任者のデータを表示するために、検索条件を含むダッシュボードを使用する。","e":"ダッシュボードはデータを視覚的に表示するためのツールであり、基礎となるカスタムレポート自体に新しい項目を追加する目的には使用できません。レポートに項目を取り込むには、レポートタイプの設定を調整する必要があります。"}],"a":["B"]},{"n":75,"q":"AW Computingは、ユーザーが取引先の年間売上項目を負の値、または1000億ドルを超える金額に更新するのを防ぎたいと考えています。管理者はこの要求をどのように達成するべきでしょうか？","o":[{"k":"A","t":"取引先の売上が0未満、または1000億を超える場合にエラーを表示する入力規則を作成する。","e":"正解です。入力規則を使用すると、ユーザーが保存しようとしたデータが指定された条件を満たしているかを検証できます。この場合、売上が0未満または1000億を超える場合にエラーメッセージを表示する数式を設定することで、不適切な値での更新を完全に防ぐことができます。"},{"k":"B","t":"取引先の売上が負の値、または1000億を超える取引先を表示するスケジュール済みレポートを作成する。","e":"レポートを使用すれば事後に該当するレコードを特定することは可能ですが、ユーザーが要件に反する数値を入力して保存すること自体を未然に防ぐことはできません。"},{"k":"C","t":"ページレイアウトで取引先の売上項目を必須にする。","e":"項目を必須にすると、ユーザーは空欄のまま保存できなくなりますが、入力される数値の範囲（負の値や上限など）を制限する機能ではないため、今回の要件は満たせません。"},{"k":"D","t":"設定で取引先の売上制限を有効にし、最小値を0、最大値を1000億にする。","e":"Salesforceの標準機能として、設定メニューから数値項目に対して直接最小値や最大値の制限を有効にするような機能は存在しません。このような制限をかけるには入力規則を作成する必要があります。"}],"a":["A"]},{"n":76,"q":"モバイルナビゲーションメニューで利用できる3つの項目はどれですか？3つ選択してください。","o":[{"k":"A","t":"Lightningアプリケーションページ","e":"正解です。Lightningアプリケーションページは、モバイルアプリケーションのナビゲーションメニューに追加して、ユーザーにカスタムインターフェースを提供することができます。"},{"k":"B","t":"Lightningホームページ","e":"Lightningホームページはデスクトップ環境でのみサポートされており、Salesforceモバイルアプリケーションのナビゲーションメニューには追加できません。"},{"k":"C","t":"Chatter","e":"正解です。Chatterはモバイルナビゲーションメニューで利用可能な標準項目の1つであり、ユーザーはモバイルデバイスからフィードやグループにアクセスできます。"},{"k":"D","t":"ユーティリティバー","e":"ユーティリティバーはデスクトップ版のLightning Experience専用の機能であり、モバイルアプリケーションでは利用できません。"},{"k":"E","t":"ダッシュボード","e":"正解です。ダッシュボードはモバイルナビゲーションメニューに追加でき、ユーザーは外出先からでも重要なデータや指標を視覚的に確認できます。"}],"a":["A","C","E"]},{"n":77,"q":"Universal Containerの管理者は、項目の値に基づいてレコードを削除する自動化された方法を必要としています。管理者はどの自動化ソリューションを使用するべきでしょうか？","o":[{"k":"A","t":"ワークフロー","e":"ワークフローは項目自動更新、メールアラート、ToDoの作成、アウトバウンドメッセージを実行できますが、レコードを削除する機能は備えていません。"},{"k":"B","t":"プロセスビルダー","e":"プロセスビルダーは関連レコードの作成や更新などの多くのアクションを実行できますが、レコードを削除する機能はサポートされていません。"},{"k":"C","t":"フロービルダー","e":"正解です。フロービルダーはSalesforceプラットフォームの強力な自動化ツールであり、レコードの削除要素を使用して、指定した条件や項目の値に基づいてレコードを自動的に削除することができます。"},{"k":"D","t":"Automation Studio","e":"Automation StudioはMarketing Cloudの機能であり、Salesforceコアプラットフォーム上でレコードを直接自動削除するためのツールではありません。"}],"a":["C"]},{"n":78,"q":"AW Computingは、リードオブジェクトにマーケットセグメントという新しいカスタムテキスト項目を追加しました。リードが取引開始されるとき、この新しい項目は取引先レコードにコピーされません。リードのマーケットセグメント項目が、日常的に取引開始された取引先レコードに確実にコピーされるようにするために、管理者は何をするべきでしょうか？","o":[{"k":"A","t":"リードのマーケットセグメント項目が取引先の適切な項目にマッピングされていることを確認する。","e":"正解です。リードのカスタム項目を取引開始時に取引先、取引先責任者、または商談のカスタム項目に引き継ぐには、設定のリードの項目の対応付けでマッピングを明示的に行う必要があります。"},{"k":"B","t":"取引先に、新しいリード項目とまったく同じ名前の項目があることを確認する。","e":"項目名やデータ型が同一であっても、システムの標準機能として自動的にデータが引き継がれるわけではありません。必ず項目の対応付けを手動で設定する必要があります。"},{"k":"C","t":"取引先のその項目に値が確実にあるようにする入力規則を作成する。","e":"入力規則はレコードを保存する際のデータの妥当性を検証する機能であり、取引開始時に別のオブジェクトからデータをコピーしたり引き継いだりする役割は持っていません。"},{"k":"D","t":"カスタム項目をリードから取引先にコピーするレコードトリガフローを作成する。","e":"フローを構築してデータをコピーすることは技術的に可能ですが、リードの取引開始時の項目マッピングは標準機能で用意されているため、フローのような自動化ツールを新規に作成するのはベストプラクティスではありません。"}],"a":["A"]},{"n":79,"q":"Cloud Kicksのカスタマーサクセスエージェントが休暇に入るため、複数のケースの所有者を変更する必要があります。この要求を満たすことができる2人のユーザーはどれですか？2つ選択してください。","o":[{"k":"A","t":"取引先に対する参照権限を持つユーザー。","e":"取引先の参照権限があるだけでは、関連するケースの所有権を変更することはできません。ケースの所有者を変更するには、レコードに対するフルアクセス権やケースの転送権限など、より上位の権限が必要です。"},{"k":"B","t":"エージェントの上のマネージャーロールを持つユーザー。","e":"正解です。ロール階層においてレコード所有者よりも上位に位置するマネージャーは、部下が所有するレコードに対してフルアクセス権を持つため、ケースの所有者を変更することができます。"},{"k":"C","t":"システム管理者プロファイルを持つユーザー。","e":"正解です。システム管理者プロファイルにはすべてのデータの編集権限が含まれており、組織内のすべてのレコードへのフルアクセス権を持つため、ケースの所有者を自由に変更することができます。"},{"k":"D","t":"ケースの管理権限を持つユーザー。","e":"ケースの管理という権限はサポート設定やメール-to-ケースなどの設定を管理するためのものであり、特定のレコードの所有者を変更する権限を直接付与するものではありません。所有者の変更にはレコード自体への適切なアクセス権やフルアクセス権が必要です。"}],"a":["B","C"]},{"n":80,"q":"Cloud Kicksの管理者は、処理時間を向上させるために、リードの作成時に単純な項目更新を行っている2つの古いワークフロールールを置き換えるよう依頼されました。管理者はワークフロールールを置き換えるためにどのツールを使用するべきでしょうか？","o":[{"k":"A","t":"クイックアクションフロー","e":"クイックアクションフローはユーザーが手動でアクションをクリックしたときに起動するものであり、レコード作成時の自動的な項目更新を目的とするものではありません。"},{"k":"B","t":"保存前フロー","e":"正解です。保存前フローは、レコードがデータベースに保存される前に実行されるため処理速度が非常に速く、同一レコードの単純な項目更新を行う古いワークフロールールを置き換えるための最適なツールです。"},{"k":"C","t":"スケジュールフロー","e":"スケジュールフローは指定された日時に基づいて実行されるものであり、リードが作成されたというイベントをトリガーとして即座に実行する用途には適していません。"},{"k":"D","t":"画面フロー","e":"画面フローはユーザーから情報を収集するための画面を表示するものであり、バックグラウンドで自動的にトリガーされる項目更新の処理には使用されません。"}],"a":["B"]},{"n":81,"q":"Dreamhouse Realtyのエージェントは、オープンハウスの行動の夜をダブルブッキングしています。行動マネージャーは、エージェントが行動の詳細と希望日を記入するのを支援する行動提出プロセスを望んでいます。管理者はこの要求をどのように達成するべきでしょうか？","o":[{"k":"A","t":"ワークフロールールを作成して、行動の日付項目を更新する。","e":"ワークフロールールによる項目の自動更新は、ダブルブッキングを防止するための事前の確認プロセスを提供するものではないため、希望日を提出して承認を得るという今回の要件には適していません。"},{"k":"B","t":"キャンペーンオブジェクトに承認プロセスを作成する。","e":"正解です。承認プロセスを使用することで、エージェントが行動の詳細や希望日を入力して提出し、マネージャーがそれを確認して承認または却下するという一連のワークフローを構築できます。これにより、管理者が日程を適切に管理し、ダブルブッキングを未然に防ぐことが可能になります。"},{"k":"C","t":"他のエージェントが行動を表示できるように共有ルールを作成する。","e":"共有ルールはレコードへのアクセス権を拡張するための機能です。他のエージェントが既存の行動を見られるようになっても、希望日を提出してマネージャーの許可を得るプロセスを構築することはできないため、根本的な解決策にはなりません。"},{"k":"D","t":"エージェントが行動の希望日を要求するためのキャンペーンを作成する。","e":"キャンペーンというレコードを作成するだけでは、エージェントが詳細を入力して提出し、マネージャーがそれを審査するという承認のプロセスを自動化することはできません。提出と確認の流れを適切に管理するには承認プロセスを構築する必要があります。"}],"a":["B"]},{"n":82,"q":"Ursa Major Solarは、サービスチーム向けにSalesforceを評価しており、標準でどのオブジェクトが利用可能かを知りたいと考えています。サポートのユースケースを検討している管理者が利用できる3つの標準オブジェクトはどれですか？3つ選択してください。","o":[{"k":"A","t":"契約","e":"正解です。契約はSalesforceの標準オブジェクトであり、サポートプロセスにおいて顧客とのサービスレベルアグリーメントやサポート契約などを管理するために使用されます。"},{"k":"B","t":"ケース","e":"正解です。ケースは顧客からの問い合わせや問題を追跡および解決するための標準オブジェクトであり、サポートのユースケースにおいて中心的な役割を果たします。"},{"k":"C","t":"チケット","e":"Salesforceにはチケットという名前の標準オブジェクトは存在しません。顧客からの問い合わせは通常ケースオブジェクトを使用して管理されます。"},{"k":"D","t":"要求","e":"Salesforceには要求という名前の標準オブジェクトは存在しません。顧客からのリクエストを管理したい場合はケースを使用するか、必要に応じてカスタムオブジェクトを作成します。"},{"k":"E","t":"取引先","e":"正解です。取引先はSalesforceの基盤となる標準オブジェクトであり、サポートを提供する対象の企業や個人の情報を管理するために不可欠です。"}],"a":["A","B","E"]},{"n":83,"q":"Ursa Major Solarの営業担当者は、商談の管理に苦労しています。経営陣は管理者に、営業担当者が商談の優先順位を付け、より多くの商談を成約できるように支援するよう依頼しました。管理者は何をすべきでしょうか？","o":[{"k":"A","t":"Einstein リードスコアリング","e":"Einstein リードスコアリングは、リードが取引開始される可能性を予測してスコアを付ける機能です。今回はすでに発生している商談の優先順位付けと成約を支援することが目的であるため、目的と異なります。"},{"k":"B","t":"Einstein 検索パーソナライゼーション","e":"Einstein 検索パーソナライゼーションは、ユーザーの過去の活動や好みに基づいて検索結果を個別に最適化する機能です。商談の優先順位付けや成約の支援に直接関連するものではありません。"},{"k":"C","t":"Einstein 活動キャプチャ","e":"Einstein 活動キャプチャは、メールやカレンダーの行動をSalesforceの関連レコードに自動的に追加する機能です。手入力を減らすことで生産性は向上しますが、商談の優先順位を提示する機能ではありません。"},{"k":"D","t":"Einstein 商談スコアリング","e":"正解です。Einstein 商談スコアリングは、人工知能を使用して各商談が成約する可能性を予測し、スコアを割り当てる機能です。これにより、営業担当者は成約の見込みが高い商談を特定して集中できるようになり、優先順位付けと成約数の向上を直接的に支援します。"}],"a":["D"]},{"n":84,"q":"Universal Containersのユーザーが退職しました。管理者はその後任のために新しいユーザーを作成する必要がありますが、利用可能なすべてのユーザーライセンスをすでに割り当てています。新しいユーザーのためにユーザーライセンスを解放するには、管理者は何をするべきでしょうか？","o":[{"k":"A","t":"元従業員のユーザーレコードを無効化する。","e":"正解です。退職したユーザーのレコードを無効化することで、そのユーザーが使用していたライセンスが解放され、新しいユーザーに割り当てることができるようになります。Salesforceではユーザーレコードを完全に削除することはできないため、無効化が正しい手順となります。"},{"k":"B","t":"元従業員のユーザーレコードを削除する。","e":"Salesforceでは、過去のレコードの所有権や履歴などの関連性を維持する必要があるため、ユーザーレコード自体をシステムから完全に削除することはできません。"},{"k":"C","t":"元従業員のユーザーレコードを凍結する。","e":"ユーザーの凍結は対象者のログインを即座にブロックする機能ですが、割り当てられているユーザーライセンスは解放されません。他のプロセスの管理者になっているなど、すぐに無効化できない場合の一時的な措置として使用されます。"},{"k":"D","t":"元ユーザーのレコードを新しいユーザーに変更する。","e":"既存のユーザーレコードの情報を新しいユーザーの情報で上書きすることは、過去のデータの作成者や更新者の履歴が不正確になってしまうため、監査やデータ整合性の観点から推奨されません。必ず新しいユーザーレコードを作成する必要があります。"}],"a":["A"]},{"n":85,"q":"DreamHouse Realityは、取引先とケースのカテゴリ項目で一貫した選択リスト値を使用し、レコードタイプに応じてそれぞれの値を対応させる必要があります。管理者はこの要件を満たすためにどの2つの機能を使用するべきでしょうか？2つ選択してください。","o":[{"k":"A","t":"連動選択リスト","e":"正解です。連動選択リストは、制御項目の値に基づいて利用可能な値を制限する機能であり、特定の条件に合わせてユーザーに適切な選択肢を表示するために活用できます。"},{"k":"B","t":"グローバル選択リスト","e":"グローバル選択リストは複数のオブジェクト間で選択リストの値を一元管理して一貫性を保つための機能ですが、レコードタイプごとの値の制御を単独で行うものではありません。"},{"k":"C","t":"複数選択リスト","e":"複数選択リストはユーザーが複数の値を同時に選択できるようにするデータ型であり、一貫した値の管理やレコードタイプに基づく表示の制御という要件を直接満たすものではありません。"},{"k":"D","t":"カスタム選択リスト","e":"正解です。取引先とケースに独自のカテゴリ項目を持たせるためには、対象のオブジェクトにカスタム選択リスト項目を作成し、レコードタイプごとに利用可能な値を割り当てる設定を行う必要があります。"}],"a":["A","D"]},{"n":86,"q":"Universal Containersの管理者は、商談の金額が500,000ドルに達したときに営業ディレクターにアラートをトリガーする簡単な方法を必要としています。この要件を満たすために、管理者は何を設定するべきでしょうか？","o":[{"k":"A","t":"金額に対して大規模商談アラートを設定する。","e":"正解です。大規模商談アラートは、商談が指定された金額や確度に達したときに、指定されたユーザーに自動的にメール通知を送信する標準機能です。"},{"k":"B","t":"商談更新アラートを有効にする。","e":"商談更新アラートは、マネージャーが直属の部下に対して、所有する進行中の商談の定期的なレポートをスケジュールして送信する機能であり、特定の金額に達したときにリアルタイムでトリガーされるアラートではありません。"},{"k":"C","t":"カンバンビューでの商談の警告。","e":"カンバンビューでの商談の警告は、ToDoがない、または期限切れのToDoがある商談に対して視覚的な警告を表示する機能であり、金額のしきい値に基づいたメールアラートを送信するものではありません。"},{"k":"D","t":"ホームページの主要な商談コンポーネント。","e":"ホームページの主要な商談コンポーネントは、ユーザーにとって重要な商談をリスト表示するものであり、特定の条件が満たされたときにアラートをトリガーする機能ではありません。"}],"a":["A"]},{"n":87,"q":"DreamHouse Realtyは、将来の内見が蓄積されすぎるのを防ぐため、内見を今年中にスケジュールすることを求めています。内見日に今年のデータのみが入力されるようにするには、どうすればよいですか？","o":[{"k":"A","t":"ユーザーの内見カレンダーをSalesforceに同期し、今年のみを表示するように絞り込む。","e":"カレンダーの同期や表示の絞り込みは、データの表示を制限するだけであり、ユーザーが不適切な日付のレコードを作成または保存すること自体を防ぐことはできません。"},{"k":"B","t":"今年スケジュールされていない内見日を表示するレポートを作成して更新する。","e":"レポートを使用して事後に誤ったデータを特定することは可能ですが、レコードが保存される前にシステム側で入力をブロックすることはできません。"},{"k":"C","t":"ユーザーが今年の内見日のみを追加すべきであることがわかるように、ヘルプテキストを追加する。","e":"ヘルプテキストはユーザーに入力の手引きを提供しますが、システムとしての強制力はないため、ユーザーが無視して今年以外の日付を入力するのを防ぐことはできません。"},{"k":"D","t":"内見日に今年のデータが含まれていることを確認する入力規則を作成する。","e":"正解です。入力規則を使用することで、ユーザーが入力した日付が現在の年内であるかをシステムが自動的に検証し、条件を満たさない場合はエラーメッセージを表示して保存をブロックすることができます。これにより、要件を確実に満たすことができます。"}],"a":["D"]},{"n":88,"q":"Cloud Kicksはカスタム項目を削除することを決定しました。削除されると、その項目のデータはどうなりますか？","o":[{"k":"A","t":"項目内のデータは20日間保存されます。","e":"正解です。Salesforceでは、削除されたカスタム項目とそのデータは即座に完全に削除されるのではなく、一定期間（現在の標準仕様では15日間ですが、本試験問題の意図ではこの選択肢となります）保存され、その期間内であればオブジェクトマネージャから復元することが可能です。"},{"k":"B","t":"データは完全に削除されます。","e":"項目を削除した直後にデータが完全に削除されるわけではありません。一定の猶予期間が経過するか、管理者が手動で完全に削除（消去）するまではシステム内に保持されます。"},{"k":"C","t":"項目に関連付けられたデータは必須になります。","e":"カスタム項目を削除することと、そのデータが必須になることは無関係です。削除された項目はユーザーインターフェースから見えなくなります。"},{"k":"D","t":"データはごみ箱から復元可能です。","e":"レコードを削除した場合はごみ箱から復元しますが、削除された項目とそのデータはごみ箱ではなく、オブジェクトマネージャの項目と関係にある「削除された項目」という専用のセクションから復元を行います。"}],"a":["A"]},{"n":89,"q":"DreamHouse Realtyの管理者は、ケースのページレイアウトにメールクイックアクションを追加しましたが、ケースフィードでそのアクションを表示できません。クイックアクションが想定通りに表示されるようにするには、どの機能を有効にする必要がありますか？","o":[{"k":"A","t":"メール通知","e":"メール通知は、特定のイベントが発生したときにユーザーに通知を送信する機能ですが、ケースフィードでのメールクイックアクションの表示を制御するものではありません。"},{"k":"B","t":"メール-to-ケース","e":"正解です。ケースフィードでメールアクションを利用および表示するためには、メール-to-ケース機能を有効にする必要があります。これが有効化されていないと、ページレイアウトにアクションを追加してもフィードには表示されません。"},{"k":"C","t":"メールアラート","e":"メールアラートは、自動化プロセスから事前に定義されたメールを自動送信するための機能であり、ケースフィード上のメール作成アクションの表示を有効にするものではありません。"},{"k":"D","t":"メールテンプレート","e":"メールテンプレートは送信するメールの定型文を作成するための機能ですが、ケースフィード上でメールクイックアクションの機能自体を有効化して表示させるための設定ではありません。"}],"a":["B"]},{"n":90,"q":"AW Computingの管理者は、Salesforceへのログインに問題があるユーザーと協力しています。ユーザーがログインできない理由を特定するために、管理者は何をするべきでしょうか？","o":[{"k":"A","t":"ユーザーのログイン履歴を確認する。","e":"正解です。ユーザーのレコードまたは設定メニューからログイン履歴を確認することで、ログインの成功や失敗、およびその理由（無効なパスワード、IP制限、ロックアウトなど）を特定し、トラブルシューティングを行うことができます。"},{"k":"B","t":"設定変更履歴を実行して、ログイン試行を確認する。","e":"設定変更履歴は、管理者が組織の設定に対して行った変更を追跡する機能であり、個々のユーザーのログイン試行や失敗を記録するものではありません。"},{"k":"C","t":"パスワードポリシーが遵守されていることを確認するために、パスワード履歴を抽出する。","e":"パスワード履歴は以前使用したパスワードの再利用を防ぐための設定であり、ユーザーが現在ログインできない理由を調査して特定するためのツールではありません。"},{"k":"D","t":"プロファイルのセキュリティトークンをリセットする。","e":"セキュリティトークンはAPIや外部アプリケーションからのアクセスに使用されるものであり、通常の画面からのログイン失敗の理由を特定するものではありません。また、セキュリティトークンのリセットはプロファイル単位ではなくユーザー単位で行われます。"}],"a":["A"]},{"n":91,"q":"営業マネージャーは、商談のフェーズに基づいて重要な値を表示するために何を実装できるかを知りたいと考えています。この要件を満たすために、管理者はどのツールを使用するべきでしょうか？","o":[{"k":"A","t":"商談プロセス","e":"商談プロセスは、商談の特定のレコードタイプで利用可能なフェーズの選択リスト値を制御するために使用されます。特定のフェーズに基づいて重要な項目を強調表示するための機能ではありません。"},{"k":"B","t":"動的フォーム","e":"動的フォームはレコードページの項目やセクションを特定の条件に基づいて表示するための機能ですが、フェーズの進行に合わせて視覚的に主要な項目を強調表示し、ガイダンスを提供する目的にはパスが最適です。"},{"k":"C","t":"パスの主要項目","e":"正解です。パス機能を使用することで、商談のフェーズごとに主要項目を設定し、各フェーズでユーザーが入力または確認すべき重要な値をレコードページの上部に視覚的に目立たせて表示させることができます。"},{"k":"D","t":"ワークフロールール","e":"ワークフロールールは、特定の条件が満たされたときに項目の自動更新やメールアラートなどのアクションを自動的に実行する機能であり、ユーザーインターフェース上で重要な値を表示するためのツールではありません。"}],"a":["C"]},{"n":92,"q":"Cloud Kicksのユーザーは、ケースページで自分の役割にとってより有用な情報を表示したいと考えています。管理者はページをより動的で使いやすくするためにどのようにするべきでしょうか？","o":[{"k":"A","t":"コンポーネントにコンポーネントの表示条件を追加する。","e":"正解です。Lightningアプリケーションビルダーでコンポーネントの表示条件を設定することで、ユーザーのプロファイルやレコードの項目の値などに基づいて、特定のコンポーネントの表示・非表示を動的に制御できます。これにより、ユーザーの役割に応じて必要な情報だけを提示する使いやすい画面を構築できます。"},{"k":"B","t":"レコード詳細コンポーネントから項目を削除する。","e":"レコード詳細コンポーネントから項目を削除すると、そのページレイアウトを割り当てられているすべてのユーザーに対して一律で項目が非表示になります。ユーザーの役割に応じて動的に情報を切り替えるという目的は達成できません。"},{"k":"C","t":"ページから余分なコンポーネントを削除する。","e":"ページからコンポーネントを削除するのもすべてのユーザーに影響を与えます。特定の役割を持つユーザーにとって不要なものでも、他の役割のユーザーには必要かもしれないため、動的な解決策にはなりません。"},{"k":"D","t":"検索条件を含むタブコンポーネントをさらに追加する。","e":"タブを使用して情報を整理することは画面をすっきりさせるのに役立ちますが、タ
